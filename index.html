/* Mavjud genBarcode()/genQr() dan foydalanib, DB.products ichida
   takrorlanmaydigan qiymat qaytaradi. Endi Mahsulotlar, Tovarlar va Ombor
   bitta bazadan ishlagani uchun bitta unikallik tekshiruvi yetarli. */
function dkUniqueBarcode(){
  let code;
  do{ code = genBarcode(); } while(DB.products.some(pp=>pp.barcode===code));
  return code;
}
function dkUniqueQr(seed){
  let code;
  do{ code = genQr(seed||'DK'); } while(DB.products.some(pp=>pp.qrCode===code));
  return code;
}
function dkUniqueSku(){
  let sku;
  do{ sku = 'DK-'+Math.random().toString(36).slice(2,8).toUpperCase(); } while(DB.products.some(pp=>pp.sku===sku));
  return sku;
}

/* Yagona, optimallashtirilgan universal qidiruv funksiyasi.
   Nom, brend, SKU, shtrix-kod, QR-kod va kategoriya nomi bo'yicha qidiradi
   va natijalarni ustuvorlik tartibida qaytaradi. `list` berilmasa, butun
   DB.products bo'yicha qidiradi. */
function dkSearchProducts(query, list){
  const source = list || DB.products;
  const q = dkNormQuery(query);
  if(!q) return source.slice();
  const scored = [];
  source.forEach(p=>{
    const barcode = (p.barcode||'').toLowerCase();
    const qr = (p.qrCode||'').toLowerCase();
    const sku = (p.sku||'').toLowerCase();
    const name = (p.name||'').toLowerCase();
    const brand = (p.brand||'').toLowerCase();
    const catName = (p.category||'').toLowerCase();
    // Qadoq hajmi/o'lchami (masalan "450 g", "1 litr") — variantlarni ajratib qidirish uchun
    const packLabel = (p.size ? (p.size+' '+(p.unit||'')) : (p.unit||'')).toLowerCase().trim();
    let score = -1;
    if(barcode===q) score = 100;
    else if(qr===q) score = 90;
    else if(sku===q) score = 80;
    else if(name===q) score = 75;
    else if(packLabel===q) score = 70;
    else if(barcode.includes(q)) score = 60;
    else if(name.includes(q)) score = 50;
    else if(brand===q) score = 46;
    else if(brand.includes(q)) score = 40;
    else if(sku.includes(q)) score = 35;
    else if(qr.includes(q)) score = 30;
    else if(packLabel.includes(q)) score = 25;
    else if(catName.includes(q)) score = 20;
    if(score>=0) scored.push({p,score});
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.map(s=>s.p);
}

/* ---------------- Bir xil nomdagi boshqa qadoq variantlari ----------------
   Har bir variant DB.products'da mustaqil yozuv (o'z SKU/barcode/QR/qoldig'i
   bilan). Shu funksiya xuddi shu nom+kategoriyadagi BOSHQA variantlarni
   topadi — foydalanuvchiga "Coca Cola"ning 300g/450g/1L kabi barcha
   o'lchamlarini birgalikda ko'rsatish uchun (mahsulotlar bazasi bo'linmaydi,
   faqat ko'rinishda guruhlanadi). */
function dkSiblingVariants(p){
  const nm = (p.name||'').trim().toLowerCase();
  return DB.products.filter(x=> x.id!==p.id && (x.name||'').trim().toLowerCase()===nm && x.category===p.category);
}
function dkVariantsListHtml(p, openFn){
  const sibs = dkSiblingVariants(p);
  if(!sibs.length) return '';
  return `
    <div class="field">
      <label>Shu mahsulotning boshqa variantlari (${sibs.length})</label>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${sibs.map(s=>`
          <div onclick="closeModal();${openFn}('${s.id}')" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border-radius:10px;cursor:pointer;">
            <span style="font-weight:700;font-size:12.5px;">${pkgLabel(s)||s.unit}</span>
            <span style="font-size:11.5px;color:var(--text-faint);">${fmtQty(s.qty)} ${s.unit} qoldiq${s.isForSale?' · sotuvda':''}</span>
          </div>`).join('')}
      </div>
    </div>`;
}
/* "SOTUVDA" — Mahsulotlar kartochkasidan bosilganda xuddi shu DB.products
   yozuvi ustida ishlaydigan, Tovarlar bo'limidagi umumiy tvMarkForSale()
   funksiyasini chaqiradi (qo'shimcha nusxa yaratilmaydi), so'ng joriy
   sahifani (Mahsulotlar) qayta chizadi. */
function dkMarkForSale(id){ tvMarkForSale(id); renderPage(); }

function dkProdCardHtml(p){
  const forSale = !!p.isForSale;
  return `
      <div class="dk-prod-card" onclick="dkOpenProductDetail('${p.id}')">
        <div class="dk-prod-actions">
          <button class="btn-ghost" onclick="event.stopPropagation();dkOpenProductModal('${p.id}')" title="Tahrirlash">${icon('pencil')}</button>
          <button class="btn-ghost" onclick="event.stopPropagation();dkDeleteProduct('${p.id}')" title="O'chirish">${icon('trash-2')}</button>
        </div>
        <div class="dk-prod-img">${p.image?`<img src="${p.image}" alt="">`:(p.emoji||catIcon(p.category))}${p.qrCode?`<span class="dk-qr-badge" title="QR-kod mavjud">${icon('qr-code')}</span>`:''}</div>
        <div class="dk-prod-name">${p.name}</div>
        <div class="dk-prod-meta">${[p.category,p.brand,((pkgLabel(p)||p.unit))].filter(Boolean).join(' · ')||'—'}</div>
        ${p.barcode? `<div class="dk-prod-meta cell-mono">${p.barcode}</div>`:''}
        <button class="dk-prod-sale-btn ${forSale?'active':''}" onclick="event.stopPropagation();dkMarkForSale('${p.id}')" ${forSale?'disabled':''}>${forSale?icon('check')+' Sotuvda':icon('tag')+' SOTUVDA'}</button>
      </div>`;
}

function renderProducts(){
  return dkView==='category' && dkCurrentCatId ? renderDkCategoryPage() : renderDkCategoriesPage();
}

/* Kategoriyalar sahifasi: qidiruv bo'sh bo'lsa kategoriya kartalari,
   yozilsa esa BARCHA kategoriyalardagi mos mahsulotlar ko'rsatiladi.
   Faqat #dkCategoriesBody yangilanadi (renderPage() emas), shunda
   input fokusi va performance saqlanadi (real-time qidiruv uchun). */
function renderDkCategoriesPage(){
  return `
  <div class="page-head">
    <div><h1>Mahsulotlar</h1><p>${DB.categories.length} ta kategoriya · ${(DB.brands||[]).length} ta firma/brend</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button id="dkCatBrandSettingsBtn" class="btn btn-outline compact-action-btn" onclick="dkOpenCatBrandSettingsModal()">${dkCatBrandSettingsOpen?icon('check')+' Tayyor':icon('settings')+' Sozlamalar'}</button>
    </div>
  </div>
  <div class="dk-search-row dk-search-modern">
    <div class="dk-search-input-wrap">
      ${icon('search','dk-search-icon')}
      <input type="text" id="dkGlobalSearchInput" placeholder="Mahsulot, shtrix-kod yoki QR kod orqali qidirish..." value="${dkCatSearch}"
        oninput="dkCatSearch=this.value;dkRenderCategoriesBody();dkToggleClearBtn('dkGlobalSearchInput','dkGlobalSearchClear')"
        onkeydown="if(event.key==='Escape'){dkClearGlobalSearch();}">
      <button class="dk-search-clear" id="dkGlobalSearchClear" style="display:${dkCatSearch?'flex':'none'}" onclick="dkClearGlobalSearch()" title="Tozalash">${icon('x')}</button>
    </div>
    ${isMobileDevice()? `<button class="btn btn-outline dk-scan-btn" onclick="dkOpenScanModal()" title="QR/Shtrix-kod skanerlash">${icon('camera')}</button>` : ''}
  </div>
  <div class="dk-filter-row">
    <select id="dkFilterCategorySelect" onchange="dkFilterCategory=this.value;dkRenderCategoriesBody();">
      <option value="">Kategoriya: Barchasi</option>
      ${DB.categories.map(c=>`<option value="${c}" ${dkFilterCategory===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <select id="dkFilterBrandSelect" onchange="dkFilterBrand=this.value;dkRenderCategoriesBody();">
      <option value="">Firma/Brend: Barchasi</option>
      ${(DB.brands||[]).map(b=>`<option value="${b.id}" ${dkFilterBrand===b.id?'selected':''}>${b.name}</option>`).join('')}
    </select>
  </div>
  <div id="dkCategoriesBody">${dkCategoriesBodyHtml()}</div>`;
}
function dkCategoriesBodyHtml(){
  const q = dkNormQuery(dkCatSearch);
  const hasFilter = !!(dkFilterCategory || dkFilterBrand);
  if(q || hasFilter){
    let results = q ? dkSearchProducts(q) : DB.products.slice();
    if(dkFilterCategory) results = results.filter(p=>p.category===dkFilterCategory);
    if(dkFilterBrand) results = results.filter(p=>p.brandId===dkFilterBrand);
    return `
      <div class="dk-search-count">${results.length} ta mahsulot topildi</div>
      <div class="dk-prod-grid">${results.map(p=>dkProdCardHtml(p)).join('')}</div>
      ${!results.length? dkSearchEmptyHtml() : ''}`;
  }
  // Excel orqali import qilingan, hali kategoriyasi tanlanmagan mahsulotlar —
  // hech qaysi kategoriya kartasida ko'rinmaydi (chunki category bo'sh), shu
  // sababli darhol ko'rinishi uchun bu yerda alohida bo'lim sifatida chiqariladi.
  const uncategorized = DB.products.filter(p=>!p.category);
  return `
  ${uncategorized.length? `
  <div class="dk-search-count" style="display:flex;align-items:center;gap:6px;">${icon('alert-triangle')} Kategoriyasiz mahsulotlar (${uncategorized.length}) — kategoriyani tahrirlash orqali belgilang</div>
  <div class="dk-prod-grid" style="margin-bottom:22px;">${uncategorized.map(p=>dkProdCardHtml(p)).join('')}</div>` : ''}
  <div class="dk-cat-grid">
    ${DB.categories.map(name=>`
      <div class="dk-cat-card" onclick="dkOpenCategory('${jsEsc(name)}')">
        <div class="dk-cat-icon">${catVisualHtml(name)}</div>
        <div class="dk-cat-name">${name}</div>
      </div>`).join('')}
    <div class="dk-cat-card dk-cat-add" onclick="dkOpenCategoryModal()">
      ${icon('plus')}<div class="dk-cat-name">Kategoriya yaratish</div>
    </div>
  </div>`;
}
function dkRenderCategoriesBody(){
  const el = document.getElementById('dkCategoriesBody');
  if(!el) return;
  el.innerHTML = dkCategoriesBodyHtml();
  lucide.createIcons();
}
function dkClearGlobalSearch(){
  dkCatSearch='';
  const inp = document.getElementById('dkGlobalSearchInput'); if(inp) inp.value='';
  dkToggleClearBtn('dkGlobalSearchInput','dkGlobalSearchClear');
  dkRenderCategoriesBody();
}

/* Kategoriya ichidagi mahsulotlar sahifasi — shu yerdagi qidiruv ham
   xuddi shu dkSearchProducts() orqali (nom/brend/SKU/barcode/QR)
   ishlaydi, faqat shu kategoriya mahsulotlari doirasida. */
function renderDkCategoryPage(){
  const catName = dkCurrentCatId;
  if(!catName || !DB.categories.includes(catName)){ dkView='categories'; dkCurrentCatId=null; return renderDkCategoriesPage(); }
  return `
  <div class="page-head">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="btn-ghost" onclick="dkBackToCategories()">${icon('arrow-left')}</button>
      <div><h1>${catIcon(catName)} ${catName}</h1><p id="dkCatProdCount">${dkCategoryCountText(catName)}</p></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary compact-action-btn" onclick="dkOpenProductModal(null)">${icon('plus')} Mahsulot qo'shish</button>
    </div>
  </div>
  <div class="dk-search-row dk-search-modern">
    <div class="dk-search-input-wrap">
      ${icon('search','dk-search-icon')}
      <input type="text" id="dkCatSearchInput" placeholder="Mahsulot, shtrix-kod yoki QR kod orqali qidirish..." value="${dkProdSearch}"
        oninput="dkProdSearch=this.value;dkRenderCategoryBody();dkToggleClearBtn('dkCatSearchInput','dkCatSearchClear')"
        onkeydown="if(event.key==='Escape'){dkClearCatSearch();}">
      <button class="dk-search-clear" id="dkCatSearchClear" style="display:${dkProdSearch?'flex':'none'}" onclick="dkClearCatSearch()" title="Tozalash">${icon('x')}</button>
    </div>
    ${isMobileDevice()? `<button class="btn btn-outline dk-scan-btn" onclick="dkOpenScanModal()" title="QR/Shtrix-kod skanerlash">${icon('camera')}</button>` : ''}
  </div>
  <div class="dk-filter-row">
    <select id="dkCatFilterBrandSelect" onchange="dkFilterBrand=this.value;dkRenderCategoryBody();">
      <option value="">Firma/Brend: Barchasi</option>
      ${(DB.brands||[]).map(b=>`<option value="${b.id}" ${dkFilterBrand===b.id?'selected':''}>${b.name}</option>`).join('')}
    </select>
  </div>
  <div id="dkCategoryBody">${dkCategoryBodyHtml(catName)}</div>`;
}
function dkCategoryRows(catName){
  let catProducts = DB.products.filter(p=>p.category===catName);
  if(dkFilterBrand) catProducts = catProducts.filter(p=>p.brandId===dkFilterBrand);
  const q = dkNormQuery(dkProdSearch);
  return q ? dkSearchProducts(q, catProducts) : catProducts;
}
function dkCategoryCountText(catName){
  const rows = dkCategoryRows(catName);
  return `${rows.length} ta mahsulot${dkNormQuery(dkProdSearch)?' topildi':''}`;
}
function dkCategoryBodyHtml(catName){
  const rows = dkCategoryRows(catName);
  return `
  <div class="dk-prod-grid">${rows.map(p=>dkProdCardHtml(p)).join('')}</div>
  ${!rows.length? dkSearchEmptyHtml() : ''}`;
}
function dkRenderCategoryBody(){
  const catName = dkCurrentCatId;
  if(!catName) return;
  const bodyEl = document.getElementById('dkCategoryBody');
  if(bodyEl) bodyEl.innerHTML = dkCategoryBodyHtml(catName);
  const countEl = document.getElementById('dkCatProdCount');
  if(countEl) countEl.textContent = dkCategoryCountText(catName);
  lucide.createIcons();
}
function dkClearCatSearch(){
  dkProdSearch='';
  const inp = document.getElementById('dkCatSearchInput'); if(inp) inp.value='';
  dkToggleClearBtn('dkCatSearchInput','dkCatSearchClear');
  dkRenderCategoryBody();
}

function dkOpenCategory(name){ dkCurrentCatId=name; dkView='category'; dkProdSearch=''; renderPage(); }
function dkBackToCategories(){ dkView='categories'; dkCurrentCatId=null; renderPage(); }

/* ---------------- Kategoriya yaratish ---------------- */
/* dkOpenCategoryModal(editName) — editName berilmasa "Yangi kategoriya",
   berilsa mavjud kategoriyani tahrirlash (nomi/ikonka/rasm) rejimida ochiladi.
   Nomi o'zgartirilsa, DB.categories/categoryIcons/categoryImages va shu
   kategoriyaga tegishli BARCHA mahsulotlarning p.category maydoni ham
   kaskad ravishda yangilanadi (mahsulotlar "yetim" qolmaydi). */
function dkOpenCategoryModal(editName){
  dkImageData = editName ? (DB.categoryImages && DB.categoryImages[editName] || null) : null;
  openModal(`
    <div class="modal-head"><h3>${editName?"Kategoriyani tahrirlash":"Yangi kategoriya"}</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nomi</label><input id="dk_cat_name" value="${editName?editName:''}" placeholder="Masalan: Sut mahsulotlari"></div>
      <div class="field"><label>Ikonka (emoji, ixtiyoriy)</label><input id="dk_cat_icon" value="${editName?catIcon(editName):''}" placeholder="Masalan: 🥛" maxlength="4"></div>
      <div class="field">
        <label>Rasm yuklash (ixtiyoriy)</label>
        <div class="dk-img-upload">
          <div class="dk-img-preview" id="dk_cat_img_preview">${dkImageData?`<img src="${dkImageData}">`:icon('image')}</div>
          <input type="file" accept="image/*" onchange="dkFileToBase64(this,src=>{dkImageData=src;document.getElementById('dk_cat_img_preview').innerHTML='<img src=\\''+src+'\\'>';})">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Bekor qilish</button>
      <button class="btn btn-primary" onclick="dkSaveCategory(${editName?`'${jsEsc(editName)}'`:'null'})">${icon('check')} Saqlash</button>
    </div>
  `);
}
function dkSaveCategory(editName){
  const name = document.getElementById('dk_cat_name').value.trim();
  if(!name){ toast("Kategoriya nomini kiriting",true); return; }
  const dup = DB.categories.some(c=>c.toLowerCase()===name.toLowerCase() && c.toLowerCase()!==(editName||'').toLowerCase());
  if(dup){ toast("Bu kategoriya allaqachon mavjud",true); return; }
  const icn = document.getElementById('dk_cat_icon').value.trim();
  if(!DB.categoryIcons) DB.categoryIcons = {};
  if(!DB.categoryImages) DB.categoryImages = {};
  if(editName && DB.categories.includes(editName)){
    // Tahrirlash: nomi o'zgargan bo'lsa kaskad yangilash
    const idx = DB.categories.indexOf(editName);
    DB.categories[idx] = name;
    if(name!==editName){
      delete DB.categoryIcons[editName];
      const img = DB.categoryImages[editName];
      delete DB.categoryImages[editName];
      DB.products.forEach(p=>{ if(p.category===editName) p.category = name; });
      if(img && !dkImageData) DB.categoryImages[name] = img;
    }
    DB.categoryIcons[name] = icn || '📦';
    if(dkImageData) DB.categoryImages[name] = dkImageData;
    logActivity(`"${editName}" kategoriyasini "${name}" ga tahrirladi`);
    toast("Kategoriya yangilandi");
  } else {
    DB.categories.push(name);
    DB.categoryIcons[name] = icn || '📦';
    if(dkImageData) DB.categoryImages[name] = dkImageData;
    logActivity(`"${name}" nomli yangi kategoriya qo'shdi`);
    toast("Kategoriya qo'shildi");
  }
  CATEGORIES = DB.categories;
  save(); closeModal(); renderPage();
}
/* O'chirish xavfsizligi: agar kategoriyaga mahsulotlar bog'langan bo'lsa,
   to'g'ridan-to'g'ri o'chirilmaydi — avval ogohlantirish ko'rsatiladi. */
function dkDeleteCategoryConfirm(name){
  const count = DB.products.filter(p=>p.category===name).length;
  if(count>0){
    alert(`Bu kategoriyaga ${count} ta mahsulot bog'langan. O'chirish uchun avval mahsulotlarni boshqa kategoriyaga biriktiring.`);
    return;
  }
  if(!confirm(`"${name}" kategoriyasini o'chirishni tasdiqlaysizmi?`)) return;
  DB.categories = DB.categories.filter(c=>c!==name);
  if(DB.categoryIcons) delete DB.categoryIcons[name];
  if(DB.categoryImages) delete DB.categoryImages[name];
  CATEGORIES = DB.categories;
  save();
  logActivity(`"${name}" nomli kategoriyani o'chirdi`);
  toast("Kategoriya o'chirildi");
  dkRenderCategoryManageList();
  renderMenu();
}
/* ---------------- ⚙️ Sozlamalar: Kategoriya + Firma/Brend birlashtirilgan
   boshqaruv oynasi. Oddiy holatda kartalarda ✏️/🗑️ ko'rinmaydi — faqat

  dkBrandManageSearch = '';

    <div class="modal-head"><h3>${icon('settings')} Kategoriya va Firma/Brend sozlamalari</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="dk-settings-section">
        <h4 style="margin:0 0 10px;display:flex;align-items:center;gap:6px;">${icon('layers')} Kategoriyalar</h4>
        <div class="dk-search-row dk-search-modern" style="margin-bottom:10px;">
          <div class="dk-search-input-wrap">
            ${icon('search','dk-search-icon')}
            <input type="text" id="dkCatManageSearch" placeholder="Kategoriya qidirish..." oninput="dkCatManageSearch=this.value;dkRenderCategoryManageList()">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:12px;" onclick="closeModal();dkOpenCategoryModal()">${icon('plus')} Yangi kategoriya</button>

      </div>
      <div class="dk-settings-section" style="margin-top:22px;padding-top:18px;border-top:1px solid #EEF1EF;">
        <h4 style="margin:0 0 10px;display:flex;align-items:center;gap:6px;">${icon('tag')} Firma / Brendlar</h4>
        <div class="dk-search-row dk-search-modern" style="margin-bottom:10px;">
          <div class="dk-search-input-wrap">
            ${icon('search','dk-search-icon')}
            <input type="text" id="dkBrandManageSearch" placeholder="Firma/brend qidirish..." oninput="dkBrandManageSearch=this.value;dkRenderBrandManageList()">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:12px;" onclick="dkOpenBrandFormModal()">${icon('plus')} Yangi firma/brend</button>
        <div id="dkBrandManageList"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">✓ Tayyor</button>
    </div>
  `, true);
  dkRenderCategoryManageList();
  dkRenderBrandManageList();
}
function dkRenderCategoryManageList(){
  const el = document.getElementById('dkCatManageList');
  if(!el) return;
  const q = dkNormQuery(dkCatManageSearch);
  const list = DB.categories.filter(c=>!q || c.toLowerCase().includes(q));
  el.innerHTML = list.length ? list.map(name=>{
    const count = DB.products.filter(p=>p.category===name).length;
    return `
    <div class="dk-manage-row">
      <div class="dk-cat-icon" style="width:36px;height:36px;font-size:16px;">${catVisualHtml(name)}</div>
      <div style="flex:1;">
        <div class="dk-manage-name">${name}</div>
        <div class="dk-manage-count">${count} ta mahsulot</div>
      </div>
      <button class="btn-ghost" onclick="closeModal();dkOpenCategoryModal('${jsEsc(name)}')" title="Tahrirlash">${icon('pencil')}</button>
      <button class="btn-ghost" onclick="dkDeleteCategoryConfirm('${jsEsc(name)}')" title="O'chirish">${icon('trash-2')}</button>
    </div>`;
  }).join('') : `<div class="empty-state">${icon('search')}<div>Kategoriya topilmadi</div></div>`;
  lucide.createIcons();
}

/* ================================================================
   FIRMA / BREND — alohida ID-based ma'lumotlar bazasi (DB.brands).
   Mahsulotga p.brandId orqali bog'lanadi. p.brand (matn) — mavjud
   qidiruv/kartochka/chek kabi ko'plab joylarda ishlatilgani uchun
   ATAYLAB brend nomi bilan sinxron saqlanadi (backward compatible).
   ================================================================ */
let dkBrandManageSearch = '';
function dkFindBrandByName(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  return (DB.brands||[]).find(b=>b.name.toLowerCase()===n) || null;
}
/* Nom bo'yicha mavjud brendni topadi yoki yangisini yaratadi, ID qaytaradi. */
function dkGetOrCreateBrandId(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return null;
  let b = dkFindBrandByName(trimmed);
  if(!b){ b = {id:uid('brand'), name:trimmed, status:'faol'}; if(!DB.brands) DB.brands=[]; DB.brands.push(b); }
  return b.id;
}
function dkRenderBrandManageList(){
  const el = document.getElementById('dkBrandManageList');
  if(!el) return;
  const q = dkNormQuery(dkBrandManageSearch);
  const list = (DB.brands||[]).filter(b=>!q || b.name.toLowerCase().includes(q));
  el.innerHTML = list.length ? list.map(b=>{
    const count = brandProductCount(b.id);
    return `
    <div class="dk-manage-row">
      <div style="flex:1;">
        <div class="dk-manage-name">${b.name} ${b.status==='nofaol'?'<span class="badge badge-gray">nofaol</span>':''}</div>
        <div class="dk-manage-count">${count} ta mahsulot</div>
      </div>
      <button class="btn-ghost" onclick="dkOpenBrandFormModal('${b.id}')" title="Tahrirlash">${icon('pencil')}</button>
      <button class="btn-ghost" onclick="dkDeleteBrandConfirm('${b.id}')" title="O'chirish">${icon('trash-2')}</button>
    </div>`;
  }).join('') : `<div class="empty-state">${icon('search')}<div>Firma/brend topilmadi</div></div>`;
  lucide.createIcons();
}
function dkOpenBrandFormModal(id){
  const b = id ? brandById(id) : null;
  openModal(`
    <div class="modal-head"><h3>${b?"Firma/brendni tahrirlash":"Yangi firma/brend"}</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nomi</label><input id="dk_brand_name" value="${b?b.name:''}" placeholder="Masalan: Coca-Cola"></div>
      <div class="field"><label>Holati</label>
        <select id="dk_brand_status">
          <option value="faol" ${!b||b.status==='faol'?'selected':''}>Faol</option>
          <option value="nofaol" ${b&&b.status==='nofaol'?'selected':''}>Nofaol</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal();dkOpenCatBrandSettingsModal()">Bekor qilish</button>
      <button class="btn btn-primary" onclick="dkSaveBrandForm(${b?`'${b.id}'`:'null'})">${icon('check')} Saqlash</button>
    </div>
  `);
}
function dkSaveBrandForm(id){
  const name = document.getElementById('dk_brand_name').value.trim();
  if(!name){ toast("Firma/brend nomini kiriting",true); return; }
  const status = document.getElementById('dk_brand_status').value;
  const dup = (DB.brands||[]).some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase());

/* Mahsulot qo'shish/tahrirlash oynasidagi "+ Yangi kategoriya..." /
   "+ Yangi firma/brend..." tanlanganda modalni yopmasdan tezkor qo'shish
   (4-bo'lim talabi). Qo'shilgach select darhol yangilanadi va yangi
   qiymat tanlangan holatda qoladi. */
function dkCategorySelectChanged(sel){
  if(sel.value!=='__add_new__') return;
  const name = prompt("Yangi kategoriya nomini kiriting:");
  const trimmed = (name||'').trim();
  if(!trimmed){ sel.value = dkModalCatName||''; return; }
  let finalName = trimmed;
  if(DB.categories.some(c=>c.toLowerCase()===trimmed.toLowerCase())){
    finalName = DB.categories.find(c=>c.toLowerCase()===trimmed.toLowerCase());
    toast("Bu kategoriya allaqachon mavjud, tanlandi");
  } else {
    DB.categories.push(trimmed);
    if(!DB.categoryIcons) DB.categoryIcons = {};
    DB.categoryIcons[trimmed] = '📦';
    CATEGORIES = DB.categories;
    logActivity(`"${trimmed}" nomli yangi kategoriya qo'shdi`);
    save();
    toast("Kategoriya qo'shildi");
  }
  dkModalCatName = finalName;
  sel.innerHTML = DB.categories.map(c=>`<option value="${c}" ${finalName===c?'selected':''}>${c}</option>`).join('')
    + `<option value="__add_new__">+ Yangi kategoriya...</option>`;
}
function dkBrandSelectChanged(sel){
  if(sel.value!=='__add_new__') return;
  const name = prompt("Yangi firma/brend nomini kiriting:");
  const trimmed = (name||'').trim();
  if(!trimmed){ sel.value=''; return; }
  let b = dkFindBrandByName(trimmed);
  if(b){
    toast("Bu firma/brend allaqachon mavjud, tanlandi");
  } else {
    b = {id:uid('brand'), name:trimmed, status:'faol'};
    if(!DB.brands) DB.brands=[];
    DB.brands.push(b);
    logActivity(`"${trimmed}" nomli yangi firma/brend qo'shdi`);
    save();
    toast("Firma/brend qo'shildi");
  }
  sel.innerHTML = `<option value="">Tanlanmagan</option>`
    + DB.brands.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${x.name}</option>`).join('')
    + `<option value="__add_new__">+ Yangi firma/brend...</option>`;
}
function dkSaveProduct(id){
  const name = document.getElementById('dk_p_name').value.trim();
  if(!name){ toast("Mahsulot nomini kiriting",true); return; }
  const existing = id ? DB.products.find(x=>x.id===id) : null;
  let barcode = document.getElementById('dk_p_barcode').value.trim();
  if(barcode){
    const dup = DB.products.find(pp=> pp.id!==id && pp.barcode===barcode);
    if(dup){ toast(`"${barcode}" shtrix-kodi "${dup.name}" mahsulotida allaqachon mavjud`,true); return; }
  } else {
    barcode = existing ? (existing.barcode || dkUniqueBarcode()) : dkUniqueBarcode();
  }
  const catSelect = document.getElementById('dk_p_category');
  const catName = catSelect ? catSelect.value : (existing ? existing.category : (dkModalCatName || dkCurrentCatId));
  if(!catName || catName==='__add_new__'){ toast("Kategoriyani tanlang",true); return; }
  const brandSelectVal = document.getElementById('dk_p_brand').value;
  const brandId = (brandSelectVal && brandSelectVal!=='__add_new__') ? brandSelectVal : null;
  const data = {
    category: catName,
    name,
    brandId,
    brand: brandId ? brandName(brandId) : '',
    image: dkImageData||null,
    packaged: dkPackaged,
    size: document.getElementById('dk_p_size').value.trim(),
    pkgUnit: document.getElementById('dk_p_pkgunit').value,
    unit: document.getElementById('dk_p_unit').value,
    barcode,
    desc: document.getElementById('dk_p_desc').value.trim(),
    updatedAt: Date.now(),
  };
  if(existing){
    Object.assign(existing, data);
    if(!existing.qrCode) existing.qrCode = dkUniqueQr(existing.sku); // eski mahsulotda QR yo'q bo'lsa to'ldiriladi, mavjud bo'lsa o'zgarmaydi
    if(!existing.emoji) existing.emoji = catIcon(catName);
    toast("Mahsulot yangilandi");
  } else {
    data.id = uid('p');
    data.sku = dkUniqueSku();
    data.qrCode = dkUniqueQr(data.sku);
    data.emoji = catIcon(catName);
    data.isForSale = false;   // yaratilganda hali sotuvda emas — SOTUVDA tugmasi bilan yoqiladi
    data.qty = 0;             // omborga hali kirim qilinmagan
    data.cost = 0;
    data.price = 0;
    data.minQty = 0;
    data.batches = [];        // partiyalar — faqat Ombor→Kirim orqali to'ldiriladi
    data.createdAt = Date.now();
    DB.products.push(data);
    toast("Mahsulot qo'shildi");
  }
  save(); closeModal(); renderPage();
}
function dkDeleteProduct(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p) return;
  let msg = `"${p.name}" mahsulotini o'chirishni tasdiqlaysizmi?`;
  if(p.isForSale || p.qty>0){
    const bits=[];
    if(p.isForSale) bits.push('sotuvda');
    if(p.qty>0) bits.push(`omborda ${fmtQty(p.qty)} ${p.unit} qoldiqqa ega`);
    msg += `\n\nDiqqat: bu mahsulot ${bits.join(' va ')}. O'chirilsa, ushbu ma'lumotlar ham yo'qoladi.`;
  }
  if(!confirm(msg)) return;
  DB.products = DB.products.filter(x=>x.id!==id);
  save(); toast("Mahsulot o'chirildi"); renderPage();
}

/* ================================================================
   TOVARLAR — EXCEL ORQALI IMPORT
   Ustunlar: Mahsulot nomi + Shtrix-kod (majburiy), Sotib olish narxi +
   Sotish narxi (to'ldirilsa — mahsulot to'g'ridan-to'g'ri shu narxlar
   bilan bazaga yoziladi va Tovarlar bo'limida SOTUVDA sifatida
   ko'rinadi — tvMarkForSale() bosish shart emas). Kategoriya/Firma
   ixtiyoriy. Boshqa maydonlar (rasm, hajm, tavsif va h.k.) keyinroq
   mavjud "Mahsulotni tahrirlash" oynasi orqali to'ldiriladi — bu
   funksiya ularga TEGMAYDI va mavjud tahrirlash logikasini
   o'zgartirmaydi. Tasdiqlangunga qadar DB.products'ga hech narsa
   yozilmaydi (avval tekshiruv/preview ko'rsatiladi).
   ================================================================ */
let dkExcelPendingImport = [];

/* "Excel shablonini yuklab olish" — nomi, shtrix-kod, narxlar (+ixtiyoriy kategoriya/brend). */
function dkDownloadExcelTemplate(){
  if(typeof XLSX==='undefined'){ toast("Excel kutubxonasi yuklanmadi, internet aloqasini tekshiring", true); return; }
  const rows = [
    ['Mahsulot nomi','Shtrix-kod','Sotib olish narxi','Sotish narxi','Kategoriya','Firma/Brend'],
    ['Coca Cola 1.5L','4780001234567',9000,12000,'Gazli ichimliklar','Coca-Cola'],
    ['Sut 450g','4780001234568',7000,9500,'Sut mahsulotlari',''],
    ['Non','4780001234569',2000,3000,'Non',''],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:30},{wch:18},{wch:16},{wch:16},{wch:22},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Shablon');
  XLSX.writeFile(wb, 'tovarlar_shabloni.xlsx');
}

function dkOpenExcelImportModal(){
  dkExcelPendingImport = [];
  openModal(`
    <div class="modal-head"><h3>${icon('file-spreadsheet')} Excel orqali import</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="alert alert-info">${icon('info')}<span>Majburiy ustunlar: <strong>Mahsulot nomi</strong> va <strong>Shtrix-kod</strong>. <strong>Sotib olish narxi</strong> va <strong>Sotish narxi</strong> to'ldirilsa, mahsulot shu narxlar bilan to'g'ridan-to'g'ri Tovarlar bo'limiga (SOTUVDA) qo'shiladi. Kategoriya va Firma/Brend ixtiyoriy — mavjud bo'lsa avtomatik bog'lanadi, mavjud bo'lmasa yangi yaratiladi. Boshqa ma'lumotlar (rasm, hajm va h.k.) keyinroq mahsulotni tahrirlash orqali kiritiladi.</span></div>
      <div class="field">
        <label>Excel fayl (.xlsx)</label>
        <input type="file" id="dk_excel_file" accept=".xlsx,.xls" onchange="dkHandleExcelFile(this)">
      </div>
      <div id="dkExcelImportStatus" style="font-size:12px;color:var(--text-faint);"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Bekor qilish</button>
    </div>
  `, true);
}

function dkHandleExcelFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const statusEl = document.getElementById('dkExcelImportStatus');
  if(typeof XLSX==='undefined'){
    toast("Excel kutubxonasi yuklanmadi, internet aloqasini tekshiring", true);
    return;
  }
  if(statusEl) statusEl.textContent = "Fayl o'qilmoqda...";
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      dkProcessExcelRows(rows);
    }catch(err){
      if(statusEl) statusEl.textContent = '';
      toast("Excel faylni o'qib bo'lmadi", true);
    }
  };
  reader.onerror = ()=>{ if(statusEl) statusEl.textContent = ''; toast("Faylni o'qishda xatolik", true); };
  reader.readAsArrayBuffer(file);
}

/* Sonli ustun (narx) qiymatini xavfsiz o'qiydi: bo'sh bo'lsa {ok:true, val:0}
   (ixtiyoriy — importga xalaqit bermaydi), noto'g'ri (sonsiz) qiymat
   kiritilgan bo'lsa {ok:false} — shu qator xatolik sifatida belgilanadi. */
function dkParseExcelPrice(raw){
  const s = String(raw!=null?raw:'').trim();
  if(!s) return {ok:true, val:0};
  const n = Number(String(s).replace(/\s/g,'').replace(/,/g,'.'));
  if(isNaN(n) || n<0) return {ok:false, val:0};
  return {ok:true, val:Math.round(n)};
}

/* Excel qatorlarini tekshiradi: nom/shtrix-kod bo'sh, shtrix-kod tizimda
   allaqachon mavjud, Excel ichida shtrix-kod takrorlangan, yoki narx
   ustunlariga son bo'lmagan qiymat kiritilgan bo'lsa — shu qator
   xatolik blokiga tushadi va import qilinmaydi. */
function dkProcessExcelRows(rows){
  let dataRows = rows.slice();
  // Birinchi qator sarlavhaga o'xshasa (masalan "Mahsulot nomi"), uni o'tkazib yuboramiz.
  if(dataRows.length && typeof dataRows[0][0]==='string' && dataRows[0][0].toLowerCase().indexOf('mahsulot')>=0){
    dataRows = dataRows.slice(1);
  }
  const validRows = [];
  const errorRows = [];
  const seenInFile = new Set();
  dataRows.forEach((row,idx)=>{
    const rowNum = idx+2; // sarlavha qatori hisobga olingan holda foydalanuvchiga tushunarli qator raqami
    const name = String(row[0]!=null?row[0]:'').trim();
    const barcode = String(row[1]!=null?row[1]:'').trim();
    // Sotib olish narxi (E ustuni emas, C) va Sotish narxi (D) — ixtiyoriy, lekin
    // to'ldirilsa mahsulot to'g'ridan-to'g'ri shu narxlar bilan yoziladi.
    const costParsed = dkParseExcelPrice(row[2]);
    const priceParsed = dkParseExcelPrice(row[3]);
    // Ixtiyoriy ustunlar: Kategoriya (E ustuni) va Firma/Brend (F ustuni).
    // Eski qisqa fayllarda bu qiymatlar bo'sh bo'ladi — importga ta'sir qilmaydi.
    const categoryName = String(row[4]!=null?row[4]:'').trim();
    const brandNameVal = String(row[5]!=null?row[5]:'').trim();
    if(!name && !barcode) return; // to'liq bo'sh qator — e'tiborsiz qoldiriladi
    let error = '';
    if(!name) error = "Mahsulot nomi bo'sh";
    else if(!barcode) error = "Shtrix-kod bo'sh";
    else if(DB.products.some(p=>p.barcode===barcode)) error = "Shtrix-kod tizimda allaqachon mavjud";
    else if(seenInFile.has(barcode)) error = "Excel ichida shtrix-kod takrorlangan";
    else if(!costParsed.ok) error = "Sotib olish narxi noto'g'ri (son bo'lishi kerak)";
    else if(!priceParsed.ok) error = "Sotish narxi noto'g'ri (son bo'lishi kerak)";
    if(error){ errorRows.push({rowNum,name,barcode,error}); }
    else{ seenInFile.add(barcode); validRows.push({rowNum,name,barcode,cost:costParsed.val,price:priceParsed.val,categoryName,brandNameVal}); }
  });
  dkRenderExcelPreview(validRows, errorRows);
}

/* Tekshiruv oynasi: yuqorida Jami/To'g'ri/Xatolik, pastda xatolikli qatorlar
   qizil blokda, to'g'ri mahsulotlar yashil blokda (kichik rasm o'rniga
   placeholder — rasm hali yo'q). Tasdiqlangunga qadar DB.products
   o'zgarmaydi. */
function dkRenderExcelPreview(validRows, errorRows){
  dkExcelPendingImport = validRows;
  const total = validRows.length + errorRows.length;
  openModal(`
    <div class="modal-head"><h3>${icon('file-spreadsheet')} Import — tekshiruv</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        <span class="badge badge-gray">Jami: ${total}</span>
        <span class="badge badge-green">To'g'ri: ${validRows.length}</span>
        <span class="badge badge-red">Xatolik: ${errorRows.length}</span>
      </div>
      ${errorRows.length? `
      <div class="alert alert-danger" style="flex-direction:column;align-items:stretch;">
        <div style="font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px;">${icon('x-circle')}<span>Xatoliklar (${errorRows.length}) — import qilinmaydi</span></div>
        <div style="display:flex;flex-direction:column;gap:5px;max-height:160px;overflow:auto;">
          ${errorRows.map(r=>`<div style="font-size:12px;">Qator ${r.rowNum}: <strong>${r.name||'(nomsiz)'}</strong>${r.barcode?' — '+r.barcode:''} — ${r.error}</div>`).join('')}
        </div>
      </div>` : ''}
      ${validRows.length? `
      <div class="section-title" style="margin-top:14px;">To'g'ri mahsulotlar (${validRows.length})</div>
      <div class="alert alert-ok" style="flex-direction:column;align-items:stretch;">
        <div class="dk-prod-grid">
          ${validRows.map(r=>`
            <div class="dk-prod-card" style="cursor:default;">
              <div class="dk-prod-img">${icon('image')}</div>
              <div class="dk-prod-name">${r.name}</div>
              ${(r.categoryName||r.brandNameVal)?`<div class="dk-prod-meta">${[r.categoryName,r.brandNameVal].filter(Boolean).join(' · ')}</div>`:''}

/* Faqat shu bosilgandagina DB.products'ga yoziladi. Har bir yangi mahsulot
   mavjud yaratish logikasidagi kabi unique ID/SKU/QR-kod oladi (dkUniqueSku/
   dkUniqueQr — xuddi dkSaveProduct'da ishlatilgani kabi). Kategoriya ATAYLAB
   bo'sh qoldirilishi mumkin (DB.categories[0] majburan tanlanmaydi) — narx
   kiritilgan mahsulot esa to'g'ridan-to'g'ri isForSale:true (SOTUVDA) qilib
   yoziladi va Tovarlar bo'limidagi sellerProducts yozuviga ham qo'shiladi —
   xuddi tvMarkForSale() bajaradigan ishning o'zi, faqat import paytida
   avtomatik amalga oshiriladi. */
function dkConfirmExcelImport(){
  const rows = dkExcelPendingImport || [];
  if(!rows.length){ closeModal(); return; }
  const sellerId = currentSellerId();
  let count = 0;
  rows.forEach(r=>{
    if(DB.products.some(p=>p.barcode===r.barcode)) return; // qo'shimcha xavfsizlik: import paytida takroriylik
    const sku = dkUniqueSku();
    // Kategoriya: mavjud nom topilsa ID(nomi)ga bog'lanadi, topilmasa avtomatik yaratiladi (12-bo'lim).
    let categoryName = '';
    if(r.categoryName){
      const existingCat = DB.categories.find(c=>c.toLowerCase()===r.categoryName.toLowerCase());
      if(existingCat) categoryName = existingCat;
      else {
        DB.categories.push(r.categoryName);
        if(!DB.categoryIcons) DB.categoryIcons = {};
        DB.categoryIcons[r.categoryName] = '📦';
        CATEGORIES = DB.categories;
        categoryName = r.categoryName;
      }
    }
    // Firma/Brend: mavjud nom topilsa shu brendning ID'siga bog'lanadi, topilmasa yangi yaratiladi.
    let brandId = null;
    if(r.brandNameVal) brandId = dkGetOrCreateBrandId(r.brandNameVal);
    const forSale = (r.cost>0 || r.price>0); // narx to'ldirilgan bo'lsa — to'g'ridan-to'g'ri Tovarlar (SOTUVDA)
    const pid = uid('p');
    DB.products.push({
      id: pid,
      sku,
      barcode: r.barcode,
      qrCode: dkUniqueQr(sku),
      name: r.name,
      brandId,
      brand: brandId ? brandName(brandId) : '',
      category: categoryName,
      emoji: categoryName ? catIcon(categoryName) : '📦',
      image: null,
      packaged: true,
      size: '',
      pkgUnit: null,
      unit: 'dona',
      desc: '',
      isForSale: forSale,
      qty: 0, cost: r.cost||0, price: r.price||0, minQty: 0,
      batches: [],
      createdAt: Date.now(), updatedAt: Date.now(),
    });
    if(forSale){
      // tvMarkForSale() bilan bir xil sellerProducts yozuvi — Tovarlar/Ombor
      // shu bayroqni o'qiydi, mavjud "SOTUVDA" mantig'i o'zgarmaydi.
      DB.sellerProducts.push({id:uid('sp'), sellerId, productId:pid, isForSale:true, createdAt:Date.now()});
    }
    count++;
  });
  save();
  logActivity(`Excel orqali ${count} ta mahsulot import qildi`);
  dkExcelPendingImport = [];
  closeModal();
  toast(`${count} ta mahsulot import qilindi`);
  dkView = 'categories'; dkCurrentCatId = null; dkCatSearch = '';
  renderPage();
}

/* Shared camera decode engine — ZXing (QR, EAN-13, EAN-8, UPC-A, UPC-E, Code128, Code39, ITF)
   TRY_HARDER + explicit format hints so 1D barcodes (EAN-13 va h.k.) yo'nalishidan
   qat'i nazar (vertikal/gorizontal/qiya) avtomatik aniqlanadi. */
function buildZxingHints(){
  if(typeof ZXing==='undefined' || !ZXing.DecodeHintType) return undefined;
  try{
    const hints = new Map();
    const F = ZXing.BarcodeFormat;
    const formats = [
      F.QR_CODE, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E,
      F.CODE_128, F.CODE_39, F.ITF
    ].filter(f=>f!==undefined);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return hints;
  }catch(e){ return undefined; }
}
// Kamera constraint'lari — eng qat'iydan eng soddasiga qadar zinapoya.
// Qurilma biror constraint'ni (masalan advanced focusMode) qo'llab-quvvatlamasa,
// getUserMedia OverconstrainedError tashlaydi — shunda keyingi, soddaroq
// variantga o'tamiz, scanner butunlay to'xtab qolmaydi.
const CAMERA_CONSTRAINT_LADDER = [
  {video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}, advanced:[{focusMode:'continuous'}]}},
  {video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}},
  {video:{facingMode:'environment'}},
  {video:true}
];

/* Kamera oqimini CAMERA_CONSTRAINT_LADDER bo'yicha, eng qat'iydan eng soddasiga
   qadar, birinchi muvaffaqiyatli variantgacha sinab olamiz. */
async function acquireCameraStream(){
  let stream=null, lastErr=null;
  for(const constraints of CAMERA_CONSTRAINT_LADDER){
    try{ stream = await navigator.mediaDevices.getUserMedia(constraints); break; }
    catch(e){ lastErr=e; }
  }
  if(!stream) throw (lastErr || new Error("Kameraga ulanib bo'lmadi"));
  return stream;
}

/* Qurilma qo'llasa autofocus/continuous-focus yoqishga urinamiz. Qo'llamasa
   sekundiga ham error bermaydi — scanner oddiy default fokus bilan davom etadi. */
function tuneCameraTrack(stream){
  try{
    const track = stream.getVideoTracks && stream.getVideoTracks()[0];
    if(!track || typeof track.getCapabilities!=='function') return;
    const caps = track.getCapabilities();
    const advanced=[];
    if(caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({focusMode:'continuous'});
    if(advanced.length && typeof track.applyConstraints==='function'){
      track.applyConstraints({advanced}).then(()=>scanDebug('continuous focus yoqildi')).catch(()=>{});
    }
  }catch(e){ scanDebug('capability tuning imkonsiz, o\'tkazib yuborildi', e); }
}

/* Har frame uchun bitta canvasni qayta ishlatamiz (item 16: performance —
   canvas har frame'da yaratilmaydi/yo'q qilinmaydi). */
function ensureScannerCanvases(){
  if(!scannerCanvas){ scannerCanvas = document.createElement('canvas'); scannerCanvasCtx = scannerCanvas.getContext('2d',{willReadFrequently:true}); }
  if(!scannerRotateCanvas){ scannerRotateCanvas = document.createElement('canvas'); scannerRotateCtx = scannerRotateCanvas.getContext('2d',{willReadFrequently:true}); }
}

/* Butun video kadrni (markaziy crop qilmasdan) canvasga chizamiz — shu sababli
   barcode markazda, chetda, yuqorida, pastda — qayerda bo'lmasin aniqlanadi. */
function captureScannerFrame(videoEl){
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if(!vw || !vh) return null;
  if(scannerCanvas.width!==vw || scannerCanvas.height!==vh){ scannerCanvas.width=vw; scannerCanvas.height=vh; }
  scannerCanvasCtx.drawImage(videoEl, 0, 0, vw, vh);
  return scannerCanvas;
}

/* ZXing fallback uchun kadrni 90/180/270 gradusga aylantirib beradi — vertikal
   yoki aylangan holatda turgan 1D barcode'lar (masalan vertikal EAN-13) ham
   aniqlansin degani shu. */
function getRotatedScannerCanvas(srcCanvas, angleDeg){
  if(angleDeg===0) return srcCanvas;
  const w = srcCanvas.width, h = srcCanvas.height;
  const rotated = (angleDeg===90 || angleDeg===270);
  const nw = rotated ? h : w, nh = rotated ? w : h;
  if(scannerRotateCanvas.width!==nw || scannerRotateCanvas.height!==nh){ scannerRotateCanvas.width=nw; scannerRotateCanvas.height=nh; }
  const ctx = scannerRotateCtx;
  ctx.save();
  ctx.clearRect(0,0,nw,nh);
  if(angleDeg===90){ ctx.translate(nw,0); ctx.rotate(Math.PI/2); }
  else if(angleDeg===180){ ctx.translate(nw,nh); ctx.rotate(Math.PI); }
  else if(angleDeg===270){ ctx.translate(0,nh); ctx.rotate(-Math.PI/2); }
  ctx.drawImage(srcCanvas, 0, 0, w, h);
  ctx.restore();
  return scannerRotateCanvas;
}

/* Qaysi decode engine ishlatilishini tanlaydi:
   1) window.BarcodeDetector mavjud bo'lsa — shu (tezroq, native, batareyaga yengil)
   2) bo'lmasa yoki yaratishda xato bo'lsa — ZXing fallback (canvas orqali) */
async function pickScannerEngine(){
  const desiredFormats = ['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
  // QR va EAN-13 eng muhim formatlar (talab: 7-band) — native detector aynan
  // shularni real qo'llab-quvvatlamasa, uni primary sifatida ishonib bo'lmaydi.
  const criticalFormats = ['qr_code','ean_13'];
  if('BarcodeDetector' in window){
    try{
      let supported = [];
      let supportedKnown = false;
      if(typeof window.BarcodeDetector.getSupportedFormats==='function'){
        try{ supported = await window.BarcodeDetector.getSupportedFormats(); supportedKnown = Array.isArray(supported) && supported.length>0; }catch(e){ supported=[]; }
      }
      // Agar qurilma/brauzer formatlar ro'yxatini bersa va undagi formatlar
      // kerakli (QR/EAN-13) formatlarni real qamrab olmasa — native'ni
      // primary sifatida tanlamaymiz, to'g'ridan-to'g'ri ZXing fallbackga o'tamiz.
      if(supportedKnown && !criticalFormats.every(f=>supported.includes(f))){
        scanDebug('native BarcodeDetector kerakli formatlarni (QR/EAN-13) qo\'llamaydi, ZXing fallbackka o\'tildi', supported);
        scannerDetector = null;
      } else {
        const formats = supportedKnown ? desiredFormats.filter(f=>supported.includes(f)) : desiredFormats;
        scannerDetector = new window.BarcodeDetector({formats: formats.length ? formats : desiredFormats});
        scanDebug('detector selected: native BarcodeDetector', formats);
        scannerNativeConsecutiveErrors = 0;
        return 'native';
      }
    }catch(e){
      scanDebug('native BarcodeDetector ishlatib bo\'lmadi, ZXing fallbackka o\'tildi', e);
      scannerDetector = null;
    }
  }
  if(!ensureZxingReader()){
    return null; // hech qanday engine mavjud emas
  }
  scanDebug('detector selected: ZXing fallback (canvas frame processing)');
  return 'zxing';
}

/* zxingReader mavjud bo'lmasa yaratadi (native ishlab turgan paytda ham
   keyinchalik runtime'da fallbackga avtomatik o'tish uchun kerak bo'ladi).
   Muvaffaqiyatli bo'lsa true, ZXing kutubxonasi yuklanmagan bo'lsa false qaytaradi. */
function ensureZxingReader(){
  if(zxingReader) return true;
  if(typeof ZXing==='undefined') return false;
  try{
    const hints = buildZxingHints();
    zxingReader = hints ? new ZXing.BrowserMultiFormatReader(hints) : new ZXing.BrowserMultiFormatReader();
    return true;
  }catch(e){
    scanDebug('ZXing reader yaratib bo\'lmadi', e);
    zxingReader = null;
    return false;
  }
}

/* Native BarcodeDetector runtime'da ketma-ket bir necha marta xato bersa
   yoki umuman ishlay olmasa (masalan qurilma buni real qo'llab-quvvatlamasa),
   scanner to'xtab qolmasligi uchun ZXing fallbackka avtomatik o'tkazadi. */
function switchToZxingFallback(){
  if(scannerEngineType==='zxing') return;
  if(!ensureZxingReader()){
    scanDebug('ZXing fallbackga o\'tib bo\'lmadi — kutubxona mavjud emas');
    return;
  }
  scanDebug('native BarcodeDetector ketma-ket xato berdi, ZXing fallbackga avtomatik o\'tildi');
  scannerEngineType = 'zxing';
  scannerDetector = null;
  scannerNativeConsecutiveErrors = 0;
}

/* Asosiy scanner engine: kamerani ochadi, mos decode motorini tanlaydi va
   requestAnimationFrame uslubidagi throttled loop orqali (~100-200ms) har
   frame'ni BarcodeDetector yoki ZXing bilan tekshiradi. Chaqiruvchi funksiyalar
   (toggleCamera, dkOpenScanModal va h.k.) o'zgarishsiz shu signatura bilan
   ishlashda davom etadi: startScanEngine(videoEl, onDecode, onError). */
function startScanEngine(videoEl, onDecode, onError){
  if(scanEngineActive) return;
  if(!isMobileDevice()){
    /* Desktopda kamera orqali barcode scanner ishlatilmaydi — faqat
       USB/Bluetooth fizik scanner + avtomatik Enter sozlamasi ishlaydi.
       Bu yerda to'xtatish getUserMedia/camera stream/video preview
       kabi barcha kamera kodlarining desktopda ishga tushishining
       oldini oladi (chaqiruvchi joy qaysi bo'lishidan qat'i nazar). */
    onError && onError("Kamera skaner faqat mobil qurilmalarda mavjud. Kompyuterda USB/Bluetooth barkod skanerdan foydalaning.");
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    onError && onError("Bu qurilma/brauzerda kameraga kirish imkoni yo'q");
    return;
  }
  ensureScannerCanvases();
  const token = ++scannerLoopToken; // shu ishga tushirishga tegishli "avlod raqami"
  scannerVideoEl = videoEl;
  scannerLastCode = null;
  scannerLastTime = 0;
  videoEl.setAttribute('playsinline','true');
  videoEl.muted = true;

  // Aniqlangan kodni foydalanuvchiga yetkazishdan oldin 1.5 soniyalik
  // duplicate-protection: bitta barcode kamera oldida uzoq turganda
  // qayta-qayta (har frame'da) mahsulot qo'shilib ketmasligi uchun.
  function handleDetected(code){
    if(!code) return;
    if(token!==scannerLoopToken || !scanEngineActive) return;
    const now = Date.now();
    if(code===scannerLastCode && (now-scannerLastTime)<1500) return;
    scannerLastCode = code;
    scannerLastTime = now;
    scanDebug('barcode detected', code);
    onDecode(code);
  }

  let rotationIndex = 0;
  const ZXING_ROTATIONS = [0, 90, 180, 270];

  function runLoop(){
    if(token!==scannerLoopToken || !scanEngineActive) return;
    scannerLoopTimer = setTimeout(async ()=>{
      if(token!==scannerLoopToken || !scanEngineActive) return;
      try{
        const frame = captureScannerFrame(videoEl);
        if(frame){
          if(scannerEngineType==='native' && scannerDetector){
            try{
              const results = await scannerDetector.detect(frame);
              if(token!==scannerLoopToken || !scanEngineActive) return;
              scannerNativeConsecutiveErrors = 0; // muvaffaqiyatli chaqiruv — hisoblagichni tozalaymiz
              if(results && results.length) handleDetected(results[0].rawValue);
            }catch(nerr){
              scanDebug('native detect xatosi (davom etamiz)', nerr);
              scannerNativeConsecutiveErrors++;
              // Native detector ketma-ket bir necha marta xato bersa (masalan
              // qurilma/brauzer uni amalda ishlata olmasa), ZXing fallbackga
              // avtomatik o'tamiz — scanner bu yerda to'xtab qolmaydi, chunki
              // pastda runLoop() baribir chaqiriladi va shu yangi engine bilan davom etadi.
              if(scannerNativeConsecutiveErrors>=SCANNER_NATIVE_ERROR_THRESHOLD){
                switchToZxingFallback();
              }
            }
          } else if(scannerEngineType==='zxing' && zxingReader){
            // CPU tejash uchun har loop iteratsiyasida bitta burchak sinaladi,
            // navbat bilan 0/90/180/270 — shu bilan barcha yo'nalishlar qamrab olinadi.
            const angle = ZXING_ROTATIONS[rotationIndex % ZXING_ROTATIONS.length];
            rotationIndex++;
            try{
              const rotated = getRotatedScannerCanvas(frame, angle);
              const result = zxingReader.decodeFromCanvas(rotated);
              if(result) handleDetected(result.getText());
            }catch(zerr){
              // NotFoundException — bu kadrda kod topilmadi, bu normal holat.
              scanDebug('rotation', angle, 'da kod topilmadi');
            }
          }
        }
      }catch(err){
        scanDebug('frame processing xatosi (davom etamiz)', err);
      }
      runLoop();
    }, SCAN_INTERVAL_MS);
  }

  (async ()=>{
    try{
      const stream = await acquireCameraStream();
      if(token!==scannerLoopToken){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} return; }
      scannerStream = stream;
      videoEl.srcObject = stream;
      await videoEl.play().catch(()=>{});
      await new Promise(res=>{
        if(videoEl.readyState>=2) return res();
        videoEl.onloadedmetadata = ()=>res();
        setTimeout(res,1500);
      });
      if(token!==scannerLoopToken) return;
      tuneCameraTrack(stream);
      scanDebug('camera started');

      const engine = await pickScannerEngine();
      if(token!==scannerLoopToken) return;
      if(!engine){
        onError && onError("Skaner kutubxonasi yuklanmadi — internet aloqasini tekshiring");
        return;
      }
      scannerEngineType = engine;
      scanEngineActive = true;
      runLoop();
    }catch(err){
      scanEngineActive = false;
      onError && onError(err && err.message ? err.message : "Kameraga ulanib bo'lmadi (ruxsat berilmagan bo'lishi mumkin)");
    }
  })();
}

function stopScanEngine(){
  scanEngineActive = false;
  scannerLoopToken++; // eski (hozir to'xtayotgan) loop o'zini shu bilan to'xtatadi
  if(scannerLoopTimer){ clearTimeout(scannerLoopTimer); scannerLoopTimer = null; }
  if(scannerRAF){ clearTimeout(scannerRAF); scannerRAF = null; }
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader=null; }
  scannerDetector = null;
  scannerEngineType = null;
  if(scannerStream){ try{ scannerStream.getTracks().forEach(t=>t.stop()); }catch(e){} scannerStream=null; }
  if(scannerVideoEl){
    try{
      if(scannerVideoEl.srcObject){ try{ scannerVideoEl.srcObject.getTracks().forEach(t=>t.stop()); }catch(e){} }
      scannerVideoEl.srcObject = null;
    }catch(e){}
    scannerVideoEl = null;
  }
  scannerLastCode = null;
  scannerLastTime = 0;
  scanDebug('scanner stopped');
}
function toggleCamera(){
  if(scanEngineActive){ stopScanEngine(); updateStandaloneCamUI(false); return; }
  const video = document.getElementById('scanVideo');
  if(!video) return;
  video.style.display='block';
  const ph=document.getElementById('scanPlaceholder'); if(ph) ph.style.display='none';
  updateStandaloneCamUI(true);
  startScanEngine(video, (code)=>{
    document.getElementById('manualCode').value = code;
    stopScanEngine();
    updateStandaloneCamUI(false);
    scanLookup();
  }, (err)=>{
    toast(err, true);
    updateStandaloneCamUI(false);
  });
}
function updateStandaloneCamUI(on){
  const st=document.getElementById('scanStatus'); if(st) st.textContent = on? "Kamera yoqildi — kodni ramka ichiga tuting" : "Kamerani yoqish uchun tugmani bosing";
  const btn=document.getElementById('camToggleBtn'); if(btn){ btn.innerHTML = (on? icon('camera-off')+' Kamerani o\'chirish' : icon('camera')+' Kamerani yoqish'); lucide.createIcons(); }
  if(!on){
    const video=document.getElementById('scanVideo'); if(video){ video.style.display='none'; video.srcObject=null; }
    const ph=document.getElementById('scanPlaceholder'); if(ph) ph.style.display='flex';
  }
}

function renderScanPageInput(p){
  if(canSellByMoney(p) && scanPageMode==='money'){
    return `<div class="field"><label>Summa (so'm)</label><input type="number" id="scanMoney" value="" min="1" step="500" placeholder="Masalan: 10000" oninput="updateScanTotal()"></div>`;
  }
  const step = requiresWholeQty(p) ? 1 : 0.01;
  return `<div class="field"><label>Miqdor (${p.unit})</label><input type="number" id="scanQty" value="1" min="${step}" step="${step}" oninput="updateScanTotal()"></div>`;
}
function setScanPageMode(mode){
  if(!scannedProduct) return;
  scanPageMode = mode;
  document.getElementById('scanResult').innerHTML = renderScanPageResult(scannedProduct);
  lucide.createIcons();
  updateScanTotal();
}
function updateScanTotal(){
  if(!scannedProduct) return;
  const p = scannedProduct;
  const totalEl = document.getElementById('scanTotalVal'); if(!totalEl) return;
  if(canSellByMoney(p) && scanPageMode==='money'){
    const money = Number(document.getElementById('scanMoney')?.value)||0;
    totalEl.textContent = fmt(money);
  } else {
    const qty = Number(document.getElementById('scanQty')?.value)||0;
    totalEl.textContent = fmt(p.price*qty);
  }
}
function addScannedToCart(){
  if(!scannedProduct) return;
  const p = scannedProduct;
  if(canSellByMoney(p) && scanPageMode==='money'){
    const money = Math.round(Number(document.getElementById('scanMoney')?.value)||0);
    if(money<=0){ toast("Summani kiriting",true); return; }
    if(cartAddMoney(p.id, money)) toast(`${p.emoji} ${p.name} savatga qo'shildi`);
    return;
  }
  let qty = Number(document.getElementById('scanQty')?.value)||0;
  if(requiresWholeQty(p)) qty = Math.round(qty);
  if(qty<=0){ toast("Miqdorni kiriting",true); return; }
  cartAdd(p.id, qty);
}

/* ---------------- CART CORE ---------------- */
function cartFind(pid){ return cart.find(c=>c.productId===pid); }
function cartAdd(pid, qty){
  const p = DB.products.find(x=>x.id===pid);
  if(!p) return false;
  if(qty<=0) return false;
  if(requiresWholeQty(p)) qty = Math.round(qty);
  const existing = cartFind(pid);
  const currentQty = existing? existing.qty : 0;
  const newQty = roundQty(currentQty+qty);
  if(newQty > p.qty){ toast("Omborda yetarli qoldiq yo'q",true); return false; }
  if(existing){ existing.qty = newQty; delete existing.moneyEntered; }
  else cart.push({productId:pid, qty:roundQty(qty)});
  if(currentPage==='sales') renderCart();
  return true;
}
/* Pul bo'yicha sotish: qadoqsiz (kg/litr) mahsulot uchun kiritilgan so'm miqdoridan avtomatik kg/litr hisoblanadi.
   Jami summa har doim aynan kiritilgan pul bilan teng bo'lishi uchun moneyEntered saqlanadi (yaxlitlash xatosi bo'lmasin). */
function cartAddMoney(pid, moneyAmt){
  const p = DB.products.find(x=>x.id===pid);
  if(!p || !canSellByMoney(p)) return false;
  moneyAmt = Math.round(Number(moneyAmt)||0);
  if(moneyAmt<=0) return false;
  const addQty = roundQty(moneyAmt/p.price);
  if(addQty<=0) return false;
  const existing = cartFind(pid);
  const currentQty = existing? existing.qty : 0;
  const newQty = roundQty(currentQty+addQty);
  if(newQty > p.qty){ toast("Omborda yetarli qoldiq yo'q",true); return false; }
  const currentMoney = existing ? (existing.moneyEntered!=null ? existing.moneyEntered : Math.round(existing.qty*p.price)) : 0;
  if(existing){ existing.qty = newQty; existing.moneyEntered = currentMoney+moneyAmt; }
  else cart.push({productId:pid, qty:addQty, moneyEntered:moneyAmt});
  if(currentPage==='sales') renderCart();
  return true;
}
function cartRemove(pid){ cart = cart.filter(c=>c.productId!==pid); renderCart(); }
function clearCart(){
  if(!cart.length) return;
  if(!confirm("Savatni tozalashni tasdiqlaysizmi?")) return;
  cart=[]; cardReceiptImage=null; cartDiscount={type:'none',value:0}; renderCart();
}
/* Savdo gridida/qidiruvda/skanerlashda bosilganda — imkon qadar kam bosish bilan
   to'g'ridan-to'g'ri savatga qo'shiladi (qayta bosilsa miqdori +1 oshadi).
   Faqat pul bo'yicha ham sotilishi mumkin bo'lgan qadoqsiz (kg/litr) mahsulotlarda
   aniq miqdor/summa kerak bo'lgani uchun tasdiqlash oynasi ochiladi. */
function addToCart(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p) return;
  if(p.qty<=0){ toast("Bu mahsulot tugagan",true); return; }
  if(canSellByMoney(p)){ openScanProductModal(p, {returnToScan:false}); return; }
  const ok = cartAdd(p.id, 1);
  if(ok) toast(`${p.emoji||'📦'} ${p.name} savatga qo'shildi`);
}
function changeQty(id,delta){
  const item = cart.find(c=>c.productId===id);
  const p = DB.products.find(x=>x.id===id);
  const step = requiresWholeQty(p) ? 1 : 0.01;
  let newQty = roundQty(item.qty + delta*step);
  if(requiresWholeQty(p)) newQty = Math.round(newQty);
  if(newQty<=0){ cart=cart.filter(c=>c.productId!==id); }
  else if(newQty>p.qty){ toast("Omborda yetarli qoldiq yo'q",true); }
  else { item.qty = newQty; delete item.moneyEntered; }
  renderCart();
}
function setCartQty(id,val){
  const item = cart.find(c=>c.productId===id);
  const p = DB.products.find(x=>x.id===id);
  let qty = Number(val)||0;
  if(qty<0) qty=0;
  if(requiresWholeQty(p)) qty = Math.round(qty);
  if(qty>p.qty){ qty=p.qty; toast("Omborda yetarli qoldiq yo'q",true); }
  if(qty<=0){ cart=cart.filter(c=>c.productId!==id); renderCart(); return; }
  item.qty = roundQty(qty);
  delete item.moneyEntered;
  renderCart();
}

/* ---------------- LINE PRICE (always from product database — no per-line edits) ---------------- */
function maxDiscountPercent(){ const v = DB.roleRights[currentRole]?.maxDiscountPercent; return v==null?0:v; }
function lineUnitPrice(item,p){ return p.price; }
/* Pul bo'yicha qo'shilgan qatorlarda jami summa har doim mijoz kiritgan aniq so'm miqdoriga teng bo'ladi (moneyEntered) */
function lineGross(item,p){ return item.moneyEntered!=null ? item.moneyEntered : p.price*item.qty; }
function lineTotal(item,p){ return item.moneyEntered!=null ? item.moneyEntered : p.price*item.qty; }

/* ---------------- TOTALS ---------------- */
function cartSubtotal(){ return cart.reduce((a,c)=>{ const p=DB.products.find(x=>x.id===c.productId); return a+lineGross(c,p); },0); }
function cartLevelDiscountAmt(){
  const subtotal = cartSubtotal();
  if(cartDiscount.type==='percent') return subtotal*(Math.min(cartDiscount.value,100)/100);
  if(cartDiscount.type==='amount') return Math.min(Math.max(cartDiscount.value,0), subtotal);
  return 0;
}
function cartDiscountTotal(){
  const subtotal = cartSubtotal();
  return Math.min(cartLevelDiscountAmt(), subtotal);
}
function cartTotal(){ return cartSubtotal()-cartDiscountTotal(); }
function cartQtyTotal(){ return cart.reduce((a,c)=>a+c.qty,0); }
function isDeliveryOn(){ return !!document.getElementById('deliveryNeeded')?.checked; }
function currentDeliveryFee(){ return isDeliveryOn()? (Number(document.getElementById('dlv_price')?.value)||0) : 0; }
function currentGrandTotal(){ return cartTotal()+currentDeliveryFee(); }

function renderCart(){
  const itemsBox = document.getElementById('cartItems'); if(!itemsBox) return;
  document.getElementById('cartCount').textContent = cart.length? `(${cart.length} xil)`:'';
  itemsBox.innerHTML = cart.length? cart.map(c=>{
    const p = DB.products.find(x=>x.id===c.productId);
    const unitPrice = lineUnitPrice(c,p);
    return `<div class="cart-item" style="flex-direction:column;align-items:stretch;gap:5px;">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
        <div class="ci-name">${p.name}${pkgLabel(p)?` <span style="font-weight:600;color:var(--text-faint);">(${pkgLabel(p)})</span>`:''}${c.moneyEntered!=null?` <span class="badge badge-green" style="font-size:9.5px;">PUL BO'YICHA</span>`:''}</div>
        <button class="btn-ghost" onclick="cartRemove('${p.id}')" title="O'chirish">${icon('trash-2')}</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <div class="qty-box"><button onclick="changeQty('${p.id}',-1)">−</button><input type="number" value="${fmtQty(c.qty)}" step="${requiresWholeQty(p)?1:0.01}" onchange="setCartQty('${p.id}',this.value)"><button onclick="changeQty('${p.id}',1)">+</button></div>
        <span style="font-size:11.5px;color:var(--text-faint);">${fmtQty(c.qty)} ${p.unit} · ${fmtNum(unitPrice)}</span>
        <span class="cell-strong">${fmtNum(lineTotal(c,p))}</span>
      </div>
      ${p.packSize?`<div style="text-align:right;"><button class="btn-ghost btn-sm" onclick="calcPacks('${p.id}')" title="Konversiya kalkulyatori">${icon('calculator')} ${p.packUnit||'quti'}</button></div>`:''}
    </div>`;
  }).join('') : `<div class="cart-empty">${icon('shopping-cart')}<div>Savat bo'sh</div></div>`;

  const subtotal = cartSubtotal();
  const discount = cartDiscountTotal();
  const dlvOn = isDeliveryOn();
  const dlvFee = currentDeliveryFee();
  const grand = subtotal-discount+dlvFee;
  document.getElementById('cartTotals').innerHTML = `
    <div class="ct-row"><span>Jami mahsulot</span><span>${cart.length} xil</span></div>
    <div class="ct-row"><span>Jami miqdor</span><span>${fmtQty(cartQtyTotal())}</span></div>
    <div class="ct-row"><span>Umumiy summa</span><span>${fmtNum(subtotal)}</span></div>
    <div class="ct-row" style="align-items:center;"><span>Chegirma</span><button type="button" class="discount-btn ${discount>0?'has-value':''}" onclick="openDiscountModal()">${icon('percent')}<span>${discount>0? (cartDiscount.type==='percent'? cartDiscount.value+'% CHEGIRMA' : fmtNum(discount)+" so'm") : 'CHEGIRMA'}</span></button></div>
    ${dlvOn?`<div class="ct-row"><span>Yetkazib berish</span><span>${fmtNum(dlvFee)}</span></div>`:''}
    <div class="ct-row total"><span>Yakuniy summa</span><span id="grandTotalVal">${fmt(grand)}</span></div>
    <button class="btn-ghost btn-sm" onclick="clearCart()" style="margin-top:4px;">${icon('trash-2')} Savatni tozalash</button>`;

  const payTriggerBox = document.getElementById('payTrigger');
  if(payTriggerBox){
    payTriggerBox.innerHTML = `<button class="btn btn-primary btn-block" id="openPaymentBtn" onclick="openPaymentModal()" ${cart.length?'':'disabled'}>${icon('credit-card')} TO'LOV <span style="opacity:.85;">— ${fmt(grand)}</span></button>`;
  }

  renderPayExtra();
  mnUpdateCartBadge();
  lucide.createIcons();
}
function refreshTotals(){
  renderCart();
}

      </div>
      <div class="field">
        <label id="discValueLabel">Chegirma (%)</label>
        <input type="number" id="discModalValue" inputmode="decimal" min="0" value="${cartDiscount.value||0}" oninput="updateDiscountModalPreview()">
      </div>
      <div id="discModalErr"></div>

      </div>
    </div>
    <div class="modal-foot" style="gap:10px;">

      <button class="btn btn-primary btn-block" onclick="saveDiscountModal()">${icon('check')} SAQLASH</button>
    </div>
  `);
  renderDiscTypeButtons();
  updateDiscountModalPreview();
}
function renderDiscTypeButtons(){
  const row = document.getElementById('discTypeRow'); if(!row) return;
  row.innerHTML = `
    <div class="pay-type ${discModalTempType==='percent'?'active':''}" onclick="setDiscModalType('percent')">${icon('percent')}<span>Foiz (%)</span></div>
    <div class="pay-type ${discModalTempType==='amount'?'active':''}" onclick="setDiscModalType('amount')">${icon('banknote')}<span>Summa (so'm)</span></div>`;
  lucide.createIcons();
}
function setDiscModalType(type){
  discModalTempType = type;
  renderDiscTypeButtons();
  updateDiscountModalPreview();
}
function updateDiscountModalPreview(){
  const subtotal = cartSubtotal();
  const type = discModalTempType;
  const labelEl = document.getElementById('discValueLabel');
  if(labelEl) labelEl.textContent = type==='percent' ? 'Chegirma (%)' : "Chegirma (so'm)";
  let val = Number(document.getElementById('discModalValue').value); if(isNaN(val)||val<0) val=0;
  let warnMsg='';
  if(type==='percent'){
    if(val>100) val=100;
    if(currentRole!=='admin'){
      const cap = maxDiscountPercent();
      if(val>cap){ val=cap; warnMsg = `Chegirma limiti: ${cap}%`; document.getElementById('discModalValue').value=val; }
    }
  } else {
    if(val>subtotal) val=subtotal;
  }
  const amt = type==='percent' ? subtotal*(val/100) : val;
  document.getElementById('discModalAmt').textContent = amt>0? '−'+fmtNum(amt) : '0';
  document.getElementById('discModalFinal').textContent = fmtNum(Math.max(subtotal-amt,0));
  const errEl = document.getElementById('discModalErr');
  if(errEl){ errEl.innerHTML = warnMsg?`<div class="alert alert-warning" style="margin-top:4px;">${icon('alert-triangle')}<span>${warnMsg}</span></div>`:''; lucide.createIcons(); }
}
function saveDiscountModal(){
  const subtotal = cartSubtotal();
  const type = discModalTempType;
  let val = Number(document.getElementById('discModalValue').value); if(isNaN(val)||val<0) val=0;
  if(type==='percent'){
    if(val>100) val=100;
    if(currentRole!=='admin'){
      const cap = maxDiscountPercent();
      if(val>cap){ val=cap; toast(`Chegirma limiti: ${cap}%`,true); }
    }
  } else {
    if(val>subtotal){ val=subtotal; }
  }
  cartDiscount = {type: val>0? type : 'none', value: val};
  closeModal();
  renderCart();
}

/* ---------------- SAVDO: Nasiya uchun tezkor "Yangi mijoz qo'shish" ----------------
   Savat ichidan chiqmasdan yangi mijoz qo'shish uchun alohida, tezkor forma.
   Mavjud "Mijozlar" bazasi bilan bir xil obyekt strukturasidan foydalanadi
   ({id,name,phone,address,debtTotal,paid,history,dueDate}) — xuddi saveCustomer()
   qanday qo'shsa, shunday. Mavjud openCustomerModal/saveCustomer (Mijozlar sahifasi)
   funksiyalariga tegilmagan, faqat ularga parallel, Savdo sahifasiga xos qo'shimcha. */
let quickCustomerReturnToPayment = false;
function openQuickAddCustomerModal(returnToPayment){
  quickCustomerReturnToPayment = !!returnToPayment;
  openModal(`
    <div class="modal-head"><h3>${icon('user-plus')} Yangi mijoz</h3><button class="btn-ghost" onclick="closeQuickAddCustomerModal()">${icon('x')}</button></div>

function closeQuickAddCustomerModal(){
  const returnToPayment = quickCustomerReturnToPayment;

function saveQuickCustomer(){
  const name = (document.getElementById('qc_name').value||'').trim();
  const phone = (document.getElementById('qc_phone').value||'').trim();
  const address = (document.getElementById('qc_note').value||'').trim();
  if(!name || !phone){ toast("Ism va telefonni to'ldiring", true); return; }
  const c = {id:uid('c'), name, phone, address, debtTotal:0, paid:0, history:[], dueDate:null};
  DB.customers.push(c);
  logActivity(`Mijoz qo'shildi (Savdo → tezkor): ${name}`);
  save();
  const returnToPayment = quickCustomerReturnToPayment;
  closeModal();
  if(currentPage==='sales'){
    renderPage();
    const sel = document.getElementById('saleCustomer');
    if(sel){ sel.value = c.id; onSaleCustomerChange(); }
  }
  if(returnToPayment) openPaymentModal();
  toast(`${name} mijoz sifatida qo'shildi va tanlandi`);
}

/* ---------------- VALIDATE + COMPLETE SALE ---------------- */
function validateSale(){
  if(!cart.length) return "Savat bo'sh";
  for(const c of cart){
    const p = DB.products.find(x=>x.id===c.productId);
    if(!p || c.qty>p.qty) return `"${p?p.name:'Mahsulot'}" uchun omborda yetarli qoldiq yo'q`;
  }
  const grand = currentGrandTotal();
  if(selectedPayType==='naqd'){
    const given = Number(document.getElementById('cashGiven').value);
    if(isNaN(given) || given<=0) return "Mijoz bergan pul summasini kiriting";
    if(given<grand) return "Berilgan pul yetarli emas";
  } else if(selectedPayType==='aralash'){
    const cashV = Number(document.getElementById('mixCash').value)||0;
    const cardV = Number(document.getElementById('mixCard').value)||0;
    if(Math.round((cashV+cardV) - grand) !== 0) return "To'lovlar jami chek summasiga teng emas";
  } else if(selectedPayType==='qarz'){
    const custId = document.getElementById('saleCustomer')?.value;
    if(!custId) return "Qarzga sotish uchun mijozni tanlang";
  }
  if(selectedPayType==='karta' && !cardReceiptImage){
    return "Karta to'lovi uchun chek rasmini yuklang yoki suratga oling.";
  }
  if(selectedPayType==='aralash'){
    const cardV = Number(document.getElementById('mixCard').value)||0;
    if(cardV>0 && !cardReceiptImage) return "Karta to'lovi uchun chek rasmini yuklang yoki suratga oling.";
  }
  if(isDeliveryOn()){
    const addr = document.getElementById('dlv_address')?.value.trim();
    const phone = document.getElementById('dlv_phone')?.value.trim();
    const price = Number(document.getElementById('dlv_price')?.value);
    if(!addr || !phone || isNaN(price) || price<0) return "Yetkazib berish ma'lumotlarini to'liq kiriting (manzil, telefon, narx)";
  }
  return null;
}
function completeSale(){
  const err = validateSale();
  if(err){ toast(err, true); return; }

  const grand = currentGrandTotal();
  const dlvFee = currentDeliveryFee();
  const subtotal = cartSubtotal();
  const discountTotal = cartDiscountTotal();
  let paidNow=grand, customerId=document.getElementById('saleCustomer').value||null, changeAmt=0, cashPart=0, cardPart=0;

  if(selectedPayType==='naqd'){
    const given = Number(document.getElementById('cashGiven').value);
    changeAmt = given-grand; paidNow=grand;
  } else if(selectedPayType==='aralash'){
    cashPart = Number(document.getElementById('mixCash').value)||0;
    cardPart = Number(document.getElementById('mixCard').value)||0;
    paidNow = grand;
  } else if(selectedPayType==='qarz'){
    const part = Number(document.getElementById('partNow').value)||0;
    paidNow = Math.min(part, grand);
  }

  const empName = document.getElementById('roleSelect').selectedOptions[0].textContent.split('—')[1].trim();
  const items = cart.map(c=>{
    const p = DB.products.find(x=>x.id===c.productId);
    const unitPrice = lineUnitPrice(c,p);
    const total = lineTotal(c,p);
    // ombordan REAL miqdor partiyalar (FIFO / muddati yaqinini birinchi) tartibida ayiriladi (pul bo'yicha sotilganda ham)
    const consumedCost = consumeFromBatches(p, c.qty);
    return {productId:p.id,name:p.name,brand:p.brand,sku:p.sku,qty:c.qty,unit:p.unit,price:unitPrice,cost:consumedCost,lineTotal:total,moneyEntered:c.moneyEntered!=null?c.moneyEntered:null};
  });

  const needsCardImg = selectedPayType==='karta' || (selectedPayType==='aralash' && cardPart>0);
  DB.saleCounter = (DB.saleCounter||0)+1;
  const checkNo = 'A-'+String(DB.saleCounter).padStart(6,'0');
  const sale = {id:uid('s'),checkNo,date:new Date().toISOString(),employee:empName,customerId,items,
    subtotal,discountTotal,deliveryFee:dlvFee,total:grand,paymentType:selectedPayType,paidNow,change:changeAmt,cashPart,cardPart,status:'yakunlangan',
    cardReceiptImage: needsCardImg ? cardReceiptImage : null, shiftId: DB.currentShift ? DB.currentShift.id : null};
  DB.sales.push(sale);

  if(selectedPayType==='qarz' && customerId){
    const c = DB.customers.find(x=>x.id===customerId);
    const debtAmt = grand-paidNow;
    c.debtTotal += debtAmt;
    c.dueDate = document.getElementById('debtDue').value || new Date(Date.now()+7*86400000).toISOString().slice(0,10);
    const note = document.getElementById('debtNote').value.trim();
    c.history.push({date:sale.date,type:'qarz',amount:debtAmt,note:(note?note+' — ':'')+`Chek #${checkNo}`});
  }

  let delivery = null;
  if(isDeliveryOn()){
    delivery = {
      id:uid('d'), saleId:sale.id, date:sale.date,
      customerName:customerId?(DB.customers.find(x=>x.id===customerId)||{}).name||'':'',
      address:document.getElementById('dlv_address').value.trim(),
      phone:document.getElementById('dlv_phone').value.trim(),
      price:dlvFee,
      driver:document.getElementById('dlv_driver').value.trim(),
      transport:document.getElementById('dlv_transport').value.trim(),
      status:'Kutilmoqda'
    };
    DB.deliveries.push(delivery);
    logActivity(`Yetkazib berish buyurtma qilindi — chek #${checkNo}`);
  }

  logActivity(`Savdo yakunladi (#${checkNo}): ${items.map(i=>i.name+' x'+fmtQty(i.qty)).join(', ')} — ${fmt(grand)}`);
  save();

  cart=[]; selectedPayType='naqd'; cardReceiptImage=null; cartDiscount={type:'none',value:0};
  renderPage();
  openReceiptModal(sale.id);
}

let scanModalProductId = null;
let scanModalReturnToScan = false;
let scanSaleMode = 'qty'; // 'qty' | 'money' — faqat qadoqsiz (kg/litr) mahsulotlar uchun ishlaydi
/* ---------------- SCAN SUCCESS POPUP (faqat Savdo bo'limi, faqat scanner orqali) ----------------
   Mahsulot scanner (kamera yoki USB/BT) orqali topilib, mavjud addToCart/cartAdd/cartAddMoney
   logikasi bo'yicha Savatga muvaffaqiyatli qo'shilgandan KEYIN chaqiriladi. Cart hisob-kitoblariga
   yoki scanner ishlash mexanizmiga hech qanday ta'sir qilmaydi — faqat 1.5s ko'rinadigan
   vizual tasdiq. Ketma-ket skanerlashda bitta popup elementi qayta ishlatiladi va timer qayta
   boshlanadi (eski popup ustiga yangisi qo'shilib ketmaydi). */
let scanPopupHideTimer = null;
function showScanProductPopup(p, qty){
  if(!p) return;
  let box = document.getElementById('scanSuccessPopup');
  if(!box){
    box = document.createElement('div');
    box.id = 'scanSuccessPopup';
    box.className = 'scan-success-popup';
    document.body.appendChild(box);
  }
  const qtyLabel = (qty!=null && qty>0) ? `+${fmtQty(qty)} ${p.unit||''}`.trim() : '+1';
  box.innerHTML = `
    <div class="scan-success-img">${p.image?`<img src="${p.image}" alt="">`:(p.emoji||catIcon(p.category))}</div>
    <div class="scan-success-name">${p.name}</div>
    <div class="scan-success-price">${fmtNum(p.price)} so'm</div>
    <div class="scan-success-badge">${icon('check-circle2')} ${qtyLabel} qo'shildi ✓</div>
  `;
  lucide.createIcons();
  box.classList.remove('show');
  void box.offsetWidth; /* reflow — animatsiyani har safar qaytadan ishga tushirish uchun */
  box.classList.add('show');
  if(scanPopupHideTimer) clearTimeout(scanPopupHideTimer);
  scanPopupHideTimer = setTimeout(()=>{ box.classList.remove('show'); }, 1500);
}
function handleScannedCode(raw){
  const code = (raw||'').trim();
  if(!code) return;
  const p = DB.products.find(x=>x.qrCode===code || x.barcode===code || x.sku.toLowerCase()===code.toLowerCase());
  if(!p || !p.isForSale){ toast(`Mahsulot topilmadi: ${code}`, true); return; }
  if(p.qty<=0){ toast(`${p.name} tugagan — sotib bo'lmaydi`, true); return; }
  const beforeQty = cartFind(p.id)?.qty || 0;
  addToCart(p.id);
  const afterQty = cartFind(p.id)?.qty || 0;
  if(afterQty>beforeQty) showScanProductPopup(p, roundQty(afterQty-beforeQty));
}

function scanAvailableQty(p){
  const existing = cartFind(p.id);
  return Math.max(0, roundQty(p.qty-(existing?existing.qty:0)));

function renderScanQtyModeBody(p){
  if(canSellByMoney(p) && scanSaleMode==='money'){
    return `
      <div style="margin-top:12px;">
        <div style="font-size:11.5px;color:var(--text-soft);font-weight:700;margin-bottom:6px;">Summani kiriting (so'm)</div>

  return `

      <div class="qty-box" style="justify-content:center;">
        <button onclick="changeScanQty(-1)">−</button>
