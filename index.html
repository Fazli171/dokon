function setScanSaleMode(mode){
  const p = DB.products.find(x=>x.id===scanModalProductId); if(!p) return;
  scanSaleMode = mode;
  const toggle = document.getElementById('scanModeToggle');
  if(toggle) toggle.innerHTML = `
    <div class="pay-type ${scanSaleMode==='qty'?'active':''}" onclick="setScanSaleMode('qty')">${icon('scale')}<span>MIQDOR</span></div>
    <div class="pay-type ${scanSaleMode==='money'?'active':''}" onclick="setScanSaleMode('money')">${icon('banknote')}<span>PUL</span></div>`;
  document.getElementById('scanQtyModeWrap').innerHTML = renderScanQtyModeBody(p);
  clearScanProductErr();
  lucide.createIcons();
}
function updateScanMoneyPreview(){
  const p = DB.products.find(x=>x.id===scanModalProductId); if(!p) return;
  const money = Number(document.getElementById('scanMoneyInput').value)||0;
  const qty = money>0 ? roundQty(money/p.price) : 0;
  const el = document.getElementById('scanMoneyPreview'); if(el) el.textContent = `= ${fmtQty(qty)} ${p.unit}`;
  clearScanProductErr();
}
function clearScanProductErr(){ const el=document.getElementById('scanProductErr'); if(el) el.innerHTML=''; }
function showScanProductErr(msg){ const el=document.getElementById('scanProductErr'); if(el) el.innerHTML = `<div class="alert alert-danger" style="margin-top:8px;">${icon('x-circle')}<span>${msg}</span></div>`; lucide.createIcons(); }
function changeScanQty(delta){
  const p = DB.products.find(x=>x.id===scanModalProductId); if(!p) return;
  const step = requiresWholeQty(p) ? 1 : 0.01;
  const input = document.getElementById('scanQtyInput');
  let qty = roundQty((Number(input.value)||0)+delta*step);
  if(qty<0) qty=0;
  if(requiresWholeQty(p)) qty = Math.round(qty);
  input.value = qty;
  clearScanProductErr();
}
function setScanQty(val){
  const p = DB.products.find(x=>x.id===scanModalProductId);
  let v = Number(val);
  if(isNaN(v)||v<0) v=0;
  if(p && requiresWholeQty(p)) v = Math.round(v);
  document.getElementById('scanQtyInput').value = v;
  clearScanProductErr();
}
function confirmScanAddToCart(){
  const p = DB.products.find(x=>x.id===scanModalProductId);
  if(!p) return;
  if(canSellByMoney(p) && scanSaleMode==='money'){
    const money = Math.round(Number(document.getElementById('scanMoneyInput').value)||0);
    if(!money || money<=0){ showScanProductErr("Summani to'g'ri kiriting (0 dan katta bo'lishi shart)"); return; }
    const addQty = roundQty(money/p.price);
    const existing = cartFind(p.id);
    const currentCartQty = existing? existing.qty : 0;
    if(roundQty(currentCartQty+addQty) > p.qty){ showScanProductErr("Omborda yetarli qoldiq yo'q"); return; }
    const ok = cartAddMoney(p.id, money);
    if(!ok) return;
    toast(`${p.emoji} ${p.name} savatga qo'shildi`);
    if(scanModalReturnToScan) showScanProductPopup(p, addQty);
    const resume = scanModalReturnToScan;
    closeModal();
    if(resume) openSalesScanModal();
    else if(currentPage==='sales') renderCart();
    return;
  }
  const qty = roundQty(Number(document.getElementById('scanQtyInput').value)||0);
  if(!qty || qty<=0){ showScanProductErr("Miqdorni to'g'ri kiriting (0 dan katta bo'lishi shart)"); return; }
  if(requiresWholeQty(p) && Math.abs(qty-Math.round(qty))>1e-9){ showScanProductErr("Bu mahsulotda faqat butun miqdor (1, 2, 3 ...) kiritish mumkin"); return; }
  const existing = cartFind(p.id);
  const currentCartQty = existing? existing.qty : 0;
  if(roundQty(currentCartQty+qty) > p.qty){ showScanProductErr("Omborda yetarli qoldiq yo'q"); return; }
  const ok = cartAdd(p.id, qty);
  if(!ok) return;
  toast(`${p.emoji} ${p.name} savatga qo'shildi`);
  if(scanModalReturnToScan) showScanProductPopup(p, qty);
  const resume = scanModalReturnToScan;
  closeModal();
  if(resume) openSalesScanModal();
  else if(currentPage==='sales') renderCart();
}
function cancelScanProductModal(){
  const resume = scanModalReturnToScan;
  closeModal();
  if(resume) openSalesScanModal();
}

  startScanEngine(video, (code)=>{

    const p = DB.products.find(x=>x.qrCode===code||x.barcode===code||x.sku.toLowerCase()===code.toLowerCase());

    }

    }

      stopScanEngine();

    }
    /* Oddiy mahsulot — darhol savatga qo'shiladi (qayta skanerlansa +1), kamera ishlashda davom etadi */
    const beforeQty = cartFind(p.id)?.qty || 0;

    if(box) box.innerHTML = `<div class="alert alert-ok">${icon('check-circle2')}<span>${p.name} savatga qo'shildi</span></div>`;
    if(afterQty>beforeQty) showScanProductPopup(p, roundQty(afterQty-beforeQty));
  }, (err)=>{
    const st=document.getElementById('saleScanStatus'); if(st) st.textContent = "Xato: "+err;
  });
  const st=document.getElementById('saleScanStatus'); if(st) st.textContent = "Kamera faol — mahsulotni ramka ichiga tuting";
}

/* Keyboard-wedge: USB/Bluetooth barcode scanners type fast + Enter.
   "Skanerdan keyin avtomatik Enter" (Sozlamalar > Umumiy, getScannerAutoEnter())
   YOQILGANDA: tez yozish to'xtagandan so'ng (scanner odatda barcode'ni bir
   necha millisekundda to'liq yuboradi) — hatto scanner o'zi Enter yubormasa
   ham — bufer avtomatik yuboriladi.
   O'CHIRILGANDA: mavjud (asl) xatti-harakat saqlanadi — faqat aniq Enter
   bosilganda (yoki scannerning o'zi Enter yuborganda) ishlaydi.
   Ikkala holatda ham wedgeShouldProcess() bir xil kodni ikki marta qayta
   ishlanishining (masalan avtomatik Enter + scannerning o'z Enter'i bir
   xil skanerlash uchun ketma-ket kelsa) oldini oladi — savatga qo'shish
   logikasi ikki marta chaqirilmaydi. */
let wedgeAutoTimer = null;
function wedgeClearAutoTimer(){ if(wedgeAutoTimer){ clearTimeout(wedgeAutoTimer); wedgeAutoTimer=null; } }
function wedgeSubmit(code){
  if(!code || code.length<3) return;
  if(!wedgeShouldProcess(code)) return;
  if(currentPage==='sales') handleScannedCode(code);
  else if(currentPage==='scanner'){ const mc=document.getElementById('manualCode'); if(mc){ mc.value=code; scanLookup(); } }
}
document.addEventListener('keydown', function(e){
  if(currentPage!=='sales' && currentPage!=='scanner') return;
  const now = Date.now();
  if(e.key==='Enter'){
    wedgeClearAutoTimer();
    if(wedgeBuffer.length>=3 && (now-wedgeLastTime)<80){
      e.preventDefault();
      wedgeSubmit(wedgeBuffer);
    }
    wedgeBuffer=''; wedgeLastTime=now; return;
  }
  if(e.key.length===1){
    if(now-wedgeLastTime>80){ wedgeBuffer=''; }
    wedgeBuffer += e.key;
    wedgeLastTime = now;
    if(getScannerAutoEnter()){
      wedgeClearAutoTimer();
      const bufAtSchedule = wedgeBuffer;
      wedgeAutoTimer = setTimeout(function(){
        wedgeAutoTimer = null;
        if(wedgeBuffer===bufAtSchedule && wedgeBuffer.length>=3){
          wedgeSubmit(wedgeBuffer);
          wedgeBuffer='';
        }
      }, 100);
    }
  }
});

/* ================================================================
   PACK / CONVERSION CALCULATOR (tied to product.packUnit/packSize)
   ================================================================ */
function calcPacks(pid){
  const p = DB.products.find(x=>x.id===pid);
  if(!p || !p.packSize){ toast("Bu mahsulotda o'lchov konversiyasi sozlanmagan",true); return; }
  const need = prompt(`Kerakli miqdorni kiriting (${p.unit}):`);
  if(need===null) return;
  const n = Number(need);
  if(!n || n<=0){ toast("Miqdorni to'g'ri kiriting",true); return; }
  const packs = Math.ceil((n/p.packSize) - 1e-9);
  const actualQty = Math.round(packs*p.packSize*100)/100;
  if(actualQty>p.qty){ toast("Omborda yetarli qoldiq yo'q",true); return; }
  const existing = cartFind(pid);
  if(existing) existing.qty = actualQty;
  else cart.push({productId:pid,qty:actualQty});
  toast(`${packs} ${p.packUnit||"quti"} kerak (= ${fmtQty(actualQty)} ${p.unit})`);
  if(currentPage==='sales') renderCart();
}

function buildReceiptHTML(s, isPreview){
  const cust = s.customerId? DB.customers.find(x=>x.id===s.customerId) : null;
  const dlv = isPreview ? null : DB.deliveries.find(d=>d.saleId===s.id);
  const payLabel = {naqd:'Naqd',karta:'Karta',tezTolov:"Tez to'lov",aralash:'Aralash',qarz:'Qarz/Nasiya'}[s.paymentType]||s.paymentType;
  const title = isPreview ? "Chek — oldindan ko'rish" : `Chek #${s.checkNo}`;
  const totalQty = s.items.reduce((a,it)=>a+it.qty,0);
  const body = `
    <div style="text-align:center;margin-bottom:12px;">
      <div style="font-weight:800;font-size:16px;">DO'KON.UZ</div>
      <div style="font-size:11px;color:var(--text-faint);">Oziq-ovqat do'koni</div>
      <div style="font-size:11px;color:var(--text-faint);">${isPreview? "Vaqtinchalik (hali saqlanmagan)" : 'Chek № '+s.checkNo} · ${new Date(s.date).toLocaleString('uz-UZ')}</div>
    </div>
    <div style="font-size:12.5px;margin-bottom:10px;display:flex;justify-content:space-between;">
      <span>Sotuvchi: <strong>${s.employee}</strong></span>
      <span>Mijoz: <strong>${cust?cust.name:'—'}</strong></span>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th>Mahsulot</th><th>Miqdor</th><th>Narx</th><th>Jami</th></tr></thead>
      <tbody>
        ${s.items.map(it=>`<tr>
          <td data-label="Mahsulot">${it.name}</td>
          <td data-label="Miqdor" class="cell-mono">${fmtQty(it.qty)} ${it.unit}${it.moneyEntered!=null?`<div style="font-size:10px;color:var(--text-faint);">(pul bo'yicha)</div>`:''}</td>
          <td data-label="Narx" class="cell-mono">${fmtNum(it.price)}</td>
          <td data-label="Jami" class="cell-mono cell-strong">${fmtNum(it.lineTotal!=null?it.lineTotal:it.price*it.qty)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:10px;font-size:12.5px;">
      <div class="ct-row"><span>Jami miqdor</span><span>${fmtQty(totalQty)}</span></div>
      <div class="ct-row"><span>Umumiy summa (Subtotal)</span><span>${fmtNum(s.subtotal!=null?s.subtotal:s.total)}</span></div>
      ${s.discountTotal?`<div class="ct-row"><span>Chegirma</span><span>−${fmtNum(s.discountTotal)}</span></div>`:''}
      ${s.deliveryFee?`<div class="ct-row"><span>Yetkazib berish${dlv?` (${dlv.address})`:''}</span><span>${fmtNum(s.deliveryFee)}</span></div>`:''}
      <div class="ct-row total"><span>Jami (Yakuniy summa)</span><span id="checkPreviewGrand">${fmt(s.total)}</span></div>
      <div class="ct-row"><span>To'lov turi</span><span>${payLabel}</span></div>
      ${s.paymentType==='naqd'?`<div class="ct-row"><span>Mijoz bergan pul</span><span>${fmtNum(s.paidNow+s.change)}</span></div><div class="ct-row"><span>Qaytim</span><span>${fmtNum(s.change)}</span></div>`:''}
      ${s.paymentType==='aralash'?`<div class="ct-row"><span>Naqd / Karta</span><span>${fmtNum(s.cashPart)} / ${fmtNum(s.cardPart)}</span></div>`:''}
      ${s.paymentType==='qarz'?`<div class="ct-row"><span>To'langan / Qarz</span><span>${fmtNum(s.paidNow)} / ${fmtNum(s.total-s.paidNow)}</span></div>`:''}
      ${s.cardReceiptImage?`<div class="ct-row" style="align-items:flex-start;"><span>Karta chek rasmi</span><span><img src="${s.cardReceiptImage}" style="max-width:140px;max-height:140px;border-radius:8px;border:1px solid var(--border);"></span></div>`:''}
    </div>`;
  const canReturn = !isPreview && s.status!=='bekor qilingan' && (currentRole==='admin' || DB.roleRights[currentRole].returns);
  const footer = isPreview ? `
    <button class="btn btn-outline" onclick="closeModal()">Yopish</button>
    <button class="btn btn-primary" onclick="closeModal();completeSale()">${icon('check-circle2')} Savdoni yakunlash</button>
  ` : `
    <button class="btn btn-outline" onclick="printReceipt()">${icon('printer')} Chop etish</button>
    <button class="btn btn-outline" onclick="downloadReceiptPdf('${s.id}')">${icon('file-text')} PDF</button>
    ${canReturn? `<button class="btn btn-outline" onclick="closeModal();openReturnModal('${s.id}')">${icon('rotate-ccw')} Qaytarish</button>` : ''}

function openReceiptModal(saleId){
  const s = DB.sales.find(x=>x.id===saleId);
  if(!s) return;
  buildReceiptHTML(s, false);
}
function openCheckPreview(){
  if(!cart.length){ toast("Savat bo'sh",true); return; }
  const empName = document.getElementById('roleSelect').selectedOptions[0].textContent.split('—')[1].trim();
  const customerId = document.getElementById('saleCustomer')?.value || null;
  const subtotal = cartSubtotal();
  const discountTotal = cartDiscountTotal();
  const deliveryFee = currentDeliveryFee();
  const total = subtotal - discountTotal + deliveryFee;
  const items = cart.map(c=>{
    const p = DB.products.find(x=>x.id===c.productId);
    return {productId:c.productId, name:p.name, qty:c.qty, unit:p.unit, price:lineUnitPrice(c,p), lineTotal:lineTotal(c,p), moneyEntered:c.moneyEntered!=null?c.moneyEntered:null};
  });
  let paidNow=total, change=0, cashPart=0, cardPart=0;
  if(selectedPayType==='naqd'){
    const given = Number(document.getElementById('cashGiven')?.value)||0;
    change = Math.max(given-total,0); paidNow=total;
  } else if(selectedPayType==='aralash'){
    cashPart = Number(document.getElementById('mixCash')?.value)||0;
    cardPart = Number(document.getElementById('mixCard')?.value)||0;
    paidNow = total;
  } else if(selectedPayType==='qarz'){
    paidNow = Number(document.getElementById('partNow')?.value)||0;
  }
  const needsCardImg = selectedPayType==='karta' || (selectedPayType==='aralash' && cardPart>0);
  const preview = {
    checkNo:'PREVIEW', date:new Date().toISOString(), employee:empName, customerId, items,
    subtotal, discountTotal, deliveryFee, total, paymentType:selectedPayType, paidNow, change, cashPart, cardPart,
    cardReceiptImage: needsCardImg ? cardReceiptImage : null
  };
  buildReceiptHTML(preview, true);
}

function printReceipt(){
  const html = document.getElementById('receiptBody').innerHTML;
  const w = window.open('','_blank');
  w.document.write('<html><head><title>Chek</title></head><body style="font-family:Arial,sans-serif;padding:20px;max-width:420px;margin:0 auto;">'+html+'</body></html>');
  w.document.close();
  w.focus();
  w.print();
}
function downloadReceiptPdf(saleId){
  if(typeof window.jspdf==='undefined'){ toast("PDF kutubxonasi yuklanmadi — internet aloqasini tekshiring",true); return; }
  const s = DB.sales.find(x=>x.id===saleId);
  if(!s) return;
  const cust = s.customerId? DB.customers.find(x=>x.id===s.customerId) : null;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt',format:'a5'});
  let y = 40;
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text("DO'KON.UZ", 148, y, {align:'center'}); y+=16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text("Oziq-ovqat do'koni", 148, y, {align:'center'}); y+=20;
  doc.setFontSize(10);
  doc.text(`Chek: ${s.checkNo}`, 40, y); doc.text(`${new Date(s.date).toLocaleString('uz-UZ')}`, 256, y, {align:'right'}); y+=16;
  doc.text(`Sotuvchi: ${s.employee}`, 40, y); y+=14;
  doc.text(`Mijoz: ${cust?cust.name:'—'}`, 40, y); y+=18;
  doc.setFont('helvetica','bold'); doc.text('Mahsulot', 40, y); doc.text('Miqdor', 170, y); doc.text('Narx', 220, y); doc.text('Jami', 270, y, {align:'right'});
  doc.setFont('helvetica','normal'); y+=6; doc.line(40,y,296,y); y+=12;
  s.items.forEach(it=>{
    const name = it.name.length>22? it.name.slice(0,22)+'…' : it.name;
    doc.text(name, 40, y);
    doc.text(`${fmtQty(it.qty)} ${it.unit}`, 170, y);
    doc.text(fmtNum(it.price), 220, y);
    doc.text(fmtNum(it.lineTotal!=null?it.lineTotal:it.price*it.qty), 296, y, {align:'right'});
    y+=14;
    if(y>560){ doc.addPage(); y=40; }
  });
  y+=6; doc.line(40,y,296,y); y+=16;
  doc.text(`Oraliq summa: ${fmtNum(s.subtotal!=null?s.subtotal:s.total)}`, 40, y); y+=14;
  if(s.discountTotal) { doc.text(`Chegirma: -${fmtNum(s.discountTotal)}`, 40, y); y+=14; }
  if(s.deliveryFee) { doc.text(`Yetkazib berish: ${fmtNum(s.deliveryFee)}`, 40, y); y+=14; }
  doc.setFont('helvetica','bold'); doc.text(`JAMI: ${fmtNum(s.total)} so'm`, 40, y); doc.setFont('helvetica','normal'); y+=16;
  doc.text(`To'lov turi: ${s.paymentType}`, 40, y); y+=14;
  if(s.paymentType==='naqd'){ doc.text(`Bergan pul: ${fmtNum(s.paidNow+s.change)}  Qaytim: ${fmtNum(s.change)}`, 40, y); y+=14; }
  if(s.paymentType==='qarz'){ doc.text(`To'langan: ${fmtNum(s.paidNow)}  Qarz: ${fmtNum(s.total-s.paidNow)}`, 40, y); y+=14; }
  doc.save(`chek_${s.checkNo}.pdf`);
}

}
function activeSalesOrAll(){ return DB.sales; }
function cancelSale(id){
  const canCancel = currentRole==='admin' || DB.roleRights[currentRole].cancelSale;
  if(!canCancel){ toast("Sizda savdoni bekor qilish huquqi yo'q",true); return; }
  const s = DB.sales.find(x=>x.id===id);
  if(!s || s.status==='bekor qilingan') return;
  const reason = prompt("Bekor qilish sababini kiriting:");
  if(!reason || !reason.trim()){ toast("Sabab kiritilishi shart",true); return; }
  s.items.forEach(it=>{ const p=DB.products.find(x=>x.id===it.productId); if(p) p.qty=roundQty(p.qty+it.qty); });
  if(s.paymentType==='qarz' && s.customerId){
    const c = DB.customers.find(x=>x.id===s.customerId);
    if(c){
      const debtAmt = s.total-s.paidNow;
      c.debtTotal = Math.max(0, c.debtTotal-debtAmt);
      c.history.push({date:new Date().toISOString(),type:'tolov',amount:debtAmt,note:`Savdo bekor qilindi (#${s.checkNo}) — qarz qaytarildi`});
    }
  }
  s.status='bekor qilingan';
  s.cancelReason=reason.trim();
  s.cancelledBy=document.getElementById('roleSelect').selectedOptions[0].textContent.split('—')[1].trim();
  s.cancelledAt=new Date().toISOString();
  logActivity(`Savdoni bekor qildi (#${s.checkNo}) — sabab: ${reason.trim()}`);
  save();
  toast("Savdo bekor qilindi va qoldiq tiklandi");
  openSalesHistoryModal();
  if(currentPage==='sales'||currentPage==='dashboard'||currentPage==='warehouse') renderPage();
}

  if(!p.batches) p.batches = [];
  p.batches.push({id:uid('lot'), productId:p.id, lot:'TRANSFER-'+t.id.slice(-5), qty:t.qty, cost:t.cost||p.cost, price:t.price||p.price,

  p.qty = roundQty(p.qty + t.qty);

/* ---------------- Partiya (LOT) tizimi ----------------
   Har bir Kirim alohida partiya sifatida saqlanadi (miqdor, olingan narx,
   sotish narxi, srok, yetkazib beruvchi, sana). Mahsulotning umumiy
   qoldig'i (p.qty) har doim partiyalar yig'indisiga teng. Chiqim/Savdo/
   Qaytarish esa consumeFromBatches() orqali FIFO + "muddati yaqinini
   birinchi chiqarish" tartibida partiyalardan ayiradi. */
function generateLotCode(){
  const d = new Date();
  const ymd = String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let seq = 1;
  DB.products.forEach(p=>{
    (p.batches||[]).forEach(b=>{
      if(b.lot && b.lot.indexOf('LOT-'+ymd+'-')===0){
        const n = parseInt(b.lot.split('-')[2],10);
        if(!isNaN(n) && n>=seq) seq = n+1;
      }
    });
  });
  return 'LOT-'+ymd+'-'+String(seq).padStart(3,'0');
}
function consumeFromBatches(p, qty, whId){
  const targetWh = whId || defaultWarehouseId();
  let remain = roundQty(qty);
  if(!p.batches) p.batches = [];
  const sorted = p.batches.filter(b=>(b.warehouseId||defaultWarehouseId())===targetWh).sort((a,b)=>{
    const ea = a.expiry ? new Date(a.expiry).getTime() : Infinity;
    const eb = b.expiry ? new Date(b.expiry).getTime() : Infinity;
    if(ea!==eb) return ea-eb; // muddati yaqin partiya birinchi chiqadi
    return (a.createdAt||0)-(b.createdAt||0); // aks holda FIFO — eski partiya birinchi
  });
  let costSum = 0, costQty = 0;
  for(const b of sorted){
    if(remain<=0) break;
    const take = Math.min(b.qty, remain);
    if(take<=0) continue;
    b.qty = roundQty(b.qty - take);
    remain = roundQty(remain - take);
    costSum += (b.cost||0)*take;
    costQty += take;
  }
  p.batches = p.batches.filter(b=>b.qty>0.0000001);
  p.qty = roundQty(p.batches.reduce((a,b)=>a+b.qty,0));
  return costQty>0 ? costSum/costQty : (p.cost||0);
}

   ko'ra umumiy og'irlik/hajmni avtomatik hisoblab ko'rsatadi (masalan:

   omborga qo'shiladigan asosiy qiymat har doim "dona" (hisob birligi)da qoladi. */
function smUpdateTotalWeight(pid){
  const el = document.getElementById('sm_total_weight');
  if(!el) return;
  const p = DB.products.find(x=>x.id===pid);
  const qtyEl = document.getElementById('sm_qty');
  if(!p || !p.size || !qtyEl){ el.textContent=''; return; }
  const size = Number(p.size);
  const qty = Number(qtyEl.value)||0;
  if(!size || !qty){ el.textContent=''; return; }
  const pkgUnit = p.pkgUnit || '';
  const total = size*qty;
  let extra = '';
  if(pkgUnit==='g' && total>=1000) extra = ` = ${fmtQty(total/1000)} kg`;
  else if(pkgUnit==='ml' && total>=1000) extra = ` = ${fmtQty(total/1000)} litr`;
  el.textContent = `${fmtQty(qty)} ${p.unit} × ${fmtQty(size)} ${pkgUnit} = ${fmtQty(total)} ${pkgUnit}${extra}`;
}

/* ---------------- Partiya (LOT) srok yorlig'i: QR + chop etish ----------------
   Har bir kirim partiyasi uchun ALOHIDA QR kod (mahsulotning umumiy QR-kodidan farqli)
   — productId, sellerId, lotId, lot, expiry ma'lumotlarini o'z ichiga oladi. Skanerlanganda
   dkFindBatchByQrPayload() aynan shu mahsulot + aynan shu partiyani aniqlaydi. */
function fmtDateUZ(iso){
  if(!iso) return '—';
  const parts = String(iso).slice(0,10).split('-');
  return parts.length===3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : iso;
}
function batchQrPayload(p, b){
  return JSON.stringify({type:'lot', productId:p.id, sellerId:b.sellerId||currentSellerId(), lotId:b.id, lot:b.lot, expiry:b.expiry||null});
}
/* Skanerlangan QR matnini partiya identifikatoriga aylantiradi (JSON bo'lmasa null qaytaradi). */
function parseBatchQrPayload(text){
  try{
    const obj = JSON.parse(text);
    return (obj && obj.type==='lot' && obj.productId && obj.lotId) ? obj : null;
  }catch(e){ return null; }
}
function dkFindBatchByQrPayload(text){
  const data = parseBatchQrPayload(text);
  if(!data) return null;
  const p = DB.products.find(x=>x.id===data.productId);
  if(!p) return null;
  const b = (p.batches||[]).find(x=>x.id===data.lotId);
  return b ? {product:p, batch:b} : null;
}
/* ---------------- Srok/LOT stiker uchun EAN-13 shtrix-kod ----------------
   Bu mahsulotning umumiy shtrix-kodidan (p.barcode, CODE128) ALOHIDA —
   faqat srok/LOT stikeri uchun ishlatiladigan EAN-13 formatidagi kod.
   Mavjud batch/LOT QR identifikatsiya logikasi (batchQrPayload) bilan
   hech qanday to'qnashuv yo'q, ular bir-biridan mustaqil. */
function ean13CheckDigit(digits12){
  let sum = 0;
  for(let i=0;i<12;i++){
    const d = Number(digits12[i])||0;
    sum += (i%2===0) ? d : d*3; // toq pozitsiyalar (1,3,5..) x1, juft pozitsiyalar (2,4,6..) x3
  }
  return String((10 - (sum % 10)) % 10);
}
function isValidEAN13(code){
  if(!/^\d{13}$/.test(String(code||''))) return false;
  return ean13CheckDigit(String(code).slice(0,12)) === String(code).slice(12);
}
/* Yagona, umumiy EAN-13 renderer — "Mahsulot haqida" (dk_detail_bc) va
   "Tovar haqida" (tv_detail_bc) oynalarida bir xil ko'rinishda ishlatiladi,
   shunda ikkita joyda JsBarcode sozlamalarini takrorlash shart emas.
   element — <svg> yoki <canvas> DOM elementi, code — 13 xonali EAN-13 kod. */
function renderEAN13(element, code){
  if(!element || !code) return false;
  if(typeof JsBarcode==='undefined'){ console.error('JsBarcode yuklanmagan'); return false; }
  if(!isValidEAN13(code)){ console.error('Noto\'g\'ri EAN-13:', code); return false; }
  try{
    JsBarcode(element, code, {
      format:'EAN13',
      displayValue:true,
      fontSize:12,
      fontOptions:'bold',
      height:55,
      width:1.5,
      margin:8,
      textMargin:4
    });
    // Modal/kichik ekranlardan tashqariga chiqib ketmasligi uchun responsiv qilib qo'yamiz.
    element.style.maxWidth = '100%';
    element.style.height = 'auto';
    return true;
  }catch(error){ console.error('EAN-13 render xatosi:', error); return false; }
}
/* ---------------- "Mahsulot haqida" — QR-kod va Shtrix-kodni alohida chop etish ----------------
   Mavjud QR/EAN-13 generatsiyasi va dizayni o'zgarmaydi — faqat shu mahsulotning
   kodi alohida oynada (window.open, mavjud printReceipt/printBatchLabel uslubida)

/* Berilgan matndan (masalan productId+lotId) doim bir xil natija beruvchi
   12 xonali raqamlar ketma-ketligi hosil qiladi — shu asosda checksum'i
   to'g'ri EAN-13 kod tuziladi va har safar print qilinganda o'zgarmaydi. */
function stable12DigitsFromSeed(seed){
  let h1 = 0, h2 = 0;
  const s = String(seed||'');
  for(let i=0;i<s.length;i++){
    const c = s.charCodeAt(i);
    h1 = (h1*31 + c) >>> 0;
    h2 = (h2*131 + c) >>> 0;
  }
  const combined = (String(h1)+String(h2)).replace(/\D/g,'') + '000000000000';
  return combined.slice(0,12);
}
/* Berilgan mahsulot/partiya uchun EAN-13 kodni qaytaradi:
   1) Agar mahsulotda haqiqiy (checksum'i to'g'ri) EAN-13 shtrix-kod mavjud bo'lsa — o'shani ishlatadi;
   2) Aks holda, shu partiya uchun avval yaratilgan kod bo'lsa — o'shani qaytaradi (o'zgarmaydi);
   3) Aks holda, checksum'i matematik to'g'ri yangi EAN-13 kod yaratib, partiyaga (b.ean13) bir marta saqlaydi. */
function getBatchEAN13(p, b){
  if(isValidEAN13(p.barcode)) return p.barcode;
  if(b.ean13 && isValidEAN13(b.ean13)) return b.ean13;
  const base12 = stable12DigitsFromSeed('EAN-'+p.id+'-'+b.id);
  const code = base12 + ean13CheckDigit(base12);
  b.ean13 = code;
  save();
  return code;
}
/* Berilgan EAN-13 kodni JsBarcode orqali sinxron ravishda rasm (data URL) qilib qaytaradi.
   JsBarcode "EAN13" formati klassik ko'rinishni (chetki/markaziy guard chiziqlar balandroq,
   birinchi raqam chapda alohida, raqamlar pastda guruhlangan) o'zi avtomatik chizadi —
   buning uchun qo'shimcha ishlov kerak emas, faqat o'lcham/shrift sozlanadi. */
function ean13DataUrlSync(code, barWidth, height, fontSize){
  if(typeof JsBarcode==='undefined' || !code) return '';
  try{
    const canvas = document.createElement('canvas');
    JsBarcode(canvas, code, {format:'EAN13', displayValue:true, fontSize:fontSize||9, height:height||34, width:barWidth||1.3, margin:6, textMargin:2});
    return canvas.toDataURL('image/png');
  }catch(e){ return ''; }
}
/* Berilgan matnni sinxron ravishda QR rasm (base64 data URL) qilib qaytaradi.
   Vaqtinchalik, ekrandan tashqarida joylashgan konteynerda render qilinadi va darhol o'chiriladi. */
function qrDataUrlSync(text, size){
  if(typeof QRCode==='undefined') return '';
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='-9999px';
  document.body.appendChild(holder);
  let dataUrl = '';
  try{
    new QRCode(holder,{text, width:size||150, height:size||150});
    const img = holder.querySelector('img');
    const canvas = holder.querySelector('canvas');
    if(img && img.src && img.src.indexOf('data:')===0) dataUrl = img.src;
    else if(canvas) dataUrl = canvas.toDataURL('image/png');
  }catch(e){}
  document.body.removeChild(holder);
  return dataUrl;
}

          </label>

            <input type="radio" name="labelVariant" value="ean13" onchange="updateBatchLabelPreview('${p.id}','${b.id}')"> EAN-13

}
/* Modal ichidagi kod preview'ini tanlangan stiker turiga (QR / EAN-13 / ikkalasi) qarab
   yangilaydi. EAN-13 uchun JsBarcode'ning klassik ko'rinishi (guard chiziqlar, raqamlar
   pastda) katta va aniq o'lchamda ko'rsatiladi, shunda foydalanuvchi chop etishdan oldin
   haqiqiy shtrix-kod qanday chiqishini ko'ra oladi. */
function updateBatchLabelPreview(productId, batchId){
  const box = document.getElementById('batchLabelCodePreview');
  if(!box) return;
  const p = DB.products.find(x=>x.id===productId);
  const b = p && (p.batches||[]).find(x=>x.id===batchId);
  if(!p || !b) return;
  const variantEl = document.querySelector('input[name="labelVariant"]:checked');
  const variant = variantEl ? variantEl.value : 'qr';

  let html = '';
  if(variant==='qr' || variant==='both'){
    const qrImg = qrDataUrlSync(batchQrPayload(p,b), 150);
    html += qrImg ? `<img src="${qrImg}" style="width:130px;height:130px;">` : `<div style="font-size:11px;color:var(--text-faint);">QR yaratilmadi</div>`;
  }
  if(variant==='ean13' || variant==='both'){
    const ean13Code = getBatchEAN13(p,b);
    const ean13Img = ean13DataUrlSync(ean13Code, 2, 55, 15);
    html += `<div style="margin-top:${variant==='both'?'10px':'0'};">${ean13Img?`<img src="${ean13Img}" style="max-width:100%;height:auto;">`:`<div style="font-size:11px;color:var(--text-faint);">Shtrix-kod yaratilmadi</div>`}</div>`;
  }
  box.innerHTML = html;
}
/* Srok/LOT stikerini 20x20 mm o'lchamda, tanlangan turda (QR / EAN-13 / ikkalasi)
   va tanlangan sonda alohida print oynasida chop etadi. Faqat stikerlar ko'rinadi —
   asosiy dastur interfeysi, header/footer yoki A4 dizayni ishlatilmaydi. */
function printBatchLabel(productId, batchId){
  const p = DB.products.find(x=>x.id===productId);
  if(!p) return;
  const b = (p.batches||[]).find(x=>x.id===batchId);
  if(!b) return;

  const countInput = document.getElementById('labelPrintCount');
  const rawCount = countInput ? countInput.value : '1';
  const count = parseInt(rawCount, 10);
  if(!/^\d+$/.test(String(rawCount).trim()) || !Number.isInteger(count) || count < 1){
    toast("Chop etish soni faqat musbat butun son bo'lishi kerak", true);
    return;
  }

  const variantEl = document.querySelector('input[name="labelVariant"]:checked');
  const variant = variantEl ? variantEl.value : 'qr';

  const qrImg = (variant==='qr' || variant==='both') ? qrDataUrlSync(batchQrPayload(p,b), 200) : '';
  const ean13Code = (variant==='ean13' || variant==='both') ? getBatchEAN13(p,b) : '';
  const ean13Img = ean13Code ? ean13DataUrlSync(ean13Code, 1.3) : '';

  const nameShort = (p.name||'').length>22 ? (p.name||'').slice(0,21)+'…' : (p.name||'');
  const lotLine = `LOT: ${b.lot}`;
  const expLine = `SROK: ${fmtDateUZ(b.expiry)}`;

  const qrStickerHtml = `<div class="stk">
      <div class="stk-name">${nameShort}</div>
      ${qrImg?`<img class="stk-qr" src="${qrImg}">`:''}
      <div class="stk-meta">${lotLine}</div>
      <div class="stk-meta">${expLine}</div>
    </div>`;
  const eanStickerHtml = `<div class="stk">
      <div class="stk-name">${nameShort}</div>
      ${ean13Img?`<img class="stk-ean" src="${ean13Img}">`:''}
      <div class="stk-meta">${lotLine}</div>
      <div class="stk-meta">${expLine}</div>
    </div>`;

  let stickers = '';
  if(variant==='qr' || variant==='both'){
    for(let i=0;i<count;i++) stickers += qrStickerHtml;
  }
  if(variant==='ean13' || variant==='both'){
    for(let i=0;i<count;i++) stickers += eanStickerHtml;
  }

  const w = window.open('','_blank');
  if(!w){ toast("Chop etish oynasi ochilmadi (brauzer popupni bloklagan bo'lishi mumkin)", true); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Srok/LOT stiker</title>
<style>
  @page{ size:20mm 20mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:Arial,Helvetica,sans-serif; }
  .stk{
    width:20mm; height:20mm; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0.6mm; page-break-after:always; break-after:page;
  }
  .stk:last-child{ page-break-after:auto; break-after:auto; }
  .stk-name{ font-size:6.4px; font-weight:700; line-height:1.05; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .stk-qr{ width:13mm; height:13mm; margin:0.4mm 0; }
  .stk-ean{ width:17.5mm; max-height:9mm; margin:0.4mm 0; }
  .stk-meta{ font-size:5.6px; line-height:1.15; }
</style>
</head><body>${stickers}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(function(){ w.print(); }, 200);
}

/* ================================================================
   TOVARLAR — sotuvchi tomonidan shtrix-kod/QR/nom orqali qidirilgan
   mavjud mahsulot (DB.products) "SOTUVDA" tugmasi bilan shu bo'limga
   qo'shiladi (p.isForSale=true). Yangi mahsulot yaratilmaydi, mavjud
   ID/SKU/barcode/QR o'zgarmaydi. Qoldiq har doim DB.products dan (ya'ni
   Ombor/Savdo bilan bir xil manbadan) jonli o'qiladi, shuning uchun
   Kirim/Savdo qilinganda avtomatik yangilanadi. Mavjud Mahsulotlar/
   Ombor/Savdo logikasi bu bo'lim tomonidan o'zgartirilmaydi.
   ================================================================ */
let tvSearchQuery = '';
function tvNormQuery(q){ return (q||'').toLowerCase().replace(/\s+/g,' ').trim(); }
/* Mahsulot hech qachon Ombordan qabul qilinganmi (Kirim tarixida bormi) —
   productId bo'yicha, eski yozuvlar uchun productName bo'yicha ham tekshiradi. */
function tvEverReceived(p){
  return DB.stockMoves.some(m=> m.dir==='in' && (m.productId===p.id || m.productName===p.name));
}
function tvStatus(p){
  if(p.qty===0 && !tvEverReceived(p)) return {label:"Qabul qilinmagan",cls:'gray'};
  if(p.qty===0) return {label:'Tugagan',cls:'red'};
  if(p.qty<=p.minQty) return {label:'Kam qoldi',cls:'yellow'};
  return {label:'Yetarli',cls:'green'};
}
function tvStatusColor(cls){
  return cls==='red' ? 'var(--danger,#D64545)' : cls==='yellow' ? 'var(--warning,#E0A82E)' : cls==='green' ? 'var(--primary,#0F8B4C)' : 'var(--text-faint,#7D9587)';
}
function renderTovarlar(){
  const items = DB.products.filter(p=>p.isForSale);

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline compact-action-btn" onclick="dkDownloadExcelTemplate()">${icon('download')} Excel shablonini yuklab olish</button>

    </div>
  </div>
  <div class="card" style="margin-bottom:14px;">
    <div class="section-title">Mahsulot qidirish (nomi, SKU, shtrix-kod yoki QR kod)</div>

      <div class="dk-search-input-wrap">
        ${icon('search','dk-search-icon')}

          oninput="tvSearchQuery=this.value;tvRenderSearchResults();dkToggleClearBtn('tvSearchInput','tvSearchClear')"
          onkeydown="if(event.key==='Escape'){tvClearSearch();}">

function tvSearchResultsHtml(){
  const q = tvNormQuery(tvSearchQuery);

  if(!list.length) return `<div class="empty-state" style="padding:14px 0;">${icon('search')}<div>Hech qanday mahsulot topilmadi</div></div>`;
  return `<div class="tv-found-list">${list.map(p=>tvFoundCardHtml(p)).join('')}</div>`;

function tvRenderSearchResults(){
  const el = document.getElementById('tvSearchResults');

function tvFoundCardHtml(p){

  const items = DB.products.filter(p=>p.isForSale);

  if(wrap) wrap.innerHTML = tvGridHtml(items);

  if(countEl) countEl.textContent = `Sotuvda: ${items.length} ta mahsulot`;

function tvMarkForSale(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p) return;
  if(p.isForSale){ toast("Bu mahsulot allaqachon sotuvda"); return; }
  const sellerId = currentSellerId();
  let sp = sellerProductEntry(sellerId, id);
  if(sp){ sp.isForSale = true; }
  else { DB.sellerProducts.push({id:uid('sp'), sellerId, productId:id, isForSale:true, createdAt:Date.now()}); }
  // Bitta faol do'kon konteksti bo'lgani uchun p.isForSale joriy sotuvchining
  // holatini aks ettiradi — Tovarlar/Ombor shu bayroqni o'qiydi (renderTovarlar/whProducts).
  p.isForSale = true;
  p.qty = p.qty || 0; // Kirim qilinmagunicha qoldiq 0 bo'lib qoladi
  logActivity(`${p.name} — Tovarlar bo'limiga qo'shildi (SOTUVDA)`);
  save();
  toast(`${p.emoji} ${p.name} sotuvga chiqarildi`);
  tvRenderSearchResults();
  tvRenderGrid();

function tvRemoveFromSale(id){
  const p = DB.products.find(x=>x.id===id);

  if(p.qty>0){

    <div class="modal-body">

  const p = DB.products.find(x=>x.id===id);

/* ---------------- Kamera bilan skanerlash (mavjud startScanEngine dvigatelidan foydalanadi) ---------------- */
let tvScanLast = {code:null,time:0};
function tvOpenScanModal(){
  openModal(`
    <div class="modal-head"><h3>${icon('scan-line')} QR/Shtrix-kod skanerlash</h3><button class="btn-ghost" onclick="tvCloseScanModal()">${icon('x')}</button></div>
    <div class="modal-body" style="text-align:center;">
      <div class="scan-frame" id="tvScanFrame" style="max-width:340px;margin:0 auto 12px;">
        <video id="tvScanVideo" autoplay playsinline muted></video>
        <span id="tvScanPlaceholder">${icon('scan-line')}</span>
        <div class="scan-corner tl"></div><div class="scan-corner tr"></div><div class="scan-corner bl"></div><div class="scan-corner br"></div>
        <div class="scan-line"></div>
      </div>
      <p class="scan-hint">Shtrix-kodni ramka ichiga joylashtiring</p>
      <p id="tvScanStatus" style="font-size:12px;color:var(--text-faint);margin-bottom:10px;">Kamera ochilmoqda...</p>
      <div class="field" style="display:flex;gap:8px;text-align:left;">
        <input type="text" id="tvManualCode" placeholder="QR / shtrix-kod / SKU qo'lda kiriting" onkeydown="if(event.key==='Enter')tvManualLookup()">
        <button class="btn btn-outline" onclick="tvManualLookup()">${icon('search')}</button>
      </div>
    </div>
  `);
  tvScanLast = {code:null,time:0};
  const video = document.getElementById('tvScanVideo');
  video.style.display='block';
  document.getElementById('tvScanPlaceholder').style.display='none';
  startScanEngine(video,(code)=>{
    const now = Date.now();
    if(code===tvScanLast.code && now-tvScanLast.time<1200) return;
    tvScanLast = {code, time:now};
    tvHandleScanResult(code);
  },(err)=>{
    const st=document.getElementById('tvScanStatus'); if(st) st.textContent = "Xato: "+err;
  });
  const st=document.getElementById('tvScanStatus'); if(st) st.textContent = "Kamera faol — kodni ramka ichiga tuting";
}
function tvCloseScanModal(){ stopScanEngine(); closeModal(); }
function tvManualLookup(){
  const el = document.getElementById('tvManualCode');
  const code = el ? el.value.trim() : '';
  if(!code) return;
  tvHandleScanResult(code);
}
function tvHandleScanResult(code){
  stopScanEngine();
  closeModal();
  tvSearchQuery = code;
  if(currentPage==='tovarlar'){
    const inp = document.getElementById('tvSearchInput'); if(inp) inp.value = code;
    dkToggleClearBtn('tvSearchInput','tvSearchClear');
    tvRenderSearchResults();
  } else {
    nav('tovarlar');
  }
}

    </div>

      <button class="btn btn-primary" onclick="payDebt('${c.id}')">${icon('check')} To'lovni qabul qilish</button></div>
  `);

function payDebt(id){
  const c = DB.customers.find(x=>x.id===id);
  const amt = Number(document.getElementById('pay_amount').value)||0;
  const note = document.getElementById('pay_note').value.trim();
  if(amt<=0){ toast("Summani kiriting",true); return; }
  const applied = Math.min(amt,c.debtTotal);
  c.debtTotal -= applied; c.paid += applied;
  c.history.push({date:new Date().toISOString(),type:'tolov',amount:applied,note:note||"Qarz to'lovi"});
  if(c.debtTotal<=0){ c.debtTotal=0; c.dueDate=null; }
  logActivity(`${c.name} dan ${fmt(applied)} qarz to'lovini qabul qildi`);
  save(); closeModal(); toast("To'lov qabul qilindi"); renderPage();
}

/* ================================================================
   KASSA — SMENA (SHIFT) TIZIMI
   ================================================================
   DB.currentShift  — hozir ochiq bo'lgan smena (yoki null).
   DB.closedShifts  — yopilgan smenalarning YAKUNIY SNAPSHOT'lari.
   Har bir savdo/qaytarish yaratilganda joriy smenaning id'si bilan
   belgilanadi (shiftId) — shu orqali joriy smena hisoboti REAL VAQTDA,
   qo'lda hech narsa qayta kiritmasdan yangilanib boradi. Smena
   yopilganda barcha summalar bir marta hisoblab, o'zgarmas holda
   closedShifts'ga yoziladi — keyinchalik joriy ma'lumotlar
   o'zgarsa ham (masalan yangi savdo) ushbu tarixiy yozuv o'zgarmaydi. */
function shiftCashierName(){
  const sel = document.getElementById('roleSelect');
  return sel ? sel.selectedOptions[0].textContent.split('—')[1].trim() : currentRole;
}
function computeShiftFigures(shift){
  const sales = activeSales().filter(s=>s.shiftId===shift.id);
  const returns = confirmedReturns().filter(r=>r.shiftId===shift.id);
  const naqdSavdo = sales.filter(s=>s.paymentType==='naqd').reduce((a,s)=>a+s.paidNow,0) + sales.filter(s=>s.paymentType==='aralash').reduce((a,s)=>a+(s.cashPart||0),0);
  const kartaSavdo = sales.filter(s=>s.paymentType==='karta').reduce((a,s)=>a+s.total,0) + sales.filter(s=>s.paymentType==='aralash').reduce((a,s)=>a+(s.cardPart||0),0);
  const tezTolovSavdo = sales.filter(s=>s.paymentType==='tezTolov').reduce((a,s)=>a+s.total,0);
  const qarzSavdo = sales.filter(s=>s.paymentType==='qarz').reduce((a,s)=>a+s.total,0);
  const jamiSavdo = sales.reduce((a,s)=>a+s.total,0);
  const naqdQaytarilgan = returns.filter(r=>r.method==='naqd').reduce((a,r)=>a+returnAmount(r),0);
  const kartaQaytarilgan = returns.filter(r=>r.method==='karta').reduce((a,r)=>a+returnAmount(r),0);
  const tezTolovQaytarilgan = returns.filter(r=>r.method==='tezTolov').reduce((a,r)=>a+returnAmount(r),0);
  const qaytarishJami = returns.reduce((a,r)=>a+returnAmount(r),0);
  const sofSavdo = jamiSavdo - qaytarishJami;
  const kirimJami = (shift.cashIncomes||[]).reduce((a,x)=>a+x.amount,0);
  const chiqimJami = (shift.cashExpenses||[]).reduce((a,x)=>a+x.amount,0);
  const inkassatsiyaJami = (shift.collections||[]).reduce((a,x)=>a+x.amount,0);
  const expectedCash = (shift.openingCash||0) + naqdSavdo - naqdQaytarilgan + kirimJami - chiqimJami - inkassatsiyaJami;
  const operatsiyalarSoni = sales.length + returns.length;
  return {sales,returns,naqdSavdo,kartaSavdo,tezTolovSavdo,qarzSavdo,jamiSavdo,naqdQaytarilgan,kartaQaytarilgan,tezTolovQaytarilgan,
    qaytarishJami,sofSavdo,kirimJami,chiqimJami,inkassatsiyaJami,expectedCash,operatsiyalarSoni};
}

/* Joriy smenaning savdo/qaytarish/kirim/chiqim/inkassatsiya amaliyotlari — vaqt bo'yicha (yangisi tepada) */
function shiftOperationsList(shift, f){
  const list = [];
  f.sales.forEach(s=>list.push({date:s.date, label:'Savdo', desc:`Chek ${s.checkNo} (${methodLabel(s.paymentType)})`, amount:s.total, sign:1}));
  f.returns.forEach(r=>list.push({date:r.date, label:'Qaytarish', desc:`${r.product} — chek ${r.checkNo||''}`, amount:returnAmount(r), sign:-1}));
  (shift.cashIncomes||[]).forEach(x=>list.push({date:x.date, label:'Kirim', desc:x.note||'Kassa kirimi', amount:x.amount, sign:1}));
  (shift.cashExpenses||[]).forEach(x=>list.push({date:x.date, label:'Chiqim', desc:x.note||'Kassa chiqimi', amount:x.amount, sign:-1}));
  (shift.collections||[]).forEach(x=>list.push({date:x.date, label:'Inkassatsiya', desc:x.note||'Inkassatsiya', amount:x.amount, sign:-1}));
  return list.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

function openCloseShiftModal(){
  if(!DB.currentShift){ toast("Ochiq smena yo'q",true); return; }
  const f = computeShiftFigures(DB.currentShift);
  openModal(`
    <div class="modal-head"><h3>${icon('lock')} Smenani yopish — #${DB.currentShift.number}</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="ct-row total"><span>Tizimdagi naqd</span><span>${fmt(f.expectedCash)}</span></div>
      <div class="field" style="margin-top:10px;"><label>Amalda sanalgan naqd</label><input type="number" id="cs_actual" placeholder="Sanab, kiriting" oninput="updateCloseShiftDiff(${f.expectedCash})"></div>
      <div id="cs_diffBox"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">Bekor qilish</button>
      <button class="btn btn-primary" onclick="openCloseShiftConfirm(${f.expectedCash})">${icon('arrow-right')} Davom etish</button></div>
  `);
}
function updateCloseShiftDiff(expected){
  const el = document.getElementById('cs_actual');
  const box = document.getElementById('cs_diffBox');
  if(!el || !box) return;
  const actual = Number(el.value);
  if(isNaN(actual) || el.value===''){ box.innerHTML=''; return; }
  const diff = actual-expected;
  if(diff===0) box.innerHTML = `<div class="alert alert-ok">${icon('check-circle2')}<span>To'g'ri: farq yo'q</span></div>`;
  else if(diff<0) box.innerHTML = `<div class="alert alert-danger">${icon('alert-triangle')}<span>Kamomad: ${fmt(Math.abs(diff))}</span></div>`;
  else box.innerHTML = `<div class="alert alert-warning">${icon('plus-circle')}<span>Ortiqcha: ${fmt(diff)}</span></div>`;
}
function openCloseShiftConfirm(expected){
  const actualEl = document.getElementById('cs_actual');
  const actual = Number(actualEl ? actualEl.value : NaN);
  if(!actualEl || actualEl.value==='' || isNaN(actual)){ toast("Amaldagi naqd summasini kiriting",true); return; }
  const shift = DB.currentShift;
  if(!shift) return;
  const f = computeShiftFigures(shift);
  const diff = actual-expected;
  openModal(`
    <div class="modal-head"><h3>Smenani yopishni tasdiqlaysizmi?</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="ct-row"><span>Smena №</span><span class="cell-strong">#${shift.number}</span></div>
      <div class="ct-row"><span>Jami savdo</span><span>${fmt(f.jamiSavdo)}</span></div>
      <div class="ct-row"><span>Jami qaytarish</span><span>${fmt(f.qaytarishJami)}</span></div>
      <div class="ct-row"><span>Sof savdo</span><span>${fmt(f.sofSavdo)}</span></div>
      <div class="ct-row"><span>Tizimdagi naqd</span><span>${fmt(expected)}</span></div>
      <div class="ct-row"><span>Amaldagi naqd</span><span>${fmt(actual)}</span></div>
      <div class="ct-row total"><span>Farq</span><span style="color:${diff===0?'inherit':(diff<0?'var(--danger)':'var(--warning)')}">${diff===0?'0':(diff<0?'−':'+')+fmt(Math.abs(diff))}</span></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="openCloseShiftModal()">Orqaga</button>
      <button class="btn btn-primary" onclick="finalizeCloseShift(${actual})">${icon('check-circle2')} Tasdiqlash</button></div>
  `);
}
function finalizeCloseShift(actual){
  const shift = DB.currentShift;
  if(!shift) return;
  const f = computeShiftFigures(shift);
  const closedByName = shiftCashierName();
  const snapshot = {
    id:shift.id, number:shift.number, openedAt:shift.openedAt, closedAt:new Date().toISOString(),
    openedBy:shift.openedBy, closedBy:closedByName, openingCash:shift.openingCash||0,
    naqdSavdo:f.naqdSavdo, kartaSavdo:f.kartaSavdo, tezTolovSavdo:f.tezTolovSavdo, qarzSavdo:f.qarzSavdo,
    jamiSavdo:f.jamiSavdo, naqdQaytarilgan:f.naqdQaytarilgan, kartaQaytarilgan:f.kartaQaytarilgan, tezTolovQaytarilgan:f.tezTolovQaytarilgan,
    qaytarishJami:f.qaytarishJami, sofSavdo:f.sofSavdo, operatsiyalarSoni:f.operatsiyalarSoni,
    kirimJami:f.kirimJami, chiqimJami:f.chiqimJami, inkassatsiyaJami:f.inkassatsiyaJami,
    cashIncomes:shift.cashIncomes||[], cashExpenses:shift.cashExpenses||[], collections:shift.collections||[],
    expectedCash:f.expectedCash, actualCash:actual, diff:actual-f.expectedCash,
    saleIds:f.sales.map(s=>s.id), returnIds:f.returns.map(r=>r.id),
    status:'yopilgan'
  };
  if(!DB.closedShifts) DB.closedShifts = [];
  DB.closedShifts.unshift(snapshot);
  DB.currentShift = null;
  logActivity(`Smena #${snapshot.number} yopildi — farq ${fmt(snapshot.diff)}`);
  save(); closeModal(); toast("Smena yopildi"); nav('cash');
}

/* Bitta savdo satri (saleId+itemIndex) bo'yicha ilgari TASDIQLANGAN
   qaytarilgan miqdor — ortiqcha qaytarishning oldini oladi. Eski
   (itemIndex'siz) yozuvlar productId bo'yicha moslashtiriladi. */
function returnedQtyFor(saleId, itemIndex, productId){
  return roundQty((DB.returns||[]).filter(r=>r.status==='tasdiqlangan' && r.saleId===saleId &&
    (r.itemIndex!=null ? r.itemIndex===itemIndex : r.productId===productId))
    .reduce((a,r)=>a+r.qty,0));
}
function saleItemReturnable(s, idx){
  const it = s.items[idx];
  if(!it) return 0;
  return Math.max(0, roundQty(it.qty - returnedQtyFor(s.id, idx, it.productId)));
}
/* Chekning to'lov turidan kelib chiqib qaytarish usulini "qulflaydi" —
   Naqd/Karta sotuvlarda oddiy foydalanuvchi faqat shu usulda qaytara oladi,
   boshqacha tanlash FAQAT ADMIN uchun ochiq (11-band). Aralash/qarz kabi
   noaniq holatlarda usul erkin (admin) yoki standart 'naqd' (boshqalar). */
function returnMethodLock(s){
  return (s.paymentType==='naqd' || s.paymentType==='karta' || s.paymentType==='tezTolov') ? s.paymentType : null;
}
/* To'lov/qaytarish usuli — barcha joyda bir xil belgi (Naqd/Karta/Tez to'lov/Qarz/Aralash) */
function methodLabel(m){
  return m==='karta' ? 'Karta' : (m==='tezTolov' ? "Tez to'lov" : (m==='qarz' ? 'Qarz/Nasiya' : (m==='aralash' ? 'Aralash' : 'Naqd')));
}

          </label>
          <div id="rtd_${i}" style="display:${checked?'flex':'none'};gap:8px;margin-top:8px;flex-wrap:wrap;">
            <div class="field" style="flex:1;min-width:110px;margin:0;"><label>Qaytarish miqdori</label><input type="number" id="rtq_${i}" value="${max>0?Math.min(1,max):0}" step="0.01" min="0.01" max="${max}"></div>

function saveReturnMulti(){
  if(!(currentRole==='admin' || DB.roleRights[currentRole].returns)){ toast("Sizda qaytarish huquqi yo'q",true); return; }
  const saleSel = document.getElementById('rt_sale');
  const saleId = saleSel ? saleSel.value : '';
  if(!saleId){ toast("Chekni tanlang",true); return; }
  const s = DB.sales.find(x=>x.id===saleId);
  if(!s || s.status==='bekor qilingan'){ toast("Bu chek bekor qilingan yoki topilmadi",true); return; }
  const methodEl = document.getElementById('rt_method');
  const reasonEl = document.getElementById('rt_reason');
  if(!methodEl || !reasonEl){ toast("Mahsulot tanlanmadi",true); return; }
  const method = methodEl.value;
  const lock = returnMethodLock(s);
  if(lock && method!==lock && currentRole!=='admin'){ toast("To'lov usulini faqat admin o'zgartira oladi",true); return; }
  const reason = reasonEl.value;
  /* 1-BOSQICH: TEKSHIRUV — hech narsa o'zgartirilmasdan barcha qatorlar
     tekshiriladi, shunda operatsiya ATOMIK bo'ladi (yarim bajarilgan
     qaytarish hech qachon hosil bo'lmaydi). */
  const lines = [];
  for(let i=0;i<s.items.length;i++){
    const cb = document.getElementById('rtc_'+i);
    if(!cb || !cb.checked) continue;
    const it = s.items[i];
    const max = saleItemReturnable(s,i);
    const qtyInput = document.getElementById('rtq_'+i);
    const condSel = document.getElementById('rtcond_'+i);
    const qty = roundQty(Number(qtyInput?qtyInput.value:0)||0);
    const condition = condSel ? condSel.value : 'yaxshi';
    if(qty<=0 || qty>max){ toast(`"${it.name}" uchun miqdor noto'g'ri (maksimal ${fmtQty(max)})`,true); return; }
    const p = DB.products.find(x=>x.id===it.productId);
    if(!p){ toast(`"${it.name}" mahsuloti bazada topilmadi`,true); return; }
    lines.push({idx:i, it, p, qty, condition});
  }
  if(!lines.length){ toast("Kamida bitta mahsulotni belgilang",true); return; }
  /* 2-BOSQICH: BAJARISH — tekshiruvdan o'tgan barcha qatorlar ketma-ket
     qo'llaniladi: savdo → qaytarish → kassa → ombor/BRAK → hisobot →
     qaytarishlar tarixi — barchasi shu yerda sinxron yangilanadi. */
  const groupId = uid('rg');
  const who = document.getElementById('roleSelect').selectedOptions[0].textContent.split('—')[1].trim();
  const now = new Date().toISOString();
  lines.forEach(({idx,it,p,qty,condition})=>{
    let batchId = null;
    if(condition==='yaxshi'){
      if(!p.batches) p.batches = [];
      batchId = uid('lot');
      p.batches.push({id:batchId, lot:generateLotCode(), qty, cost:it.cost||p.cost||0, price:it.price||p.price||0, expiry:null, supplier:'', note:"Mijozdan qaytarilgan (yaroqli)", date:todayISO(), createdAt:Date.now(), warehouseId:defaultWarehouseId()});
      p.qty = roundQty(p.qty+qty);
      DB.stockMoves.unshift({dir:'in', productId:p.id, productName:p.name, size:p.size||'', pkgUnit:p.pkgUnit||null, qty, unit:p.unit,
        date:now, reason:'Qaytarish', supplier:'', note:`Chek #${s.checkNo} — mijozdan qaytarilgan`, warehouseId:defaultWarehouseId(), warehouseName:whName(defaultWarehouseId())});
    } else {
      p.brakQty = roundQty((p.brakQty||0)+qty);
    }
    DB.returns.push({id:uid('r'), groupId, saleId:s.id, checkNo:s.checkNo, customerId:s.customerId, itemIndex:idx,
      productId:p.id, product:it.name, sku:p.sku, barcode:p.barcode, unit:it.unit, qty, price:it.price, cost:it.cost||p.cost||0,
      amount:roundQty(it.price*qty), condition, restock:condition==='yaxshi', batchId, method, reason, status:'tasdiqlangan', who, date:now,
      shiftId: DB.currentShift ? DB.currentShift.id : null});
  });
  const totalAmt = lines.reduce((a,l)=>a+l.it.price*l.qty,0);
  logActivity(`Qaytarish (#${s.checkNo}): ${lines.map(l=>l.it.name+' x'+fmtQty(l.qty)+(l.condition==='brak'?' [BRAK]':'')).join(', ')} — ${fmt(totalAmt)} (${method==='karta'?'Karta':'Naqd'}, ${reason})`);
  save(); closeModal(); toast("Qaytarish tasdiqlandi");
  renderPage();
}
/* Qaytarishni BEKOR QILISH — faqat admin. Kassa, ombor/BRAK va hisobotlar
   avtomatik tiklanadi, chunki ular DB.returns'dagi status='tasdiqlangan'
   yozuvlardan real vaqtda hisoblanadi (alohida "qaytarib berish" kodi shart emas). */
function cancelReturn(groupId){
  if(currentRole!=='admin'){ toast("Faqat admin qaytarishni bekor qila oladi",true); return; }
  const group = (DB.returns||[]).filter(r=>r.groupId===groupId && r.status==='tasdiqlangan');
  if(!group.length){ toast("Bekor qilinadigan qaytarish topilmadi",true); return; }
  const reason = prompt("Qaytarishni bekor qilish sababini kiriting:");
  if(!reason || !reason.trim()){ toast("Sabab kiritilishi shart",true); return; }
  const who = document.getElementById('roleSelect').selectedOptions[0].textContent.split('—')[1].trim();
  const now = new Date().toISOString();
  group.forEach(r=>{
    const p = DB.products.find(x=>x.id===r.productId);
    if(p){
      if(r.condition==='yaxshi'){
        p.qty = Math.max(0, roundQty(p.qty - r.qty));
        if(r.batchId && p.batches) p.batches = p.batches.filter(b=>b.id!==r.batchId);
      } else {
        p.brakQty = Math.max(0, roundQty((p.brakQty||0) - r.qty));
      }
    }
    r.status = 'bekor qilingan';
    r.cancelledBy = who; r.cancelledAt = now; r.cancelReason = reason.trim();
  });
  logActivity(`Qaytarish bekor qilindi (#${group[0].checkNo}) — sabab: ${reason.trim()}`);
  save(); toast("Qaytarish bekor qilindi — kassa va ombor qayta tiklandi"); renderPage();
}

function toggleReturnCamera(){
  const btn = document.getElementById('rtCamBtn');
  const video = document.getElementById('rtScanVideo');
  if(scanEngineActive){ stopScanEngine(); if(btn) btn.innerHTML=icon('camera')+' Kamera'; if(video) video.style.display='none'; lucide.createIcons(); return; }
  if(!video) return;
  video.style.display='block';
  if(btn) btn.innerHTML=icon('camera-off')+" To'xtatish";
  lucide.createIcons();
  startScanEngine(video, (code)=>{
    stopScanEngine();
    video.style.display='none';
    if(btn) btn.innerHTML=icon('camera')+' Kamera';
    lucide.createIcons();
    const inp=document.getElementById('rt_code'); if(inp) inp.value=code;
    returnCodeLookup();

function returnCodeLookup(){
  const codeEl = document.getElementById('rt_code');
  const code = codeEl ? codeEl.value.trim() : '';
  const box = document.getElementById('rt_codeResults');
  if(!code || !box) return;
  const matches = [];
  activeSales().forEach(s=>{
    s.items.forEach((it,idx)=>{
      const p = DB.products.find(x=>x.id===it.productId);
      if(!p) return;
      if(p.barcode===code || p.qrCode===code || (p.sku||'').toLowerCase()===code.toLowerCase()){
        const max = saleItemReturnable(s,idx);
        if(max>0) matches.push({s, idx, it, max});
      }
    });
  });
  matches.sort((a,b)=>new Date(b.s.date)-new Date(a.s.date));
  if(!matches.length){ box.innerHTML = `<div class="empty-state">${icon('search')}<div>Qaytarish mumkin bo'lgan sotuv topilmadi</div></div>`; lucide.createIcons(); return; }
  box.innerHTML = matches.slice(0,15).map(m=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="closeModal();openReturnModal('${m.s.id}',${m.idx})">
      <div><strong>${m.it.name}</strong><div style="color:var(--text-faint);font-size:11px;">${m.s.checkNo||('#'+m.s.id.slice(-5))} · ${m.s.date.slice(0,10)} · mumkin: ${fmtQty(m.max)} ${m.it.unit||''}</div></div>
      ${icon('chevron-right')}
    </div>`).join('');
  lucide.createIcons();
}

      <div class="card"><div class="section-title">Eng ko'p sotilganlar</div><div class="table-scroll"><table><tbody>

        ${low.map(p=>`<tr><td data-label="Tovar" class="cell-strong">${p.name}</td><td data-label="Qoldiq" class="cell-mono">${fmtQty(p.qty)} ${p.unit}</td></tr>`).join('')||emptyRow(2,"Ma'lumot yo'q")}
      </tbody></table></div></div>
    </div>`;
  }
  if(reportTab==='finance'){
    const grossRevenue = activeSales().reduce((a,s)=>a+s.total,0);
    const returnedAmount = confirmedReturns().reduce((a,r)=>a+returnAmount(r),0);
    const revenue = grossRevenue - returnedAmount;
    const expense = DB.expenses.reduce((a,e)=>a+e.amount,0);
    const grossProfitRaw = activeSales().reduce((a,s)=>a+s.items.reduce((x,it)=>x+(it.price-it.cost)*it.qty,0),0);
    const returnedProfit = confirmedReturns().reduce((a,r)=>a+((r.price-(r.cost||0))*r.qty),0);
    const grossProfit = grossProfitRaw - returnedProfit;
    const netProfit = grossProfit-expense;
    return `<div class="grid grid-4">
      ${statCard('Tushum',fmt(revenue),'trending-up','var(--primary)','var(--primary-light)','Qaytarishlar chegirilgan','up')}
      ${statCard('Xarajat',fmt(expense),'receipt','var(--danger)','var(--danger-light)','Jami','down')}
      ${statCard('Yalpi foyda',fmt(grossProfit),'sprout','var(--info)','var(--info-light)','Xarajatsiz','up')}
      ${statCard('Sof foyda',fmt(netProfit),'wallet','var(--primary)','var(--primary-light)','Xarajatlardan keyin',netProfit>=0?'up':'down')}
    </div>`;
  }
  if(reportTab==='debts'){
    const total = DB.customers.reduce((a,c)=>a+c.debtTotal+c.paid,0);
    const paid = DB.customers.reduce((a,c)=>a+c.paid,0);
    const remain = DB.customers.reduce((a,c)=>a+c.debtTotal,0);
    const overdue = DB.customers.filter(c=>c.debtTotal>0&&c.dueDate&&c.dueDate<todayISO()).reduce((a,c)=>a+c.debtTotal,0);

    </div>`;
  }
  if(reportTab==='employees'){
    const map={};
    activeSales().forEach(s=>{ if(!map[s.employee]) map[s.employee]={revenue:0,count:0}; map[s.employee].revenue+=s.total; map[s.employee].count++; });
    return `<div class="card"><div class="section-title">Xodimlar bo'yicha savdo</div><div class="table-scroll"><table>

      </tbody>
    </table></div></div>`;
  }
}

      <tbody>${hist.length? hist.map(h=>{
        const diffCount = h.items.filter(it=>it.diff!==0).length;
        return `<tr onclick="invOpenHistoryDetail('${h.id}')" style="cursor:pointer;">
          <td data-label="Sana">${h.date.slice(0,10)}</td>
          <td data-label="Ombor">${h.warehouseName}</td>
          <td data-label="Tekshirildi" class="cell-mono">${h.items.length} xil</td>
          <td data-label="Farqlar">${diffCount? `<span class="badge badge-yellow">${diffCount} ta</span>` : `<span class="badge badge-green">0</span>`}</td>
          <td data-label="Farq qiymati" class="cell-mono ${h.totalDiffValue<0?'inv-diff-neg':(h.totalDiffValue>0?'inv-diff-pos':'')}">${h.totalDiffValue>0?'+':''}${fmtNum(h.totalDiffValue)}</td>
          <td data-label="Ko'rish"><button class="btn-ghost" onclick="event.stopPropagation();invOpenHistoryDetail('${h.id}')">${icon('eye')}</button></td>
        </tr>`;
      }).join('') : emptyRow(6,"Hali inventarizatsiya o'tkazilmagan")}
      </tbody>
    </table></div>
  </div>`;
}

function invStart(whId){
  if(!whId){ toast("Ombor tanlang",true); return; }
  const list = whProducts();
  if(!list.length){ toast("Sotuvda tovar yo'q — avval Tovarlar bo'limidan qo'shing",true); return; }
  invSearchQuery = '';
  invSession = {
    whId,
    items: list.map(p=>({
      productId:p.id, name:p.name, unit:p.unit, pkg:pkgLabel(p), emoji:p.emoji,
      cost:p.cost, systemQty:productQtyInWh(p, whId), counted:null
    }))
  };
  invView = 'count';
  renderPage();
}
function invCancelCount(){
  if(!confirm("Inventarizatsiya bekor qilinsinmi? Kiritilgan sanoqlar saqlanmaydi.")) return;
  invSession = null; invView = 'list'; renderPage();
}
function invCountedItems(){ return invSession.items.filter(it=>it.counted!==null && !isNaN(it.counted)); }
function invFilteredItems(){
  const q = dkNormQuery(invSearchQuery);
  if(!q) return invSession.items;
  return invSession.items.filter(it=>(it.name+' '+(it.pkg||'')).toLowerCase().includes(q));
}
function renderInventoryCount(){
  const wh = DB.warehouses.find(w=>w.id===invSession.whId);
  const items = invFilteredItems();
  const doneCount = invCountedItems().length;
  return `
  <div class="page-head">
    <div><h1>Sanash — ${wh?wh.name:''}</h1><p>${doneCount} / ${invSession.items.length} tovar sanaldi</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline compact-action-btn" onclick="invCancelCount()">${icon('x')} Bekor qilish</button>
      <button class="btn btn-primary compact-action-btn" onclick="invGoReview()">${icon('check')} Yakunlash</button>
    </div>
  </div>
  <div class="dk-search-row dk-search-modern">
    <div class="dk-search-input-wrap">
      ${icon('search','dk-search-icon')}
      <input type="text" id="invSearchInput" placeholder="Tovarni qidirish..." value="${invSearchQuery}"
        oninput="invSearchQuery=this.value;renderPage()">
    </div>
    ${isMobileDevice()? `<button class="btn btn-outline dk-scan-btn" onclick="invOpenScan()" title="Skanerlash">${icon('camera')}</button>` : ''}
  </div>
  <div class="table-card" style="margin-top:14px;">
    <div class="table-scroll"><table>
      <thead><tr><th>Mahsulot</th><th>Tizimda</th><th>Haqiqiy sanoq</th><th>Farq</th></tr></thead>
      <tbody id="invCountBody">
        ${items.length? items.map(it=>`
        <tr id="inv_row_${it.productId}">
          <td data-label="Mahsulot"><div style="display:flex;align-items:center;gap:10px;"><div class="thumb">${it.emoji}</div><span class="cell-strong">${it.name}${it.pkg?` <span style="color:var(--text-faint);font-weight:600;">(${it.pkg})</span>`:''}</span></div></td>
          <td data-label="Tizimda" class="cell-mono">${fmtQty(it.systemQty)} ${it.unit}</td>
          <td data-label="Haqiqiy sanoq"><input type="number" class="inv-count-input" id="inv_c_${it.productId}" value="${it.counted===null?'':it.counted}" min="0" step="0.01" oninput="invOnCountInput('${it.productId}',this.value)"></td>
          <td data-label="Farq" class="cell-mono ${it.counted===null?'':(it.counted-it.systemQty>0?'inv-diff-pos':(it.counted-it.systemQty<0?'inv-diff-neg':'inv-diff-zero'))}" id="inv_diff_${it.productId}">${it.counted===null?'':((roundQty(it.counted-it.systemQty)>0?'+':'')+fmtQty(roundQty(it.counted-it.systemQty)))}</td>
        </tr>`).join('') : emptyRow(4,"Tovar topilmadi")}
      </tbody>
    </table></div>
  </div>`;
}
/* Kiritilgan sanoqni to'liq sahifani qayta chizmasdan yangilaydi —
   shunda input fokusi va teri (typing) uzilmaydi. */
function invOnCountInput(pid, val){
  if(!invSession) return;
  const it = invSession.items.find(x=>x.productId===pid);
  if(!it) return;
  it.counted = val===''? null : Number(val);
  const diffEl = document.getElementById('inv_diff_'+pid);
  if(!diffEl) return;
  if(it.counted===null || isNaN(it.counted)){ diffEl.textContent=''; diffEl.className='cell-mono'; return; }
  const diff = roundQty(it.counted - it.systemQty);
  diffEl.textContent = (diff>0?'+':'') + fmtQty(diff);
  diffEl.className = 'cell-mono ' + (diff>0?'inv-diff-pos':(diff<0?'inv-diff-neg':'inv-diff-zero'));
}
/* ---------------- Sanash paytida tezkor skanerlash ----------------
   Kod o'qilganda mos qatorga o'tib, "Haqiqiy sanoq" inputiga fokus
   qo'yiladi — sotuvdagi kirim/chiqim skaner tizimidan mustaqil. */
function invOpenScan(){
  openModal(`
    <div class="modal-head"><h3>${icon('scan-line')} Tovarni skanerlash</h3><button class="btn-ghost" onclick="invCloseScan()">${icon('x')}</button></div>
    <div class="modal-body" style="text-align:center;">
      <div class="scan-frame" id="invScanFrame" style="max-width:340px;margin:0 auto 12px;">
        <video id="invScanVideo" autoplay playsinline muted></video>
        <span id="invScanPlaceholder">${icon('scan-line')}</span>
        <div class="scan-corner tl"></div><div class="scan-corner tr"></div><div class="scan-corner bl"></div><div class="scan-corner br"></div>
        <div class="scan-line"></div>
      </div>
      <p class="scan-hint">Shtrix-kodni ramka ichiga joylashtiring</p>
      <p id="invScanStatus" style="font-size:12px;color:var(--text-faint);margin-bottom:10px;">Kamera ochilmoqda...</p>
      <div id="invScanResult" style="min-height:20px;margin-bottom:10px;"></div>
      <div class="field" style="display:flex;gap:8px;text-align:left;">
        <input type="text" id="invManualCode" placeholder="QR / shtrix-kod / SKU qo'lda kiriting" onkeydown="if(event.key==='Enter')invManualLookup()">
        <button class="btn btn-outline" onclick="invManualLookup()">${icon('search')}</button>
      </div>
    </div>`);
  const video = document.getElementById('invScanVideo');
  video.style.display='block';
  document.getElementById('invScanPlaceholder').style.display='none';
  startScanEngine(video,(code)=>{ invHandleScan(code); },(err)=>{
    const st=document.getElementById('invScanStatus'); if(st) st.textContent = "Xato: "+err;
  });
  const st=document.getElementById('invScanStatus'); if(st) st.textContent = "Kamera faol — kodni ramka ichiga tuting";
}
function invCloseScan(){ stopScanEngine(); closeModal(); }
function invManualLookup(){
  const el = document.getElementById('invManualCode');
  const code = el ? el.value.trim() : '';
  if(!code) return;
  invHandleScan(code);
}
function invHandleScan(code){
  const p = dkFindProductByCode(code, whProducts());
  if(!p || !invSession.items.some(it=>it.productId===p.id)){
    const box = document.getElementById('invScanResult');
    if(box) box.innerHTML = `<div class="alert alert-danger">${icon('x-circle')}<span>Tovar ro'yxatda topilmadi</span></div>`;
    else toast("Tovar topilmadi", true);
    return;
  }
  stopScanEngine();
  closeModal();
  invSearchQuery = p.name;
  renderPage();
  setTimeout(()=>{
    const inp = document.getElementById('inv_c_'+p.id);
    if(inp){ inp.focus(); inp.select(); }
  }, 60);
}
/* ---------------- Yakunlash — faqat farqi bor tovarlarni ko'rsatib tasdiqlash ---------------- */
function invGoReview(){
  if(!invCountedItems().length){ toast("Hech bo'lmaganda bitta tovar uchun haqiqiy miqdorni kiriting",true); return; }
  invSession.diffs = invSession.items.filter(it=>it.counted!==null && !isNaN(it.counted) && roundQty(it.counted-it.systemQty)!==0);
  invView = 'review';
  renderPage();
}
function invBackToCount(){ invView = 'count'; renderPage(); }
function renderInventoryReview(){
  const wh = DB.warehouses.find(w=>w.id===invSession.whId);
  const diffs = invSession.diffs || [];
  const totalValue = diffs.reduce((a,it)=>a+roundQty(it.counted-it.systemQty)*it.cost,0);
  return `
  <div class="page-head">
    <div><h1>Tasdiqlash — ${wh?wh.name:''}</h1><p>${diffs.length} ta tovarda farq aniqlandi</p></div>
    <button class="btn btn-outline compact-action-btn" onclick="invBackToCount()">${icon('arrow-left')} Orqaga</button>
  </div>
  ${!diffs.length ? `<div class="alert alert-ok" style="margin-bottom:16px;">${icon('check-circle2')}<span>Farq yo'q — barcha qoldiqlar tizim bilan mos</span></div>` : ''}
  <div class="table-card" style="margin-bottom:16px;">
    <div class="table-scroll"><table>
      <thead><tr><th>Mahsulot</th><th>Tizimda</th><th>Sanoq</th><th>Farq</th><th>Farq qiymati</th></tr></thead>
      <tbody>${diffs.length? diffs.map(it=>{
        const diff = roundQty(it.counted-it.systemQty);
        const val = diff*it.cost;
        return `<tr class="inv-row-diff">
          <td data-label="Mahsulot" class="cell-strong">${it.name}${it.pkg?` (${it.pkg})`:''}</td>
          <td data-label="Tizimda" class="cell-mono">${fmtQty(it.systemQty)} ${it.unit}</td>
          <td data-label="Sanoq" class="cell-mono">${fmtQty(it.counted)} ${it.unit}</td>
          <td data-label="Farq" class="cell-mono ${diff>0?'inv-diff-pos':'inv-diff-neg'}">${diff>0?'+':''}${fmtQty(diff)}</td>
          <td data-label="Qiymati" class="cell-mono ${val>=0?'inv-diff-pos':'inv-diff-neg'}">${val>0?'+':''}${fmtNum(val)}</td>
        </tr>`;
      }).join('') : emptyRow(5,"Farq yo'q")}
      </tbody>
    </table></div>
  </div>
  <div class="card" style="max-width:520px;">
    <div class="section-title">Jami farq qiymati: <span class="${totalValue<0?'inv-diff-neg':(totalValue>0?'inv-diff-pos':'')}">${totalValue>0?'+':''}${fmtNum(totalValue)}</span></div>
    <div class="field"><label>Izoh (ixtiyoriy)</label><textarea id="invNote" rows="2" placeholder="Masalan: yillik inventarizatsiya"></textarea></div>
    <button class="btn btn-primary btn-block" onclick="invConfirm()">${icon('check')} Tasdiqlash va saqlash</button>
  </div>`;
}
/* ---------------- Tasdiqlash — farqlarni omborga qo'llash ----------------
   Kamomad: mavjud partiyalardan consumeFromBatches() orqali ayiriladi (xuddi
   oddiy chiqim kabi). Ortiqcha: yangi "INV-" partiyasi qo'shiladi (xuddi
   oddiy kirim kabi). Ikkala holatda ham stockMoves tarixiga yoziladi va
   butun sessiya DB.inventories ichida alohida hujjat sifatida saqlanadi. */
function invConfirm(){
  const wh = DB.warehouses.find(w=>w.id===invSession.whId);
  const diffs = invSession.diffs || [];
  const note = (document.getElementById('invNote')?.value||'').trim();
  diffs.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    if(!p) return;
    const diff = roundQty(it.counted-it.systemQty);
    if(diff===0) return;
    if(diff<0){
      consumeFromBatches(p, Math.abs(diff), invSession.whId);
      DB.stockMoves.unshift({dir:'out',productId:p.id,productName:p.name,size:p.size||'',pkgUnit:p.pkgUnit||null,qty:Math.abs(diff),unit:p.unit,date:new Date().toISOString(),
        reason:"Inventarizatsiya — kamomad", supplier:'', note, warehouseId:invSession.whId, warehouseName:whName(invSession.whId)});
    } else {
      if(!p.batches) p.batches = [];
      const lot = 'INV-'+todayISO()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
      p.batches.push({id:uid('lot'), productId:p.id, sellerId:currentSellerId(), lot, qty:diff, cost:p.cost, price:p.price, expiry:null, supplier:'', note:'Inventarizatsiya — ortiqcha', date:todayISO(), createdAt:Date.now(), warehouseId:invSession.whId});
      p.qty = roundQty(p.qty + diff);
      DB.stockMoves.unshift({dir:'in',productId:p.id,productName:p.name,size:p.size||'',pkgUnit:p.pkgUnit||null,qty:diff,unit:p.unit,date:new Date().toISOString(),
        reason:"Inventarizatsiya — ortiqcha", supplier:'', note, lot, cost:p.cost, price:p.price, warehouseId:invSession.whId, warehouseName:whName(invSession.whId)});
    }
  });
  const totalDiffValue = diffs.reduce((a,it)=>a+roundQty(it.counted-it.systemQty)*it.cost,0);
  DB.inventories.unshift({
    id:uid('inv'), date:new Date().toISOString(), warehouseId:invSession.whId, warehouseName: wh?wh.name:'',
    items: invSession.items.filter(it=>it.counted!==null && !isNaN(it.counted)).map(it=>({
      productId:it.productId, name:it.name, unit:it.unit, systemQty:it.systemQty, countedQty:it.counted, diff:roundQty(it.counted-it.systemQty), cost:it.cost
    })),
    totalDiffValue, user: (DB.employees.find(e=>e.role===currentRole)||{}).name || currentRole, note, createdAt:Date.now()
  });
  logActivity(`Inventarizatsiya o'tkazildi — ${wh?wh.name:''} (${diffs.length} ta farq, qiymati ${fmtNum(totalDiffValue)})`);
  save();
  invSession = null; invView = 'list';
  toast("Inventarizatsiya yakunlandi va saqlandi");
  renderPage();
}
/* ---------------- Tarix — batafsil ko'rish va chop etish ---------------- */
function invOpenHistoryDetail(id){
  const h = (DB.inventories||[]).find(x=>x.id===id);
  if(!h) return;
  const diffItems = h.items.filter(it=>it.diff!==0);
  openModal(`
    <div class="modal-head"><h3>${icon('clipboard-check')} Inventarizatsiya — ${h.warehouseName}</h3><button class="btn-ghost" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div id="invPrintBody">
        <div style="font-size:12.5px;color:var(--text-soft);margin-bottom:10px;">
          <div><strong>Sana:</strong> ${new Date(h.date).toLocaleString('uz-UZ')}</div>
          <div><strong>Ombor:</strong> ${h.warehouseName}</div>
          <div><strong>Kim o'tkazdi:</strong> ${h.user||'—'}</div>
          ${h.note? `<div><strong>Izoh:</strong> ${h.note}</div>` : ''}
        </div>
        <div class="table-scroll"><table>
          <thead><tr><th>Mahsulot</th><th>Tizimda</th><th>Sanoq</th><th>Farq</th><th>Qiymati</th></tr></thead>
          <tbody>${diffItems.length? diffItems.map(it=>`<tr>
            <td data-label="Mahsulot" class="cell-strong">${it.name}</td>
            <td data-label="Tizimda" class="cell-mono">${fmtQty(it.systemQty)} ${it.unit}</td>
            <td data-label="Sanoq" class="cell-mono">${fmtQty(it.countedQty)} ${it.unit}</td>
            <td data-label="Farq" class="cell-mono ${it.diff>0?'inv-diff-pos':'inv-diff-neg'}">${it.diff>0?'+':''}${fmtQty(it.diff)}</td>
            <td data-label="Qiymati" class="cell-mono">${fmtNum(it.diff*it.cost)}</td>
          </tr>`).join('') : emptyRow(5,"Farq bo'lmagan")}
          </tbody>
        </table></div>
        <div style="margin-top:10px;font-weight:800;">Jami farq qiymati: ${fmtNum(h.totalDiffValue)}</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="invPrintHistory('${h.id}')">${icon('printer')} Chop etish</button>
      <button class="btn btn-primary btn-block" onclick="closeModal()">Yopish</button>
    </div>`);
}
function invPrintHistory(id){
  const html = document.getElementById('invPrintBody').innerHTML;
  const w = window.open('','_blank');
  w.document.write('<html><head><title>Inventarizatsiya</title></head><body style="font-family:Arial,sans-serif;padding:20px;">'+html+'</body></html>');
  w.document.close();
  w.focus();
  w.print();
}

/* ================================================================
   GLOBAL SEARCH
   ================================================================ */
document.getElementById('globalSearch').addEventListener('input',function(){
  const q = this.value.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.style.display='none'; return; }
  const prodRes = DB.products.filter(p=>(p.name+p.sku+p.barcode+p.qrCode+p.category+p.brand).toLowerCase().includes(q)).slice(0,4);
  const custRes = DB.customers.filter(c=>(c.name+c.phone).toLowerCase().includes(q)).slice(0,4);
  if(!prodRes.length && !custRes.length){ box.innerHTML = `<div class="sr-item" style="color:var(--text-faint);">Hech narsa topilmadi</div>`; box.style.display='block'; return; }
  box.innerHTML = [
    prodRes.length? `<div class="sr-item" style="background:var(--surface-2);font-weight:800;font-size:11px;color:var(--text-faint);">TOVARLAR</div>`:'',
    ...prodRes.map(p=>`<div class="sr-item" onclick="nav('products');document.getElementById('globalSearch').value='';document.getElementById('searchResults').style.display='none'"><div class="sr-title">${p.emoji} ${p.name}</div><div class="sr-sub">${p.sku} · ${fmtNum(p.price)} so'm / ${p.unit}</div></div>`),
    custRes.length? `<div class="sr-item" style="background:var(--surface-2);font-weight:800;font-size:11px;color:var(--text-faint);">MIJOZLAR</div>`:'',
    ...custRes.map(c=>`<div class="sr-item" onclick="nav('customers');openCustomerProfile('${c.id}');document.getElementById('globalSearch').value='';document.getElementById('searchResults').style.display='none'"><div class="sr-title">${c.name}</div><div class="sr-sub">${c.phone} · qarz ${fmtNum(c.debtTotal)}</div></div>`)
  ].join('');
  box.style.display='block';
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#globalSearch') && !e.target.closest('#searchResults')) document.getElementById('searchResults').style.display='none';
  if(!e.target.closest('#notifBtn') && !e.target.closest('#notifPanel')) document.getElementById('notifPanel').style.display='none';
});

/* ================================================================
   NOTIFICATIONS
   ================================================================ */
function buildNotifications(){
  const list = [];
  DB.products.filter(p=>p.qty===0).forEach(p=>list.push({type:'danger',text:`${p.name} tugadi`}));
  DB.products.filter(p=>p.qty>0&&p.qty<=p.minQty).forEach(p=>list.push({type:'danger',text:`${p.name} kam qoldi — ${fmtQty(p.qty)} ${p.unit}`}));
  DB.customers.filter(c=>c.debtTotal>0&&c.dueDate&&c.dueDate<todayISO()).forEach(c=>list.push({type:'danger',text:`${c.name} qarz muddati o'tgan`}));
  DB.customers.filter(c=>c.debtTotal>0&&c.dueDate&&c.dueDate>=todayISO()&&daysBetween(todayISO(),c.dueDate)<=2).forEach(c=>list.push({type:'warning',text:`${c.name} qarzi tez orada to'lanishi kerak`}));
  DB.deliveries.filter(d=>d.status!=='Yetkazildi').forEach(d=>list.push({type:'warning',text:`Yetkazib berish jarayonda — #${d.saleId.slice(-5)}`}));
  if(DB.sales.length) list.push({type:'ok',text:'Oxirgi savdo muvaffaqiyatli yakunlandi'});
  return list;
}
document.getElementById('notifBtn').addEventListener('click',()=>{
  const panel = document.getElementById('notifPanel');
  const list = buildNotifications();
  panel.innerHTML = `<div class="np-head">Bildirishnomalar (${list.length})</div>` +
    (list.length? list.map(n=>`<div class="np-item"><div class="np-dot" style="background:${n.type==='danger'?'var(--danger)':(n.type==='warning'?'var(--warning)':'var(--primary)')}"></div><span>${n.text}</span></div>`).join('')
    : `<div class="np-item">Bildirishnoma yo'q</div>`);
  panel.style.display = panel.style.display==='block'?'none':'block';
});

/* ================================================================
   ROUTER
   ================================================================ */
const RENDERERS = {
  dashboard:renderDashboard, sales:renderSales, scanner:renderScanner, products:renderProducts,
  tovarlar:renderTovarlar,
  warehouse:renderWarehouse, inventory:renderInventory, customers:renderCustomers, debts:renderDebts, delivery:renderDeliveries,
  employees:renderEmployees, cash:renderCash, shiftHistory:renderShiftHistory, expenses:renderExpenses, returns:renderReturns,
  reports:renderReports, settings:renderSettings,
};
function renderPage(){
  document.getElementById('content').innerHTML = `<div class="page active">${RENDERERS[currentPage]()}</div>`;
  lucide.createIcons();
  if(currentPage==='dashboard') drawDashboardCharts();
  if(currentPage==='sales' && DB.currentShift){ renderPosGrid(); renderPayTypes(); renderCart(); }
  document.getElementById('notifDot').style.display = buildNotifications().length? 'block':'none';
}

/* ---------------------------- BOOT ---------------------------- */
document.getElementById('burgerBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

load();
renderMenu();
renderPage();
lucide.createIcons();

</script>
