<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DO'KON.UZ — Oziq-ovqat mahsulotlari boshqaruv tizimi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DO'KON.UZ — style.css (1-bosqichda shu yerda, keyin ajratiladi)
   ============================================================ */
:root{
  --primary:#0F8B4C;
  --primary-dark:#0B6B3A;
  --primary-light:#E6F5EC;
  --danger:#D6432F;
  --danger-light:#FBEAE7;
  --warning:#C7861B;
  --warning-light:#FDF2E0;
  --info:#2563A6;
  --info-light:#E8F0F9;
  --bg:#F3F5F4;
  --surface:#FFFFFF;
  --surface-2:#F8F9F8;
  --border:#E1E5E2;
  --text:#1B211D;
  --text-soft:#5B655E;
  --text-faint:#8B958E;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --shadow:0 1px 2px rgba(20,30,24,.06), 0 1px 1px rgba(20,30,24,.04);
  --shadow-lift:0 8px 24px rgba(20,30,24,.12);
  --font:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:none;}
svg.icon{width:18px;height:18px;stroke-width:2;flex-shrink:0;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D3D8D4;border-radius:8px;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:248px;flex-shrink:0;background:#12241A;color:#DCE7DF;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
  z-index:40;transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
.brand .name{font-weight:800;font-size:16px;letter-spacing:.2px;color:#fff;}
.brand .sub{font-size:11px;color:#8EA598;}
nav.menu{flex:1;overflow-y:auto;padding:12px 10px;}
.menu-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-s);
  color:#B9C9BF;font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:2px;transition:.15s;
  position:relative;
}
.menu-item svg{width:17px;height:17px;opacity:.85;}
.menu-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.menu-item.active{background:var(--primary);color:#fff;}
.menu-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}
.menu-hidden{display:none !important;}
.sidebar-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7D9587;}

/* Main */
#main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
header.topbar{
  height:64px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30;
}
.burger{display:none;}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-m);padding:8px 12px;
}
.search-box input{flex:1;background:transparent;border:none;outline:none;}
.search-box svg{width:16px;height:16px;color:var(--text-faint);}
#searchResults{
  position:absolute;top:56px;left:22px;width:420px;max-height:360px;overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-lift);display:none;z-index:50;
}
#searchResults .sr-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
#searchResults .sr-item:hover{background:var(--surface-2);}
#searchResults .sr-title{font-weight:700;font-size:13px;}
#searchResults .sr-sub{font-size:11.5px;color:var(--text-soft);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.role-switch{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius-m);}
.role-switch select{background:transparent;border:none;outline:none;font-weight:700;font-size:12.5px;}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);}
.icon-btn:hover{background:var(--border);}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
#notifPanel{position:absolute;top:56px;right:22px;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-lift);display:none;z-index:50;overflow:hidden;}
#notifPanel .np-head{padding:12px 14px;font-weight:800;border-bottom:1px solid var(--border);font-size:13px;}
#notifPanel .np-item{padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;gap:9px;align-items:flex-start;}
#notifPanel .np-item:last-child{border-bottom:none;}
.np-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}

main.content{padding:22px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:21px;font-weight:800;}
.page-head p{font-size:12.5px;color:var(--text-soft);margin-top:2px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-s);font-weight:700;font-size:13px;transition:.15s;white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#B93524;}
.btn-ghost{background:transparent;color:var(--text-soft);padding:6px 8px;}
.btn-ghost:hover{color:var(--text);background:var(--surface-2);border-radius:var(--radius-s);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Cards / Grid */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;}
.stat-card{display:flex;flex-direction:column;gap:8px;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.stat-label{font-size:12px;color:var(--text-soft);font-weight:600;}
.stat-value{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-.3px;}
.stat-delta{font-size:11.5px;font-weight:700;}
.up{color:var(--primary);}
.down{color:var(--danger);}

/* Dashboard stat kartochkalari — faqat Dashboard uchun scoped, .grid-4/.grid-3/.grid-2'ga tegmaydi */
.dashboard-stats{grid-template-columns:repeat(4,1fr);}
.stat-card{padding:14px;gap:6px;min-width:0;transition:.15s;}
.stat-card[onclick]:hover{border-color:var(--primary);box-shadow:var(--shadow);}
.stat-top{min-width:0;}
.stat-icon{width:32px;height:32px;border-radius:9px;flex-shrink:0;}
.stat-icon svg.icon{width:16px;height:16px;}
.stat-label{font-size:11px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-value{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-delta{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:1180px){
  .dashboard-stats{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:640px){
  .dashboard-stats{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card{padding:11px;gap:4px;}
  .stat-icon{width:28px;height:28px;border-radius:8px;}
  .stat-icon svg.icon{width:14px;height:14px;}
  .stat-value{font-size:15.5px;}
  .stat-label{font-size:9.5px;}
  .stat-delta{font-size:9px;}
}
@media(max-width:380px){
  .dashboard-stats{gap:8px;}
  .stat-card{padding:9px;}
}

/* ---------- Dashboard hero KPI band (Square/Shopify/Loyverse style:
   one prominent "today" number + compact secondary KPIs in one strip,
   instead of many equal-weight colored cards) ---------- */
.dash-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:22px 26px;display:flex;align-items:stretch;gap:30px;flex-wrap:wrap;}
.dash-hero-main{display:flex;flex-direction:column;justify-content:center;min-width:170px;}
.dash-hero-label{font-size:12.5px;font-weight:700;color:var(--text-soft);margin-bottom:8px;}
.dash-hero-value{font-size:36px;font-weight:800;font-family:var(--mono);letter-spacing:-.5px;color:var(--text);line-height:1;}
.dash-hero-trend{font-size:12px;font-weight:700;margin-top:10px;display:inline-flex;align-items:center;gap:4px;width:fit-content;padding:4px 10px;border-radius:20px;}
.dash-hero-trend.up{background:var(--primary-light);color:var(--primary-dark);}
.dash-hero-trend.down{background:var(--danger-light);color:#8E2C1F;}
.dash-hero-secondary{display:flex;flex:1;min-width:260px;}
.dash-hero-mini{flex:1;padding:0 22px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:6px;}
.dash-hero-mini:first-child{border-left:none;padding-left:0;}
.dash-hero-mini-label{font-size:11px;font-weight:700;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dash-hero-mini-value{font-size:19px;font-weight:800;font-family:var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:900px){
  .dash-hero{padding:18px;gap:16px;}
  .dash-hero-secondary{flex-wrap:wrap;row-gap:14px;}
  .dash-hero-mini{flex:1 1 45%;min-width:45%;border-left:none;border-top:1px solid var(--border);padding:12px 0 0;}
  .dash-hero-mini:first-child{border-top:none;padding-top:0;}
}
@media(max-width:480px){
  .dash-hero-value{font-size:27px;}
}

.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.chart-wrap{position:relative;height:230px;}

.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-m);font-size:12.5px;font-weight:600;margin-bottom:8px;}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.alert-danger{background:var(--danger-light);color:#8E2C1F;}
.alert-warning{background:var(--warning-light);color:#8A5F10;}
.alert-info{background:var(--info-light);color:#1D4E82;}
.alert-ok{background:var(--primary-light);color:var(--primary-dark);}

/* Tables */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);overflow:hidden;}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.table-toolbar input[type=text],.table-toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface-2);min-width:140px;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:640px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.cell-strong{font-weight:700;}
.cell-mono{font-family:var(--mono);font-size:12.5px;}
.row-actions{display:flex;gap:6px;}
.thumb{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--text-soft);border:1px solid var(--border);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--primary-light);color:var(--primary-dark);}
.badge-red{background:var(--danger-light);color:#8E2C1F;}
.badge-yellow{background:var(--warning-light);color:#8A5F10;}
.badge-gray{background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,17,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-l);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lift);}
.modal.modal-lg{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-head h3{font-size:16px;font-weight:800;}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,139,76,.12);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Toast */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:var(--radius-m);font-size:13px;font-weight:600;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:9px;animation:toastin .2s ease;}
.toast svg{width:16px;height:16px;}
.toast.err{background:var(--danger);}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* POS */
.pos-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
.pos-search{display:flex;gap:10px;margin-bottom:14px;}
.pos-search .search-box{max-width:none;}
.cat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cat-chip{padding:7px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text-soft);}
.cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pos-products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.pos-pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px;cursor:pointer;transition:.15s;}
.pos-pcard:hover{border-color:var(--primary);box-shadow:var(--shadow);}
.pos-pcard .thumb{width:100%;height:64px;border-radius:8px;font-size:22px;margin-bottom:8px;}
.pos-pcard .pname{font-weight:700;font-size:12.5px;line-height:1.3;margin-bottom:4px;min-height:32px;}
.pos-pcard .pprice{font-family:var(--mono);font-weight:800;color:var(--primary-dark);font-size:13px;}
.pos-pcard .pstock{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
.cart-card{position:sticky;top:80px;}
.cart-items{max-height:280px;overflow-y:auto;margin-bottom:12px;}
.cart-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
.cart-item .ci-name{font-weight:700;font-size:12.5px;flex:1;}
.cart-item .ci-price{font-size:11px;color:var(--text-soft);font-family:var(--mono);}
.qty-box{display:flex;align-items:center;gap:6px;}
.qty-box button{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:var(--surface-2);font-weight:800;}
.qty-box span{min-width:18px;text-align:center;font-weight:700;font-size:12.5px;}
.cart-empty{text-align:center;color:var(--text-faint);padding:30px 0;font-size:12.5px;}
.cart-totals{border-top:1px dashed var(--border);padding-top:10px;margin-top:6px;}
.ct-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;color:var(--text-soft);}
.ct-row.total{font-size:17px;font-weight:800;color:var(--text);margin-top:8px;}
/* Smena hisoboti — bitta ustunli jadval (Tip / Summa), skrolni kamaytirish uchun */
.report-table{width:100%;border-collapse:collapse;margin-bottom:2px;}
.report-table th{text-align:left;font-size:10.5px;font-weight:800;color:var(--text-faint);text-transform:uppercase;letter-spacing:.3px;padding:6px 2px;border-bottom:1px solid var(--border);}
.report-table th:last-child{text-align:right;}
.report-table td{padding:9px 2px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text);}
.report-table td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap;}
.report-table tr:last-child td{border-bottom:none;}
.report-table tr.report-total td{font-weight:800;border-top:2px solid var(--border);border-bottom:none;padding-top:10px;}
.report-table tr.report-neg td:last-child{color:var(--danger);}
.pay-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.pay-type{padding:10px 6px;border:1.5px solid var(--border);border-radius:var(--radius-m);text-align:center;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.pay-type svg{width:18px;height:18px;}
.pay-type.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}
.discount-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--primary);border-radius:8px;background:var(--primary-light);color:var(--primary-dark);font-weight:800;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap;}
.discount-btn svg{width:14px;height:14px;}
.discount-btn:hover{background:var(--primary);color:#fff;}
.discount-btn:active{transform:scale(.97);}
.discount-btn.has-value{border-color:var(--primary-dark);}

/* QR scanner */
.scan-box{max-width:420px;margin:0 auto;text-align:center;}
.scan-frame{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#12241A,#1E3A29);border-radius:var(--radius-l);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:16px;overflow:hidden;}
.scan-frame svg{width:44%;height:44%;color:rgba(255,255,255,.35);}
/* Skanerlash hududi — kamera tasvirining markazidagi "oyna". Bu faqat vizual
   yo'l-yo'riq: haqiqiy barcode detection ButUN kadr bo'yicha ishlaydi (hech
   qanday crop qilinmaydi), shuning uchun ramka tashqarisidagi kod ham
   aniqlanaveradi — foydalanuvchiga faqat markazga mo'ljal ko'rsatiladi. */
.scan-frame::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:82%;height:60%;border-radius:16px;
  box-shadow:0 0 0 2000px rgba(6,14,10,.55);
  pointer-events:none;z-index:2;
}
.scan-corner{position:absolute;width:30px;height:30px;border:3.5px solid var(--primary);z-index:3;border-radius:4px;}
.scan-corner.tl{top:20%;left:9%;border-right:none;border-bottom:none;border-top-left-radius:12px;}
.scan-corner.tr{top:20%;right:9%;border-left:none;border-bottom:none;border-top-right-radius:12px;}
.scan-corner.bl{bottom:20%;left:9%;border-right:none;border-top:none;border-bottom-left-radius:12px;}
.scan-corner.br{bottom:20%;right:9%;border-left:none;border-top:none;border-bottom-right-radius:12px;}
.scan-line{position:absolute;left:11%;right:11%;height:2px;background:var(--primary);box-shadow:0 0 8px var(--primary);animation:scanmove 2.2s ease-in-out infinite;z-index:3;}
@keyframes scanmove{0%{top:22%}50%{top:78%}100%{top:22%}}
.scan-hint{font-size:11.5px;color:var(--text-faint);margin:-6px 0 12px;}

/* Debt status */
.debt-progress{width:100%;height:6px;background:var(--border);border-radius:6px;overflow:hidden;}
.debt-progress span{display:block;height:100%;background:var(--primary);}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:10px 16px;font-weight:700;font-size:13px;color:var(--text-soft);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--primary-dark);border-color:var(--primary);}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-faint);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}

/* Role perm table */
.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.perm-col{border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.perm-col h4{font-size:13px;font-weight:800;margin-bottom:10px;}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--border);}
.perm-row:last-child{border-bottom:none;}
.switch{width:34px;height:20px;border-radius:20px;background:var(--border);position:relative;flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;}
.switch.on::after{left:16px;}

/* Mobile bottom nav */
#mobileNav{display:none;}

/* Responsive */
@media(max-width:1180px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .pos-wrap{grid-template-columns:1fr;}
  .pos-products{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lift);}
  #main{margin-left:0;}
  .burger{display:flex;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-s);}
  .grid-3{grid-template-columns:1fr 1fr;}
  main.content{padding:14px;padding-bottom:84px;}
  #mobileNav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);
    border-top:1px solid var(--border);z-index:35;justify-content:space-around;align-items:center;
    box-shadow:0 -4px 12px rgba(0,0,0,.06);
  }
  #mobileNav .mn-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--text-faint);flex:1;padding:6px 0;}
  #mobileNav .mn-item.active{color:var(--primary);}
  #mobileNav .mn-item svg{width:19px;height:19px;}
  #mobileNav .mn-scan{position:relative;background:var(--primary);color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px rgba(15,139,76,.4);}
  #mobileNav .mn-scan svg{width:24px;height:24px;}
  #mobileNav .mn-cart-badge{position:absolute;top:-3px;right:-4px;background:#E4483A;color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid var(--surface);}
  .search-box{display:none;}
  #searchResults{left:14px;width:calc(100% - 28px);}
  #notifPanel{right:14px;width:calc(100% - 28px);}
}
@media(max-width:640px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .pos-products{grid-template-columns:repeat(2,1fr);}
  .field-row{grid-template-columns:1fr;}
  .pay-types{grid-template-columns:1fr;}
  .perm-grid{grid-template-columns:1fr;}
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tbody tr{border:1px solid var(--border);border-radius:var(--radius-m);margin-bottom:10px;padding:6px 4px;}
  tbody td{border-bottom:none;display:flex;justify-content:space-between;gap:10px;padding:6px 10px;}
  tbody td::before{content:attr(data-label);font-weight:700;color:var(--text-faint);font-size:10.5px;text-transform:uppercase;}
}

/* ---------- Receipt (Chek) modal — mobile-safe, no horizontal scroll ---------- */
.modal-receipt{overflow-x:hidden;box-sizing:border-box;}
.modal-receipt .modal-body{overflow-x:hidden;box-sizing:border-box;}
.modal-receipt img{max-width:100%;height:auto;}
.modal-receipt table{table-layout:fixed;width:100%;min-width:0;}
.modal-receipt,.modal-receipt *{word-break:break-word;overflow-wrap:anywhere;}
/* ---------- Savdo tarixi modal — ixcham 3 ustunli, gorizontal scrollsiz ---------- */
.modal-saleshist{overflow-x:hidden;box-sizing:border-box;max-width:420px;}
.modal-saleshist .modal-body{overflow-x:hidden;box-sizing:border-box;}
.modal-saleshist table{table-layout:fixed;width:100%;min-width:0;}
.modal-saleshist th:nth-child(2),.modal-saleshist td:nth-child(2){text-align:center;}
/* ---------- Savdo: scanner orqali qo'shilgan mahsulot uchun markaziy mini-popup ----------
   Faqat vizual tasdiq — savat/cart hisob-kitoblariga va scanner logikasiga ta'sir qilmaydi.
   pointer-events:none — ekran ortidagi elementlarni bosishga xalaqit bermaydi. */
.scan-success-popup{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
  width:min(300px,82vw);min-height:250px;
  background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:20px 16px;box-sizing:border-box;z-index:9999;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease;
}
.scan-success-popup.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);}
.scan-success-img{width:140px;height:140px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:64px;border-radius:16px;background:var(--surface-2);overflow:hidden;}
.scan-success-img img{width:100%;height:100%;object-fit:contain;}
.scan-success-name{font-weight:800;font-size:15px;text-align:center;color:var(--text);line-height:1.25;}
.scan-success-price{font-size:14px;font-weight:700;color:var(--primary);}
.scan-success-badge{display:flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary);font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:999px;}
.scan-success-badge svg{width:14px;height:14px;}
@media(max-width:640px){
  .modal-receipt .modal-body{padding:14px;}
  .modal-receipt tbody td{padding:6px 8px;}
  .modal-receipt .modal-foot{flex-wrap:wrap;gap:8px;justify-content:stretch;padding:12px 14px;}
  .modal-receipt .modal-foot .btn{flex:1 1 calc(50% - 4px);min-width:0;}
}

/* ---------- Construction-store additions ---------- */
.scan-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:var(--radius-l);z-index:1;}
.scan-frame canvas{display:none;}
#scanPlaceholder{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;z-index:0;}
.qty-box input[type=number]{width:56px;text-align:center;border:1px solid var(--border);border-radius:5px;padding:3px 2px;background:var(--surface);}
.pay-types{grid-template-columns:repeat(2,1fr);}
.unit-tag{font-size:10.5px;font-weight:700;color:var(--text-faint);}
.check-line{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-soft);cursor:pointer;}

/* ---------- Sales/POS upgrade additions ---------- */
.scan-btn-lg{white-space:nowrap;font-weight:800;}
@media (max-width:900px){
  .scan-btn-lg{padding:12px 16px;font-size:14px;}
  #completeSaleBtn{position:sticky;bottom:8px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .pay-types{grid-template-columns:repeat(2,1fr);}
}

/* =====================================================================
   MOBILE — Tovarlar & Ombor compact cards
   Scoped strictly to #productsTable / #warehouseStockTable and their
   mobile-* replacement lists so no other page/table is affected.
   ===================================================================== */
.mobile-product-list,.mobile-stock-list,.mobile-stock-stats{display:none;}
.compact-action-btn{white-space:nowrap;}
.wh-stats-desktop{margin-bottom:16px;}

.mobile-product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
.mobile-product-main{display:flex;align-items:center;gap:9px;}
.mobile-product-main .thumb{width:36px;height:36px;font-size:17px;flex-shrink:0;}
.mobile-product-name{font-weight:800;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mobile-product-meta{font-size:11px;color:var(--text-faint);padding-left:45px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mobile-product-meta.mono{font-family:var(--mono);font-size:10.5px;}
.mobile-product-price-row{display:flex;justify-content:space-between;align-items:baseline;padding-left:45px;gap:8px;margin-top:1px;}
.mobile-product-price{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;}
.mobile-product-stock{font-size:11.5px;color:var(--text-soft);font-weight:700;white-space:nowrap;}
.mobile-product-bottom{display:flex;justify-content:space-between;align-items:center;padding-left:45px;margin-top:2px;}
.mobile-product-actions{display:flex;gap:1px;}
.mobile-product-actions button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;}
.mobile-product-actions svg{width:15px;height:15px;}

.mobile-stock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:8px 12px;display:flex;flex-direction:column;gap:3px;}
.mobile-stock-top{display:flex;align-items:center;gap:8px;}
.mobile-stock-top .thumb{width:28px;height:28px;font-size:14px;flex-shrink:0;}
.mobile-stock-name{font-weight:800;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mobile-stock-qty{font-weight:800;font-size:12px;font-family:var(--mono);white-space:nowrap;}
.mobile-stock-row2{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:var(--text-faint);padding-left:36px;}

.mobile-stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:9px 11px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:65px;}
.mobile-stat-box .msb-label{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.2px;}
.mobile-stat-box .msb-val{font-size:14.5px;font-weight:800;font-family:var(--mono);}

/* Detail modal (Tovar haqida) key/value rows */
.pd-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.pd-row:last-child{border-bottom:none;}
.pd-row span:first-child{color:var(--text-faint);font-weight:600;}
.pd-row span:last-child{font-weight:700;text-align:right;}

@media(max-width:640px){
  #productsTable,#warehouseStockTable,.wh-stats-desktop{display:none;}
  .mobile-product-list,.mobile-stock-list{display:flex;flex-direction:column;gap:7px;padding:8px;}
  .mobile-stock-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
  .compact-action-btn{padding:8px 11px;font-size:11.5px;}
  .compact-action-btn svg{width:14px;height:14px;}
}

/* =====================================================================
   MOBILE — Qaytarishlar (Returns) va Kassa "qaytarishlar" ro'yxati uchun
   BIR XIL ixcham qator dizayni. Faqat #returnsTable / #cashReturnsTable
   o'rnini bosuvchi ro'yxatlarga qat'iy izolyatsiya qilingan — boshqa hech
   qanday sahifaga, hisob-kitobga yoki JS logikaga ta'sir qilmaydi.
   Desktopda (>640px) bu klass ko'rinmaydi, asl <table> o'zgarishsiz qoladi.
   ===================================================================== */
.compact-op-list{display:none;}
.compact-op-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:8px 10px;display:flex;flex-direction:column;gap:4px;}
.compact-op-top{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-faint);font-weight:700;}
.compact-op-top .cop-date{white-space:nowrap;}
.compact-op-top .cop-check{font-family:var(--mono);white-space:nowrap;}
.compact-op-top .cop-usul{margin-left:auto;flex-shrink:0;}
.compact-op-top .badge{font-size:9.5px;padding:1px 7px;white-space:nowrap;}
.compact-op-mid{display:flex;align-items:flex-start;gap:8px;}
.compact-op-product{font-weight:700;font-size:12.5px;line-height:1.3;flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.compact-op-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;}
.compact-op-qty{color:var(--text-soft);font-family:var(--mono);white-space:nowrap;}
.compact-op-amount{font-weight:800;font-family:var(--mono);color:var(--danger);white-space:nowrap;}
.compact-op-cancel{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0;}
.compact-op-cancel svg{width:14px;height:14px;}
@media(max-width:640px){
  #returnsTable,#cashReturnsTable{display:none;}
  .compact-op-list{display:flex;flex-direction:column;gap:7px;}
}

/* ================================================================
   DK- (Mahsulotlar bo'limi) — izolyatsiya qilingan uslublar.
   Boshqa bo'limlarga (Savdo, Ombor va h.k.) ta'sir qilmaydi.
   ================================================================ */
.dk-search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.dk-search-row input{flex:1;min-width:180px;}
.dk-search-modern{align-items:stretch;}
.dk-search-input-wrap{position:relative;flex:1;min-width:180px;display:flex;align-items:center;}
.dk-search-input-wrap .dk-search-icon{position:absolute;left:12px;width:15px;height:15px;color:var(--text-faint,#7D9587);pointer-events:none;}
.dk-search-input-wrap input{width:100%;box-sizing:border-box;padding:10px 34px;border:1.5px solid var(--border,#E1E5E2);border-radius:14px;font-size:13px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease;}
.dk-search-input-wrap input:focus{outline:none;border-color:var(--primary,#0F8B4C);box-shadow:0 0 0 3px rgba(15,139,76,.12);}
.dk-search-clear{position:absolute;right:7px;width:22px;height:22px;border:none;background:#EEF1EF;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-faint,#7D9587);padding:0;}
.dk-search-clear svg{width:12px;height:12px;}
.dk-search-count{font-size:12px;color:var(--text-faint,#7D9587);font-weight:700;margin:0 0 8px 2px;}
.dk-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.dk-filter-row select{flex:1;min-width:150px;padding:9px 12px;border:1.5px solid var(--border,#E1E5E2);border-radius:12px;font-size:12.5px;background:#fff;color:var(--text-soft);}
.dk-chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.dk-chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--border,#E1E5E2);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-soft);white-space:nowrap;}
.dk-chip.active{background:var(--primary,#0F8B4C);border-color:var(--primary,#0F8B4C);color:#fff;}
.dk-manage-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #EEF1EF;border-radius:12px;margin-bottom:7px;}
.dk-manage-row .dk-manage-name{flex:1;font-weight:700;font-size:13px;}
.dk-manage-row .dk-manage-count{font-size:11px;color:var(--text-faint,#7D9587);}
.dk-cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(min-width:641px){
  .dk-cat-grid{grid-template-columns:repeat(6,1fr);}
}
@media(min-width:1025px){
  .dk-cat-grid{grid-template-columns:repeat(8,1fr);}
}
.dk-cat-card{background:#fff;border:1px solid #EEF1EF;border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;transition:transform .15s ease,box-shadow .15s ease;}
.dk-cat-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,36,26,.08);}
.dk-cat-add{border:2px dashed #D8E3DC;background:transparent;color:var(--text-faint,#7D9587);justify-content:center;min-height:96px;}
.dk-cat-icon{width:50px;height:50px;border-radius:14px;background:#F3F7F4;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;}
.dk-cat-icon img{width:100%;height:100%;object-fit:cover;border-radius:14px;}
.dk-cat-name{font-size:11.5px;font-weight:700;line-height:1.25;word-break:break-word;}
@media(max-width:430px){
  .dk-cat-icon{width:44px;height:44px;font-size:20px;}
  .dk-cat-name{font-size:10.5px;}
}
/* Mahsulot gridi — kategoriya gridi (.dk-cat-grid) bilan bir xil
   mobile-first responsive mantiqqa (min-width breakpointlar) asoslangan.
   Kategoriya qancha ustunga o'tsa, mahsulot ham shunga yaqin nisbatda
   ko'payadi — lekin mahsulot kartasi kategoriya kartasidan ixchamroq
   bo'lgani uchun bir oz kamroq ustunda, shunda kartalar haddan tashqari
   kichrayib ketmaydi. Kategoriya gridi bundan mustaqil va o'zgarishsiz. */
.dk-prod-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%;box-sizing:border-box;}
@media(min-width:641px){
  .dk-prod-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
}
@media(min-width:1025px){
  .dk-prod-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;}
}
@media(min-width:1441px){
  .dk-prod-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;}
}
.dk-prod-card{position:relative;background:#fff;border:1px solid #EEF1EF;border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;}
.dk-prod-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,36,26,.08);}
.dk-prod-img{position:relative;width:100%;aspect-ratio:4/3;border-radius:7px;background:#F3F7F4;display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden;box-sizing:border-box;padding:3px;}
.dk-prod-img img{width:100%;height:100%;object-fit:contain;object-position:center;}
.dk-qr-badge{position:absolute;bottom:3px;right:3px;background:rgba(255,255,255,.92);border-radius:5px;padding:2px;display:flex;align-items:center;justify-content:center;line-height:0;}
.dk-qr-badge svg{width:10px;height:10px;color:var(--primary,#0F8B4C);}
.dk-prod-name{font-size:10.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-height:2.2em;}
.dk-prod-meta{font-size:9px;color:var(--text-faint,#7D9587);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dk-prod-sale-btn{margin-top:2px;width:100%;border:none;border-radius:7px;padding:4px 2px;font-size:8.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;background:var(--primary,#0F8B4C);color:#fff;box-sizing:border-box;}
.dk-prod-sale-btn svg{width:10px;height:10px;}
.dk-prod-sale-btn.active{background:var(--primary-light,#E3F3E8);color:var(--primary-dark,#0F8B4C);cursor:default;}

<script>
/* ==================================================================================
   DO'KON.UZ — OZIQ-OVQAT MAHSULOTLARI DO'KONI
   app.js + data.js + products.js + sales.js + customers.js + debts.js +
   inventory.js + employees.js + cash.js + reports.js + qr.js + scanner.js + delivery.js
   (1-bosqichda bitta faylda)
   ================================================================================== */

/* ---------------------------- UTIL ---------------------------- */
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm";
const fmtNum = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
const fmtQty = n => { const r = Math.round((Number(n)||0)*10000)/10000; return (r % 1 === 0) ? String(r) : String(r.toFixed(4)).replace(/0+$/,'').replace(/\.$/,''); };
/* Internal quantity precision: keep 6 decimals so fractional kg/litr (esp. money-based) amounts don't lose accuracy */
const roundQty = n => Math.round((Number(n)||0)*1e6)/1e6;
const uid = p => p + '_' + Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);
function nowStr(){ const d=new Date(); return d.toLocaleDateString('uz-UZ')+' '+d.toTimeString().slice(0,5); }
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/86400000); }
function icon(name,cls){ return `<svg class="icon ${cls||''}" data-lucide="${name}"></svg>`; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function genBarcode(){
  let base12 = '487';
  for(let i=0;i<9;i++) base12 += Math.floor(Math.random()*10);
  return base12 + ean13CheckDigit(base12);
}
function genQr(sku){ return (sku||'QR')+'-'+Math.random().toString(36).slice(2,7).toUpperCase(); }
function stepFor(unit){ return ['dona','qop','komplekt','rulon','pachka'].includes(unit) ? 1 : 0.1; }
function activeSales(){ return DB.sales.filter(s=>s.status!=='bekor qilingan'); }
/* ---------------------------- QAYTARISHLAR — global yordamchilar ---------------------------- */
/* Faqat TASDIQLANGAN (bekor qilinmagan) qaytarishlar kassa/hisobot/ombor
   hisob-kitoblariga ta'sir qiladi — shu funksiya orqali BARCHA joyda bir xil filtrlanadi. */
function confirmedReturns(){ return (DB.returns||[]).filter(r=>r.status==='tasdiqlangan'); }
function returnAmount(r){ return r.amount!=null ? r.amount : r.price*r.qty; }

/* ---------------------------- QADOQLI / QADOQSIZ (packaged vs bulk) ---------------------------- */
const PACKAGED_UNITS = ['dona','qop','komplekt','rulon','pachka','banka','butilka']; // sotiladigan butun birliklar
const BULK_UNITS = ['kg','litr']; // qadoqsiz — kasr miqdorda va pul bo'yicha sotilishi mumkin bo'lgan birliklar
function isPackagedProduct(p){ return p.packaged !== false; } // default: qadoqli (eski xatti-harakat o'zgarmaydi)
function requiresWholeQty(p){ return isPackagedProduct(p) || ['dona','qop','komplekt','rulon','pachka'].includes(p.unit); }
function canSellByMoney(p){ return !isPackagedProduct(p) && BULK_UNITS.includes(p.unit); }
function qtyStepFor(p){ return requiresWholeQty(p) ? 1 : 0.01; }

/* ---------------------------- STATE ---------------------------- */
let DB = null;
let currentPage = 'dashboard';
let currentRole = 'admin';
let cart = []; // {productId, qty} — price always comes from product database, no per-line price/discount
let posSearchQuery = '';
let posCatFilter = '';   // POS: tanlangan kategoriya (kategoriya bo'yicha ko'rish, '' = kategoriyalar gridi)
let posBrandFilter = ''; // POS: tanlangan firma/brend ID (kategoriya ichida qo'shimcha filter)
let selectedPayType = 'naqd';
let cardReceiptImage = null; // base64 dataURL of card payment receipt photo (Savdo/POS)
let cartDiscount = {type:'none', value:0}; // cart-level (invoice) discount set via the CHEGIRMA modal
let discModalTempType = 'percent'; // type currently selected inside the open CHEGIRMA modal (not yet saved)
let scannerStream = null;
let scannerRAF = null;
let scannerVideoEl = null;
let scannedProduct = null;
let zxingReader = null;
let scanEngineActive = false;
/* --- Professional scanner engine uchun qo'shimcha state (BarcodeDetector + ZXing fallback) --- */
let scannerDetector = null;      // native window.BarcodeDetector instance
let scannerEngineType = null;    // 'native' | 'zxing'
let scannerCanvas = null;        // qayta ishlatiladigan asosiy frame canvas (har frame'da yaratilmaydi)
let scannerCanvasCtx = null;
let scannerRotateCanvas = null;  // ZXing fallback uchun rotation (90/180/270) yordamchi canvas
let scannerRotateCtx = null;
let scannerLoopTimer = null;     // throttled frame-loop uchun setTimeout handle
let scannerLoopToken = 0;        // har startScanEngine() chaqiruvida oshadi — eski loop o'z-o'zini to'xtatadi
let scannerLastCode = null;      // duplicate-protection: oxirgi aniqlangan kod
let scannerLastTime = 0;         // duplicate-protection: oxirgi aniqlangan vaqt
const SCAN_INTERVAL_MS = 180;    // frame'lar orasidagi taxminiy interval (100-200ms oralig'ida, CPU tejash uchun)
const DEBUG_SCANNER = false;     // true qilsangiz konsolda scanner lifecycle loglari chiqadi
let scannerNativeConsecutiveErrors = 0; // native BarcodeDetector.detect() ketma-ket xatolar hisoblagichi
const SCANNER_NATIVE_ERROR_THRESHOLD = 4; // shuncha ketma-ket xatodan keyin ZXing fallbackga avtomatik o'tamiz
function scanDebug(){ if(DEBUG_SCANNER){ try{ console.log.apply(console, ['[scanner]'].concat(Array.prototype.slice.call(arguments))); }catch(e){} } }
let wedgeBuffer = '';
let wedgeLastTime = 0;

/* ================================================================
   DESKTOP vs MOBILE SCANNER — qurilma turini aniqlash + "avtomatik
   Enter" sozlamasi (localStorage'da saqlanadi, default: YOQILGAN).
   MUHIM: bu aniqlash oyna kengligiga (responsive breakpoint) emas,
   haqiqiy qurilma turiga (user agent + touch) asoslanadi — shunda
   desktop brauzer oynasi toraytirilganda ham kamera skaner
   ishga tushmaydi, va aksincha.
   ================================================================ */
let _isMobileDeviceCache = null;
function isMobileDevice(){
  if(_isMobileDeviceCache!==null) return _isMobileDeviceCache;
  try{
    const ua = navigator.userAgent || navigator.vendor || '';
    const uaMobile = /Android|iPhone|iPad|iPod|Windows Phone|IEMobile|Opera Mini|Mobile/i.test(ua);
    let coarsePointer = false;
    try{ coarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }catch(e){}
    const hasTouch = (navigator.maxTouchPoints||0) > 0;
    _isMobileDeviceCache = uaMobile || (coarsePointer && hasTouch);
  }catch(e){ _isMobileDeviceCache = false; }
  return _isMobileDeviceCache;
}
const SCANNER_AUTO_ENTER_KEY = 'scannerAutoEnter';
function getScannerAutoEnter(){
  try{
    const v = localStorage.getItem(SCANNER_AUTO_ENTER_KEY);
    return v===null ? true : v==='true';
  }catch(e){ return true; }
}
function setScannerAutoEnter(val){
  try{ localStorage.setItem(SCANNER_AUTO_ENTER_KEY, val ? 'true' : 'false'); }catch(e){}
}
function onScannerAutoEnterToggle(checked){
  setScannerAutoEnter(!!checked);
  toast(checked ? "Skanerdan keyin avtomatik Enter yoqildi" : "Skanerdan keyin avtomatik Enter o'chirildi");
}
/* Duplicate-scan himoyasi: bitta skanerlash bir nechta yo'l bilan (avtomatik
   Enter, skanerning o'z Enter'i, fokusdagi input'ning o'z onkeydown Enter
   handler'i) qayta ishlanib ketishi mumkin. Shu funksiya orqali bir xil kod
   qisqa vaqt oralig'ida faqat BIR marta qabul qilinadi — mavjud savatga
   qo'shish logikasi o'zi o'zgarmaydi, faqat takroriy chaqiruv oldi olinadi. */
let lastWedgeSubmit = {code:null, time:0};
function wedgeShouldProcess(code){
  const now = Date.now();
  if(code && code===lastWedgeSubmit.code && (now-lastWedgeSubmit.time)<800){ return false; }
  lastWedgeSubmit = {code, time:now};
  return true;
}

/* Kategoriyalar ro'yxati + har biriga mos ikonka (Mahsulotlar bo'limidagi
   kategoriya gridida ishlatiladi). Bitta manbadan ikkalasi ham hosil qilinadi,
   shuning uchun nom va ikonka doim mos keladi. */
const CATEGORY_DEFS = [
  ['Sut mahsulotlari','🥛'],['Yogurtlar va desertlar','🍮'],['Pishloqlar','🧀'],['Tuxum','🥚'],
  ['Mavsumiy mevalar','🍉'],['Meva va rezavorlar','🍇'],['Sabzavot va ko\'katlar','🥦'],
  ['Quritilgan mevalar va yong\'oqlar','🥜'],['Go\'sht','🥩'],['Parranda','🍗'],
  ['Baliq va dengiz mahsulotlari','🐟'],['Kolbasa va sosiskalar','🌭'],['Suv','💧'],
  ['Gazli ichimliklar','🥤'],['Sharbatlar','🧃'],['Sovuq choy va qahva','🧋'],
  ['Makaron va yorma','🍝'],['Choy va qahva','☕'],['Konservalar','🥫'],
  ["Yog', souslar va ziravorlar",'🧂'],['Non','🍞'],['Non mahsulotlari va suxari','🥐'],
  ['Pechenye va pishiriqlar','🍪'],['Tez tayyorlanadigan mahsulotlar','🍜'],
  ['Shokolad va konfetlar','🍫'],['Shirinliklar va saqich','🍬'],['Muzqaymoq','🍦'],
  ['Sneklar','🍟'],['Muzlatilgan mahsulotlar','🧊'],["Sog'lom ovqatlanish",'🥗'],
  ['Bolalar uchun','🍼'],['Apteka','💊'],['Kosmetika va gigiyena','🧴'],
  ['Uy uchun mahsulotlar','🏠'],['Kir yuvish va tozalash','🧼'],['Zoovari','🐾'],
  ['Avtotovarlar','🚗'],['Kiyim','👕'],['Kantselyariya','✏️'],['Foydali mayda narsalar','🔧'],
];
const DEFAULT_CATEGORIES = CATEGORY_DEFS.map(c=>c[0]);
const DEFAULT_CATEGORY_ICONS = Object.fromEntries(CATEGORY_DEFS);
const UNITS = ['dona','kg','g','litr','ml','quti','pachka','banka','butilka','qop','metr','m²','m³','komplekt','rulon','boshqa'];
/* Qadoq og'irligi/hajmi uchun ALOHIDA birlik ro'yxati (masalan "1 dona og'irligi: 450 g").
   MUHIM: bu — mahsulotning hisob birligi (p.unit, ombordagi kirim/chiqim/sotuv shu bilan
   yuritiladi) EMAS, faqat qadoqning tavsifiy og'irlik/hajm yorlig'i (p.pkgUnit). */
const PKG_UNITS = ['g','kg','ml','litr','sm','m','m²'];
/* Bitta manbadan qadoq yorlig'ini hosil qiladi: "450 g" kabi. pkgUnit bo'lmasa
   (eski mahsulotlar) eski xatti-harakat saqlanadi — p.unit bilan ko'rsatiladi,
   shuning uchun bu funksiya to'liq orqaga moslashuvchan (backward compatible). */
function pkgLabel(p){ return p.size ? (p.size+' '+(p.pkgUnit||p.unit||'')) : ''; }
/* ---------------- Ko'p ombor (warehouse) yordamchi funksiyalari ----------------
   Har bir partiya (batch) warehouseId ga ega. p.qty HAR DOIM barcha omborlar
   yig'indisi bo'lib qoladi (Savdo/Dashboard/Mahsulot kartasi shu bilan ishlayveradi,
   hech narsa buzilmaydi) — ombor bo'yicha aniq qoldiq esa productQtyInWh() orqali olinadi. */
function defaultWarehouseId(){
  const list = DB.warehouses||[];
  const d = list.find(w=>w.isDefault);
  return d ? d.id : (list[0] ? list[0].id : 'wh_main');
}
function whName(id){ const w=(DB.warehouses||[]).find(x=>x.id===id); return w ? w.name : "Noma'lum ombor"; }
function productQtyInWh(p, whId){
  const target = whId || defaultWarehouseId();
  return roundQty((p.batches||[]).filter(b=>(b.warehouseId||defaultWarehouseId())===target).reduce((a,b)=>a+b.qty,0));
}
function warehouseTotalValue(whId){
  return whProducts().reduce((a,p)=>a+productQtyInWh(p,whId)*p.cost,0);
}
let CATEGORIES = DEFAULT_CATEGORIES.slice();

/* ---------------------------- SEED DEMO DATA ---------------------------- */
function seedData(){
  /* Demo biznes ma'lumotlari (mahsulot, savdo, xarajat, mijoz, activity)
     endi yaratilmaydi — dastur bo'sh katalog bilan ishga tushadi.
     Xodimlar (rol almashtirish uchun kerak) va standart kategoriyalar
     (ikonkalari bilan) saqlanadi. */
  const employees = [
    {id:uid('e'),name:'Aziz Normatov',phone:'+998 90 000 11 22',login:'aziz.admin',role:'admin',status:'faol'},
    {id:uid('e'),name:'Ali Sattorov',phone:'+998 91 222 44 66',login:'ali.sotuv',role:'sotuvchi',status:'faol'},
    {id:uid('e'),name:'Vali Ergashev',phone:'+998 93 333 55 77',login:'vali.ombor',role:'omborchi',status:'faol'},
  ];

  DB = {
    products: [],
    customers: [],
    employees,
    categories: DEFAULT_CATEGORIES.slice(),
    categoryIcons: Object.assign({}, DEFAULT_CATEGORY_ICONS),
    categoryImages: {},
    brands: [], // Firma/Brend entity bazasi: {id,name,status} — mahsulotga brandId orqali bog'lanadi (2-bo'lim)
    sales: [], expenses: [], returns: [], deliveries: [],
    stockMoves: [],
    sellerProducts: [], // {id, sellerId, productId, isForSale, createdAt} — kim (qaysi sotuvchi) qaysi mahsulotni SOTUVDA qilganini alohida yozadi (katalogdan mustaqil)
    warehouses: [{id:'wh_main', name:'Asosiy ombor', isDefault:true, createdAt:Date.now()}], // ko'p ombor tizimi — har bir partiya (batch) qaysi omborga tegishli ekanini warehouseId orqali biladi
    transfers: [], // {id, fromWhId, toWhId, productId, productName, qty, unit, date, note, status:'yuborildi'|'qabul_qilindi', createdAt, receivedAt}
    inventories: [], // {id, date, warehouseId, warehouseName, items:[{productId,name,unit,systemQty,countedQty,diff,cost}], totalDiffValue, user, note, createdAt}
    cash: {history:[]},
    activity: [],
    roleRights: {
      admin: {sales:true,scanner:true,products:true,tovarlar:true,warehouse:true,inventory:true,customers:true,debts:true,employees:true,cash:true,expenses:true,returns:true,delivery:true,reports:true,settings:true,editPrice:true,maxDiscountPercent:100,cancelSale:true,dashboard:true},

      omborchi: {sales:false,scanner:true,products:true,tovarlar:true,warehouse:true,inventory:true,customers:false,debts:false,employees:false,cash:false,expenses:false,returns:false,delivery:true,reports:false,settings:false,editPrice:false,maxDiscountPercent:0,cancelSale:false,dashboard:true},
    },

/* ---------------------------- MIGRATION / LOAD / SAVE ---------------------------- */
function migrateProduct(p){
  if(!p.unit) p.unit = 'dona';
  if(p.brand===undefined) p.brand = '';
  if(p.desc===undefined) p.desc = '';
  if(!p.sku) p.sku = uid('sku');
  /* EAN-13 shtrix-kod: mavjud bo'lmasa yoki checksum'i noto'g'ri bo'lsa, yangi
     VALID EAN-13 generatsiya qilinadi. Haqiqiy (checksum'i to'g'ri) EAN-13
     o'zgartirilmaydi — shu jumladan ishlab chiqaruvchining haqiqiy kodi. */
  if(!p.barcode || !isValidEAN13(p.barcode)) p.barcode = genBarcode();
  if(!p.qrCode) p.qrCode = genQr(p.sku);
  if(p.cost==null) p.cost = 0;
  if(p.price==null) p.price = 0;
  if(p.qty==null) p.qty = 0;
  if(p.minQty==null) p.minQty = 0;
  if(!p.emoji) p.emoji = '📦';
  if(p.packUnit===undefined) p.packUnit = null;
  if(p.packSize===undefined) p.packSize = null;
  if(p.packaged===undefined) p.packaged = !BULK_UNITS.includes(p.unit); // kg/litr -> qadoqsiz by default; boshqa hammasi qadoqli (eski xatti-harakat saqlanadi)
  if(p.packLabel===undefined) p.packLabel = '';
  if(p.isForSale===undefined) p.isForSale = false;
  if(p.category===undefined) p.category = '';
  if(p.size===undefined) p.size = '';
  /* Qadoq og'irligi birligi (masalan "g" — "1 dona og'irligi: 450 g").
     Eski mahsulotlarda yo'q — pkgLabel() bunday holda avtomatik p.unit'ga qaytadi,
     ya'ni hech narsa buzilmaydi. Hisob birligi (p.unit) bilan ATAYLAB aralashtirilmaydi. */
  if(p.pkgUnit===undefined) p.pkgUnit = null;
  if(p.image===undefined) p.image = null;
  /* Partiya (LOT) tizimi: qoldiq endi partiyalar yig'indisidan iborat.
     Eski (partiyasiz) mahsulotda qoldiq bo'lsa, uni bitta "meros" partiya
     sifatida ko'chiramiz — shunda hisоb-kitob buzilmaydi. */
  if(!p.batches){
    p.batches = p.qty>0
      ? [{id:uid('lot'),lot:'LEGACY',qty:p.qty,cost:p.cost,price:p.price,expiry:null,supplier:'',note:"Eski tizimdan ko'chirilgan",date:todayISO(),createdAt:Date.now()}]
      : [];
  }
  /* Ko'p ombor tizimi: eski (ombor tanlanmagan) partiyalar avtomatik ravishda
     asosiy omborga (defaultWarehouseId()) biriktiriladi — shunda mavjud
     qoldiqlar yo'qolib qolmaydi va hech narsa buzilmaydi. */
  (p.batches||[]).forEach(b=>{ if(!b.warehouseId) b.warehouseId = defaultWarehouseId(); });
  if(p.brakQty==null) p.brakQty = 0; // brak (yaroqsiz) miqdor — sotiladigan qoldiqdan ALOHIDA hisoblanadi
  /* Firma/Brend — ID orqali bog'lanadi (DB.brands). Eski mahsulotlarda faqat
     matn ko'rinishidagi p.brand bo'lgan (yoki umuman yo'q) — shu nom bo'yicha
     mos brend topiladi yoki avtomatik yaratiladi, so'ng p.brandId biriktiriladi.
     p.brand matn maydoni ATAYLAB saqlab qolinadi va har doim brend nomi bilan
     sinxron yuritiladi — chunki dastur bo'ylab ko'plab joylarda (qidiruv,
     kartochka, chek, POS va h.k.) hali ham shu matn maydonidan foydalaniladi;
     shu bilan mavjud funksiyalarni buzmasdan haqiqiy ID-relation qo'shiladi. */
  if(!DB.brands) DB.brands = [];
  if(p.brandId===undefined) p.brandId = null;
  if(!p.brandId && p.brand){
    const bname = String(p.brand).trim();
    if(bname){
      let b = DB.brands.find(x=>x.name.toLowerCase()===bname.toLowerCase());
      if(!b){ b = {id:uid('brand'), name:bname, status:'faol'}; DB.brands.push(b); }
      p.brandId = b.id;
      p.brand = b.name;
    }
  } else if(p.brandId){
    const b = DB.brands.find(x=>x.id===p.brandId);
    if(b) p.brand = b.name; else { p.brandId = null; }
  }
  return p;
}

function brandById(id){ return (DB.brands||[]).find(b=>b.id===id) || null; }
function brandName(id){ const b = brandById(id); return b ? b.name : ''; }
function brandProductCount(id){ return DB.products.filter(p=>p.brandId===id).length; }

/* Eski, alohida "Mahsulotlar" katalogi (dokon_categories_v1 / dokon_products_v1)
   endi ishlatilmaydi, lekin u yerda foydalanuvchi qo'shgan haqiqiy kategoriya
   yoki mahsulotlar bo'lishi mumkin. Shu funksiya o'sha eski ma'lumotlarni
   o'chirishdan OLDIN yagona DB.categories / DB.categoryIcons / DB.products
   bazasiga ko'chiradi (faqat 1-avlod migratsiyasi paytida bir marta chaqiriladi). */
function migrateLegacyDkStore(){
  // Turdagi 1-versiya demo namunalar (agar topilsa, qayta tiklanmaydi):
  const KNOWN_DEMO_NAMES = ['Musaffo Sut','Qatiq','Smetana','Coca-Cola','Mineral suv','Alenka shokoladi','Pechenye'];
  try{
    const rawCat = localStorage.getItem('dokon_categories_v1');
    const oldCats = rawCat ? JSON.parse(rawCat) : [];
    const catIdToName = {};
    (oldCats||[]).forEach(c=>{
      if(!c || !c.name) return;
      catIdToName[c.id] = c.name;
      if(!DB.categories.some(n=>n.toLowerCase()===c.name.toLowerCase())){
        DB.categories.push(c.name);
      }
      if(!DB.categoryIcons) DB.categoryIcons = {};
      if(DB.categoryIcons[c.name]===undefined) DB.categoryIcons[c.name] = c.icon || '📦';
      if(c.image){
        if(!DB.categoryImages) DB.categoryImages = {};
        if(!DB.categoryImages[c.name]) DB.categoryImages[c.name] = c.image;
      }
    });
    const rawProd = localStorage.getItem('dokon_products_v1');
    const oldProds = rawProd ? JSON.parse(rawProd) : [];
    (oldProds||[]).forEach(p=>{
      if(!p || !p.name) return;
      if(KNOWN_DEMO_NAMES.some(n=>p.name.indexOf(n)===0)) return; // eski 1-versiya demo namunalarini qayta tiklamaymiz
      const catName = catIdToName[p.categoryId] || 'Boshqa';
      if(!DB.categories.some(n=>n.toLowerCase()===catName.toLowerCase())) DB.categories.push(catName);
      const barcode = (p.barcodes && p.barcodes[0]) || dkUniqueBarcode();
      const already = DB.products.some(x=> x.barcode===barcode || (p.sku && x.sku===p.sku));
      if(already) return;
      DB.products.push({
        id: p.id || uid('p'),
        sku: p.sku || dkUniqueSku(),
        barcode,
        qrCode: p.qrCode || dkUniqueQr(p.sku),
        name: p.name,
        brand: p.brand||'',
        category: catName,
        emoji: (DB.categoryIcons && DB.categoryIcons[catName]) || '📦',
        image: p.image||null,
        packaged: p.packaged!==false,
        size: p.size||'',
        unit: p.unit||'dona',
        desc: p.description||'',
        isForSale: false, qty: 0, cost: 0, price: 0, minQty: 0, batches: [],
        createdAt: p.createdAt||Date.now(), updatedAt: p.updatedAt||Date.now(),
      });
    });
  }catch(e){}
}
function load(){
  const raw = localStorage.getItem('dokonuz_db');
  if(raw){
    DB = JSON.parse(raw);
    if(!DB.categories || !DB.categories.length) DB.categories = DEFAULT_CATEGORIES.slice();
    if(!DB.categoryIcons) DB.categoryIcons = {};
    Object.keys(DEFAULT_CATEGORY_ICONS).forEach(k=>{ if(DB.categoryIcons[k]===undefined) DB.categoryIcons[k]=DEFAULT_CATEGORY_ICONS[k]; });
    if(!DB.categoryImages) DB.categoryImages = {};
    if(!DB.brands) DB.brands = [];
    if(!DB.deliveries) DB.deliveries = [];
    if(!DB.warehouses || !DB.warehouses.length) DB.warehouses = [{id:'wh_main', name:'Asosiy ombor', isDefault:true, createdAt:Date.now()}];
    if(!DB.warehouses.some(w=>w.isDefault)) DB.warehouses[0].isDefault = true;
    if(!DB.transfers) DB.transfers = [];
    if(!DB.inventories) DB.inventories = [];
    if(DB.roleRights){
      if(DB.roleRights.admin && DB.roleRights.admin.inventory===undefined) DB.roleRights.admin.inventory = true;
      if(DB.roleRights.omborchi && DB.roleRights.omborchi.inventory===undefined) DB.roleRights.omborchi.inventory = true;
      if(DB.roleRights.sotuvchi && DB.roleRights.sotuvchi.inventory===undefined) DB.roleRights.sotuvchi.inventory = false;
    }
    if(!DB.products) DB.products = [];
    DB.products.forEach(migrateProduct);
    if(!DB.sellerProducts) DB.sellerProducts = [];
    if(!DB.customers) DB.customers = [];
    DB.customers.forEach(c=>{ if(c.address===undefined) c.address=''; });
    if(!DB.returns) DB.returns = [];
    /* Eski (yangi qaytarish tizimidan oldingi) yozuvlarga standart qiymatlar:
       ular allaqachon qo'llanilgan deb hisoblanadi (status: tasdiqlangan),
       itemIndex noma'lum (productId bo'yicha moslashtiriladi), usul sotuvdan
       kelib chiqib taxmin qilinadi. Hech narsa buzilmaydi — faqat yo'q
       maydonlar to'ldiriladi. */
    DB.returns.forEach(r=>{
      if(r.qty===undefined) r.qty=1;
      if(r.status===undefined) r.status='tasdiqlangan';
      if(r.groupId===undefined) r.groupId=r.id;
      if(r.condition===undefined) r.condition = r.restock===false ? 'brak' : 'yaxshi';
      if(r.amount===undefined) r.amount = r.price*r.qty;
      if(r.method===undefined){
        const s = DB.sales.find(x=>x.id===r.saleId);
        r.method = (s && (s.paymentType==='naqd'||s.paymentType==='karta')) ? s.paymentType : 'naqd';
      }
      if(r.checkNo===undefined){ const s = DB.sales.find(x=>x.id===r.saleId); r.checkNo = s? s.checkNo : ''; }
      if(r.itemIndex===undefined) r.itemIndex = null;
      if(r.cost===undefined) r.cost = 0;
      if(r.batchId===undefined) r.batchId = null;
      if(r.who===undefined) r.who = '';
    });
    if(!DB.sales) DB.sales = [];
    if(DB.saleCounter===undefined) DB.saleCounter = 0;
    DB.sales.forEach(s=>{
      if(!s.status) s.status='yakunlangan';
      if(!s.checkNo){ DB.saleCounter=(DB.saleCounter||0)+1; s.checkNo='A-'+String(DB.saleCounter).padStart(6,'0'); }
      if(s.subtotal===undefined) s.subtotal=s.total;
      if(s.discountTotal===undefined) s.discountTotal=0;
      if(s.deliveryFee===undefined) s.deliveryFee=0;
    });
    if(!DB.roleRights) DB.roleRights = {admin:{},sotuvchi:{},omborchi:{}};
    const rrDefaults = {
      admin:{delivery:true,editPrice:true,maxDiscountPercent:100,cancelSale:true,tovarlar:true,dashboard:true},
      sotuvchi:{delivery:true,editPrice:false,maxDiscountPercent:15,cancelSale:false,tovarlar:true,dashboard:true},
      omborchi:{delivery:true,editPrice:false,maxDiscountPercent:0,cancelSale:false,tovarlar:true,dashboard:true},
    };
    Object.keys(rrDefaults).forEach(r=>{
      if(!DB.roleRights[r]) DB.roleRights[r]={};
      Object.keys(rrDefaults[r]).forEach(k=>{ if(DB.roleRights[r][k]===undefined) DB.roleRights[r][k]=rrDefaults[r][k]; });
    });
    // MUHIM TUZATISH: "Dashboard" tugmasi menyuda hech qachon yashirilmasin —
    // eski saqlangan ma'lumotlarda roleRights ichida "dashboard" kaliti umuman
    // bo'lmagani uchun menyu tugmasi ko'rinmas bo'lib qolar edi (faqat ilova
    // birinchi ochilganda currentPage='dashboard' bo'lgani uchun sahifa
    // ko'rinar, keyin esa uni menyudan qayta topib bo'lmas edi). Endi har
    // safar yuklanganda majburan yoqib qo'yiladi — rol huquqlaridan qat'iy nazar.
    Object.keys(DB.roleRights).forEach(r=>{ DB.roleRights[r].dashboard = true; });
    // Sotuvchi endi o'zi "Mahsulotlar" bo'limidan SOTUVDA tugmasini bosa oladi
    // (avval bu ruxsat faqat admin/omborchida edi) — eski saqlangan
    // ma'lumotlarda ham shu huquq yoqilishi uchun majburan yangilanadi.
    if(DB.roleRights.sotuvchi) DB.roleRights.sotuvchi.products = true;

    /* Bir martalik migratsiya: eski demo ma'lumotlar (mahsulot, savdo,
       kirim/chiqim, xarajat, qaytarish, mijoz, activity) tozalanadi.
       Eski, alohida "Mahsulotlar" katalogi (dokon_categories_v1 /
       dokon_products_v1 — localStorage'dagi ajratilgan kalitlar) esa
       o'chirishdan OLDIN yagona DB.categories/DB.products bazasiga
       ko'chiriladi (migrateLegacyDkStore) — shunda foydalanuvchi u yerda
       qo'shgan haqiqiy kategoriya/mahsulotlar yo'qolib ketmaydi. Bu blok
       faqat BIR MARTA ishlaydi — shundan keyin foydalanuvchi kiritgan
       haqiqiy ma'lumotlar doim saqlanadi. */
    if(!DB.schemaV2Migrated){
      DB.products = [];
      DB.sales = [];
      DB.expenses = [];
      DB.returns = [];
      DB.deliveries = [];
      DB.stockMoves = [];
      DB.customers = [];
      DB.cash = {history:[]};
      DB.activity = [];
      DB.saleCounter = 0;
      migrateLegacyDkStore();
      DB.products.forEach(migrateProduct); // migrateLegacyDkStore orqali qo'shilgan mahsulotlarga ham brandId/boshqa maydonlar to'liq biriktirilsin
      DB.schemaV2Migrated = true;
      try{ localStorage.removeItem('dokon_categories_v1'); localStorage.removeItem('dokon_products_v1'); }catch(e){}
    }
    save();
  }
  else {
    seedData();
    migrateLegacyDkStore();
    DB.products.forEach(migrateProduct);
    try{ localStorage.removeItem('dokon_categories_v1'); localStorage.removeItem('dokon_products_v1'); }catch(e){}
    save();
  }
  if(DB.currentShift===undefined) DB.currentShift = null;
  if(!DB.closedShifts) DB.closedShifts = [];
  if(DB.shiftCounter===undefined) DB.shiftCounter = 0;
  CATEGORIES = DB.categories;
}

function toast(msg,err){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(err?' err':'');
  t.innerHTML = icon(err?'x-circle':'check-circle2')+`<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.25s'; setTimeout(()=>t.remove(),250); },2600);
  lucide.createIcons();
}

   Hozircha rol almashtirgich (roleSelect) bitta belgilangan xodimni tanlaydi

  return emp ? emp.id : 'default_seller';
}
/* Berilgan sotuvchi shu mahsulotni "SOTUVDA" qilganmi (DB.sellerProducts yozuvi) */
function sellerProductEntry(sellerId, productId){
  return DB.sellerProducts.find(sp=>sp.sellerId===sellerId && sp.productId===productId);
}
function sellerHasForSale(sellerId, productId){
  const sp = sellerProductEntry(sellerId, productId);
  return !!(sp && sp.isForSale);
}

function setRole(role){
  currentRole = role;
  document.getElementById('avatarBox').textContent = role==='admin'?'A':(role==='sotuvchi'?'A':'V');
  renderMenu();
  if(!canAccess(currentPage)) nav('dashboard');
  else renderPage();

function renderMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = MENU.map(m=>{
    const allowed = m.id==='dashboard' ? true : DB.roleRights[currentRole][m.id];
    const lowStock = m.id==='products' ? DB.products.filter(p=>p.qty<=p.minQty).length : 0;
    const overdue = m.id==='debts' ? DB.customers.filter(c=>c.debtTotal>0 && c.dueDate && c.dueDate<todayISO()).length : 0;
    const pendingDlv = m.id==='delivery' ? DB.deliveries.filter(d=>d.status!=='Yetkazildi').length : 0;
    const tvAttention = m.id==='tovarlar' ? DB.products.filter(p=>p.isForSale && p.qty===0).length : 0;
    const badge = lowStock? `<span class="badge">${lowStock}</span>` : (overdue?`<span class="badge">${overdue}</span>` : (pendingDlv?`<span class="badge">${pendingDlv}</span>` : (tvAttention?`<span class="badge">${tvAttention}</span>`:'')));
    return `<div class="menu-item ${currentPage===m.id?'active':''} ${allowed?'':'menu-hidden'}" onclick="nav('${m.id}')">
      ${icon(m.icon)}<span>${m.label}</span>${badge}
    </div>`;
  }).join('');
  // mobile nav
  const mn = document.getElementById('mobileNav');
  mn.innerHTML = MOBILE_MAIN.map(id=>{
    const m = MENU.find(x=>x.id===id);
    const allowed = id==='dashboard' ? true : DB.roleRights[currentRole][id];
    if(id==='scanner'){
      if(!allowed) return `<div style="flex:1"></div>`;
      const q = cartQtyTotal();
      const badgeTxt = q>0 ? (Number.isInteger(q)? q : q.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')) : '';
      return `<div class="mn-item" onclick="nav('sales')">
        <div class="mn-scan">${icon('shopping-cart')}<span class="mn-cart-badge" id="mnCartBadge" style="display:${q>0?'flex':'none'}">${badgeTxt}</span></div>
        <span>Savdo</span>
      </div>`;
    }
    return `<div class="mn-item ${currentPage===id?'active':''} ${allowed?'':'menu-hidden'}" onclick="nav('${id}')">${icon(m.icon)}<span>${m.label}</span></div>`;
  }).join('');
  lucide.createIcons();
}

   real vaqtda yangilanadi, mobil menyuni to'liq qayta chizmasdan. */

function computeDashboardStats(){
  const todayStr = todayISO();
  const todaySales = activeSales().filter(s=>s.date.slice(0,10)===todayStr);
  const grossTodayRevenue = todaySales.reduce((a,s)=>a+s.total,0);
  const grossTodayProfit = todaySales.reduce((a,s)=>a+s.items.reduce((x,it)=>x+(it.price-it.cost)*it.qty,0),0);
  /* Qaytarishlar — bugungi TASDIQLANGAN qaytarishlar kunlik savdo/foyda
     summasidan ayiriladi (5-band: "Kunlik savdo summasi kamaytirilsin"). */
  const todayReturns = confirmedReturns().filter(r=>r.date && r.date.slice(0,10)===todayStr);
  const todayReturnedAmount = todayReturns.reduce((a,r)=>a+returnAmount(r),0);
  const todayReturnedProfit = todayReturns.reduce((a,r)=>a+((r.price-(r.cost||0))*r.qty),0);
  const todayRevenue = grossTodayRevenue - todayReturnedAmount;
  const todayProfit = grossTodayProfit - todayReturnedProfit;
  const soldQty = todaySales.reduce((a,s)=>a+s.items.reduce((x,it)=>x+it.qty,0),0);
  const stockQty = DB.products.reduce((a,p)=>a+p.qty,0);
  const totalDebt = DB.customers.reduce((a,c)=>a+c.debtTotal,0);
  const todayExpense = DB.expenses.filter(e=>e.date.slice(0,10)===todayStr).reduce((a,e)=>a+e.amount,0);
  const naqdReturnedAll = confirmedReturns().filter(r=>r.method==='naqd').reduce((a,r)=>a+returnAmount(r),0);
  const cashIn = activeSales().filter(s=>s.paymentType==='naqd').reduce((a,s)=>a+s.paidNow,0) + activeSales().filter(s=>s.paymentType==='aralash').reduce((a,s)=>a+(s.cashPart||0),0) - naqdReturnedAll;
  const warehouseValue = DB.products.reduce((a,p)=>a+p.qty*p.cost,0);
  /* --------- Qo'shimcha ko'rsatkichlar (Dashboard uchun) --------- */
  const totalProducts = DB.products.length;
  const todayInMoves = DB.stockMoves.filter(m=>m.dir==='in' && m.date.slice(0,10)===todayStr);
  const todayOutMoves = DB.stockMoves.filter(m=>m.dir==='out' && m.date.slice(0,10)===todayStr);
  const allSalesTotal = activeSales().reduce((a,s)=>a+s.total,0);
  const totalReturnedAll = confirmedReturns().reduce((a,r)=>a+returnAmount(r),0);
  const netSalesAll = allSalesTotal - totalReturnedAll;
  const todaySalesCount = todaySales.length;
  const opsToday = todaySales.length + todayInMoves.length + todayOutMoves.length + todayReturns.length;
  /* Muddati yaqin partiyalar: yaroqlilik muddati 7 kun ichida (o'tib ketmagan) */
  const expiringSoon = [];
  DB.products.forEach(p=>{
    (p.batches||[]).forEach(b=>{
      if(!b.expiry || b.qty<=0) return;
      const d = daysBetween(todayStr, b.expiry);
      if(d>=0 && d<=7) expiringSoon.push({product:p, batch:b, daysLeft:d});
    });
  });
  expiringSoon.sort((a,b)=>a.daysLeft-b.daysLeft);
  return {todayRevenue,todayProfit,soldQty,stockQty,totalDebt,todayExpense,cashIn,warehouseValue,
    totalProducts,todayInMoves,todayOutMoves,todayReturns,allSalesTotal,opsToday,expiringSoon,todaySalesCount,
    todayReturnedAmount,totalReturnedAll,netSalesAll};
}

function drawDashboardCharts(){
  const ctx1 = document.getElementById('chartWeekly');
  if(ctx1){
    const days=[]; const revs=[];
    for(let i=6;i>=0;i--){

      options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:'#EEF1EF'},ticks:{callback:v=>(v/1000)+'k'}},x:{grid:{display:false}}}}});

  if(ctx2){
    const asales = activeSales();
