<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DO'KON.UZ — Oziq-ovqat mahsulotlari boshqaruv tizimi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DO'KON.UZ — style.css (1-bosqichda shu yerda, keyin ajratiladi)
   ============================================================ */
:root{
  --primary:#0F8B4C;
  --primary-dark:#0B6B3A;
  --primary-light:#E6F5EC;
  --danger:#D6432F;
  --danger-light:#FBEAE7;
  --warning:#C7861B;
  --warning-light:#FDF2E0;
  --info:#2563A6;
  --info-light:#E8F0F9;
  --bg:#F3F5F4;
  --surface:#FFFFFF;
  --surface-2:#F8F9F8;
  --border:#E1E5E2;
  --text:#1B211D;
  --text-soft:#5B655E;
  --text-faint:#8B958E;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --shadow:0 1px 2px rgba(20,30,24,.06), 0 1px 1px rgba(20,30,24,.04);
  --shadow-lift:0 8px 24px rgba(20,30,24,.12);
  --font:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
svg.icon{width:18px;height:18px;stroke-width:2;flex-shrink:0;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D3D8D4;border-radius:8px;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:248px;flex-shrink:0;background:#12241A;color:#DCE7DF;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
  z-index:40;transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
.brand .name{font-weight:800;font-size:16px;letter-spacing:.2px;color:#fff;}
.brand .sub{font-size:11px;color:#8EA598;}
nav.menu{flex:1;overflow-y:auto;padding:12px 10px;}
.menu-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-s);
  color:#B9C9BF;font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:2px;transition:.15s;
  position:relative;
}
.menu-item svg{width:17px;height:17px;opacity:.85;}
.menu-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.menu-item.active{background:var(--primary);color:#fff;}
.menu-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}
.menu-hidden{display:none !important;}
.sidebar-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7D9587;}

/* Main */
#main{flex:1;margin-left:248px;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
header.topbar{
  height:64px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30;
}
.burger{display:none;}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-m);padding:8px 12px;
}
.search-box input{flex:1;background:transparent;border:none;outline:none;}
.search-box svg{width:16px;height:16px;color:var(--text-faint);}
#searchResults{
  position:absolute;top:56px;left:22px;width:420px;max-height:360px;overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-lift);display:none;z-index:50;
}
#searchResults .sr-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
#searchResults .sr-item:hover{background:var(--surface-2);}
#searchResults .sr-title{font-weight:700;font-size:13px;}
#searchResults .sr-sub{font-size:11.5px;color:var(--text-soft);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.role-switch{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius-m);}
.role-switch select{background:transparent;border:none;outline:none;font-weight:700;font-size:12.5px;}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);}
.icon-btn:hover{background:var(--border);}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
#notifPanel{position:absolute;top:56px;right:22px;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow-lift);display:none;z-index:50;overflow:hidden;}
#notifPanel .np-head{padding:12px 14px;font-weight:800;border-bottom:1px solid var(--border);font-size:13px;}
#notifPanel .np-item{padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;gap:9px;align-items:flex-start;}
#notifPanel .np-item:last-child{border-bottom:none;}
.np-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}

main.content{padding:22px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:21px;font-weight:800;}
.page-head p{font-size:12.5px;color:var(--text-soft);margin-top:2px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-s);font-weight:700;font-size:13px;transition:.15s;white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#B93524;}
.btn-ghost{background:transparent;color:var(--text-soft);padding:6px 8px;}
.btn-ghost:hover{color:var(--text);background:var(--surface-2);border-radius:var(--radius-s);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Cards / Grid */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;}
.stat-card{display:flex;flex-direction:column;gap:8px;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.stat-label{font-size:12px;color:var(--text-soft);font-weight:600;}
.stat-value{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-.3px;}
.stat-delta{font-size:11.5px;font-weight:700;}
.up{color:var(--primary);}
.down{color:var(--danger);}

/* Dashboard stat kartochkalari — faqat Dashboard uchun scoped, .grid-4/.grid-3/.grid-2'ga tegmaydi */
.dashboard-stats{grid-template-columns:repeat(4,1fr);}
.stat-card{padding:14px;gap:6px;min-width:0;transition:.15s;}
.stat-card[onclick]:hover{border-color:var(--primary);box-shadow:var(--shadow);}
.stat-top{min-width:0;}
.stat-icon{width:32px;height:32px;border-radius:9px;flex-shrink:0;}
.stat-icon svg.icon{width:16px;height:16px;}
.stat-label{font-size:11px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-value{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-delta{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:1180px){
  .dashboard-stats{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:640px){
  .dashboard-stats{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card{padding:11px;gap:4px;}
  .stat-icon{width:28px;height:28px;border-radius:8px;}
  .stat-icon svg.icon{width:14px;height:14px;}
  .stat-value{font-size:15.5px;}
  .stat-label{font-size:9.5px;}
  .stat-delta{font-size:9px;}
}
@media(max-width:380px){
  .dashboard-stats{gap:8px;}
  .stat-card{padding:9px;}
}

.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.chart-wrap{position:relative;height:230px;}

.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-m);font-size:12.5px;font-weight:600;margin-bottom:8px;}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.alert-danger{background:var(--danger-light);color:#8E2C1F;}
.alert-warning{background:var(--warning-light);color:#8A5F10;}
.alert-info{background:var(--info-light);color:#1D4E82;}
.alert-ok{background:var(--primary-light);color:var(--primary-dark);}

/* Tables */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);overflow:hidden;}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.table-toolbar input[type=text],.table-toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface-2);min-width:140px;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:640px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.cell-strong{font-weight:700;}
.cell-mono{font-family:var(--mono);font-size:12.5px;}
.row-actions{display:flex;gap:6px;}
.thumb{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--text-soft);border:1px solid var(--border);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--primary-light);color:var(--primary-dark);}
.badge-red{background:var(--danger-light);color:#8E2C1F;}
.badge-yellow{background:var(--warning-light);color:#8A5F10;}
.badge-gray{background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,17,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-l);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lift);}
.modal.modal-lg{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-head h3{font-size:16px;font-weight:800;}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Toast */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:var(--radius-m);font-size:13px;font-weight:600;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:9px;animation:toastin .2s ease;}
.toast svg{width:16px;height:16px;}
.toast.err{background:var(--danger);}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* POS */
.pos-wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
.pos-search{display:flex;gap:10px;margin-bottom:14px;}
.pos-search .search-box{max-width:none;}
.cat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cat-chip{padding:7px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text-soft);}
.cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pos-products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.pos-pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px;cursor:pointer;transition:.15s;}
.pos-pcard:hover{border-color:var(--primary);box-shadow:var(--shadow);}
.pos-pcard .thumb{width:100%;height:64px;border-radius:8px;font-size:22px;margin-bottom:8px;}
.pos-pcard .pname{font-weight:700;font-size:12.5px;line-height:1.3;margin-bottom:4px;min-height:32px;}
.pos-pcard .pprice{font-family:var(--mono);font-weight:800;color:var(--primary-dark);font-size:13px;}
.pos-pcard .pstock{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
.cart-card{position:sticky;top:80px;}
.cart-items{max-height:280px;overflow-y:auto;margin-bottom:12px;}
.cart-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
.cart-item .ci-name{font-weight:700;font-size:12.5px;flex:1;}
.cart-item .ci-price{font-size:11px;color:var(--text-soft);font-family:var(--mono);}
.qty-box{display:flex;align-items:center;gap:6px;}
.qty-box button{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:var(--surface-2);font-weight:800;}
.qty-box span{min-width:18px;text-align:center;font-weight:700;font-size:12.5px;}
.cart-empty{text-align:center;color:var(--text-faint);padding:30px 0;font-size:12.5px;}
.cart-totals{border-top:1px dashed var(--border);padding-top:10px;margin-top:6px;}
.ct-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;color:var(--text-soft);}
.ct-row.total{font-size:17px;font-weight:800;color:var(--text);margin-top:8px;}
.pay-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.pay-type{padding:10px 6px;border:1.5px solid var(--border);border-radius:var(--radius-m);text-align:center;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.pay-type svg{width:18px;height:18px;}
.pay-type.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}
.discount-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--primary);border-radius:8px;background:var(--primary-light);color:var(--primary-dark);font-weight:800;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap;}
.discount-btn svg{width:14px;height:14px;}
.discount-btn:hover{background:var(--primary);color:#fff;}
.discount-btn:active{transform:scale(.97);}
.discount-btn.has-value{border-color:var(--primary-dark);}

/* QR scanner */
.scan-box{max-width:420px;margin:0 auto;text-align:center;}
.scan-frame{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#12241A,#1E3A29);border-radius:var(--radius-l);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:16px;overflow:hidden;}
.scan-frame svg{width:44%;height:44%;color:rgba(255,255,255,.35);}
.scan-corner{position:absolute;width:26px;height:26px;border:3px solid var(--primary);}
.scan-corner.tl{top:16px;left:16px;border-right:none;border-bottom:none;}
.scan-corner.tr{top:16px;right:16px;border-left:none;border-bottom:none;}
.scan-corner.bl{bottom:16px;left:16px;border-right:none;border-top:none;}
.scan-corner.br{bottom:16px;right:16px;border-left:none;border-top:none;}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:var(--primary);box-shadow:0 0 8px var(--primary);animation:scanmove 2.2s ease-in-out infinite;}
@keyframes scanmove{0%{top:14%}50%{top:84%}100%{top:14%}}

/* Debt status */
.debt-progress{width:100%;height:6px;background:var(--border);border-radius:6px;overflow:hidden;}
.debt-progress span{display:block;height:100%;background:var(--primary);}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:10px 16px;font-weight:700;font-size:13px;color:var(--text-soft);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--primary-dark);border-color:var(--primary);}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-faint);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}

/* Role perm table */
.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.perm-col{border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.perm-col h4{font-size:13px;font-weight:800;margin-bottom:10px;}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--border);}
.perm-row:last-child{border-bottom:none;}
.switch{width:34px;height:20px;border-radius:20px;background:var(--border);position:relative;flex-shrink:0;}
.switch.on{background:var(--primary);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;}
.switch.on::after{left:16px;}

/* Mobile bottom nav */
#mobileNav{display:none;}

/* Responsive */
@media(max-width:1180px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .pos-wrap{grid-template-columns:1fr;}
  .pos-products{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lift);}
  #main{margin-left:0;}
  .burger{display:flex;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius-s);}
  .grid-3{grid-template-columns:1fr 1fr;}
  main.content{padding:14px;padding-bottom:84px;}
  #mobileNav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);
    border-top:1px solid var(--border);z-index:35;justify-content:space-around;align-items:center;
    box-shadow:0 -4px 12px rgba(0,0,0,.06);
  }

<div id="app">

          <select id="roleSelect" onchange="setRole(this.value)">
            <option value="admin">Admin — Aziz</option>

            <option value="omborchi">Omborchi — Vali</option>
          </select>

          <button class="icon-btn" id="notifBtn"><svg class="icon" data-lucide="bell"></svg><span class="dot" id="notifDot"></span></button>

<script>
/* ==================================================================================
   DO'KON.UZ — OZIQ-OVQAT MAHSULOTLARI DO'KONI
   app.js + data.js + products.js + sales.js + customers.js + debts.js +
   inventory.js + employees.js + cash.js + reports.js + qr.js + scanner.js + delivery.js
   (1-bosqichda bitta faylda)
   ================================================================================== */

/* ---------------------------- UTIL ---------------------------- */
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm";
const fmtNum = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
const fmtQty = n => { const r = Math.round((Number(n)||0)*10000)/10000; return (r % 1 === 0) ? String(r) : String(r.toFixed(4)).replace(/0+$/,'').replace(/\.$/,''); };
/* Internal quantity precision: keep 6 decimals so fractional kg/litr (esp. money-based) amounts don't lose accuracy */
const roundQty = n => Math.round((Number(n)||0)*1e6)/1e6;
const uid = p => p + '_' + Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);
function nowStr(){ const d=new Date(); return d.toLocaleDateString('uz-UZ')+' '+d.toTimeString().slice(0,5); }
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/86400000); }
function icon(name,cls){ return `<svg class="icon ${cls||''}" data-lucide="${name}"></svg>`; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function genBarcode(){
  let base12 = '487';
  for(let i=0;i<9;i++) base12 += Math.floor(Math.random()*10);
  return base12 + ean13CheckDigit(base12);
}
function genQr(sku){ return (sku||'QR')+'-'+Math.random().toString(36).slice(2,7).toUpperCase(); }
function stepFor(unit){ return ['dona','qop','komplekt','rulon','pachka'].includes(unit) ? 1 : 0.1; }
function activeSales(){ return DB.sales.filter(s=>s.status!=='bekor qilingan'); }

/* ---------------------------- QADOQLI / QADOQSIZ (packaged vs bulk) ---------------------------- */
const PACKAGED_UNITS = ['dona','qop','komplekt','rulon','pachka','banka','butilka']; // sotiladigan butun birliklar
const BULK_UNITS = ['kg','litr']; // qadoqsiz — kasr miqdorda va pul bo'yicha sotilishi mumkin bo'lgan birliklar
function isPackagedProduct(p){ return p.packaged !== false; } // default: qadoqli (eski xatti-harakat o'zgarmaydi)
function requiresWholeQty(p){ return isPackagedProduct(p) || ['dona','qop','komplekt','rulon','pachka'].includes(p.unit); }
function canSellByMoney(p){ return !isPackagedProduct(p) && BULK_UNITS.includes(p.unit); }
function qtyStepFor(p){ return requiresWholeQty(p) ? 1 : 0.01; }

/* ---------------------------- MIGRATION / LOAD / SAVE ---------------------------- */
function migrateProduct(p){
  if(!p.unit) p.unit = 'dona';
  if(p.brand===undefined) p.brand = '';
  if(p.desc===undefined) p.desc = '';
  if(!p.sku) p.sku = uid('sku');
  /* EAN-13 shtrix-kod: mavjud bo'lmasa yoki checksum'i noto'g'ri bo'lsa, yangi
     VALID EAN-13 generatsiya qilinadi. Haqiqiy (checksum'i to'g'ri) EAN-13
     o'zgartirilmaydi — shu jumladan ishlab chiqaruvchining haqiqiy kodi. */
  if(!p.barcode || !isValidEAN13(p.barcode)) p.barcode = genBarcode();
  if(!p.qrCode) p.qrCode = genQr(p.sku);
  if(p.cost==null) p.cost = 0;
  if(p.price==null) p.price = 0;
  if(p.qty==null) p.qty = 0;
  if(p.minQty==null) p.minQty = 0;
  if(!p.emoji) p.emoji = '📦';
  if(p.packUnit===undefined) p.packUnit = null;
  if(p.packSize===undefined) p.packSize = null;
  if(p.packaged===undefined) p.packaged = !BULK_UNITS.includes(p.unit); // kg/litr -> qadoqsiz by default; boshqa hammasi qadoqli (eski xatti-harakat saqlanadi)
  if(p.packLabel===undefined) p.packLabel = '';
  if(p.isForSale===undefined) p.isForSale = false;
  if(p.category===undefined) p.category = '';
  if(p.size===undefined) p.size = '';
  /* Qadoq og'irligi birligi (masalan "g" — "1 dona og'irligi: 450 g").
     Eski mahsulotlarda yo'q — pkgLabel() bunday holda avtomatik p.unit'ga qaytadi,
     ya'ni hech narsa buzilmaydi. Hisob birligi (p.unit) bilan ATAYLAB aralashtirilmaydi. */
  if(p.pkgUnit===undefined) p.pkgUnit = null;
  if(p.image===undefined) p.image = null;
  /* Partiya (LOT) tizimi: qoldiq endi partiyalar yig'indisidan iborat.
     Eski (partiyasiz) mahsulotda qoldiq bo'lsa, uni bitta "meros" partiya
     sifatida ko'chiramiz — shunda hisоb-kitob buzilmaydi. */
  if(!p.batches){
    p.batches = p.qty>0
      ? [{id:uid('lot'),lot:'LEGACY',qty:p.qty,cost:p.cost,price:p.price,expiry:null,supplier:'',note:"Eski tizimdan ko'chirilgan",date:todayISO(),createdAt:Date.now()}]
      : [];
  }
  return p;
}

/* Eski, alohida "Mahsulotlar" katalogi (dokon_categories_v1 / dokon_products_v1)
   endi ishlatilmaydi, lekin u yerda foydalanuvchi qo'shgan haqiqiy kategoriya
   yoki mahsulotlar bo'lishi mumkin. Shu funksiya o'sha eski ma'lumotlarni
   o'chirishdan OLDIN yagona DB.categories / DB.categoryIcons / DB.products
   bazasiga ko'chiradi (faqat 1-avlod migratsiyasi paytida bir marta chaqiriladi). */
function migrateLegacyDkStore(){
  // Turdagi 1-versiya demo namunalar (agar topilsa, qayta tiklanmaydi):
  const KNOWN_DEMO_NAMES = ['Musaffo Sut','Qatiq','Smetana','Coca-Cola','Mineral suv','Alenka shokoladi','Pechenye'];
  try{
    const rawCat = localStorage.getItem('dokon_categories_v1');
    const oldCats = rawCat ? JSON.parse(rawCat) : [];
    const catIdToName = {};
    (oldCats||[]).forEach(c=>{
      if(!c || !c.name) return;
      catIdToName[c.id] = c.name;
      if(!DB.categories.some(n=>n.toLowerCase()===c.name.toLowerCase())){
        DB.categories.push(c.name);
      }
      if(!DB.categoryIcons) DB.categoryIcons = {};
      if(DB.categoryIcons[c.name]===undefined) DB.categoryIcons[c.name] = c.icon || '📦';
      if(c.image){
        if(!DB.categoryImages) DB.categoryImages = {};
        if(!DB.categoryImages[c.name]) DB.categoryImages[c.name] = c.image;
      }
    });
    const rawProd = localStorage.getItem('dokon_products_v1');
    const oldProds = rawProd ? JSON.parse(rawProd) : [];
    (oldProds||[]).forEach(p=>{
      if(!p || !p.name) return;
      if(KNOWN_DEMO_NAMES.some(n=>p.name.indexOf(n)===0)) return; // eski 1-versiya demo namunalarini qayta tiklamaymiz
      const catName = catIdToName[p.categoryId] || 'Boshqa';
      if(!DB.categories.some(n=>n.toLowerCase()===catName.toLowerCase())) DB.categories.push(catName);
      const barcode = (p.barcodes && p.barcodes[0]) || dkUniqueBarcode();
      const already = DB.products.some(x=> x.barcode===barcode || (p.sku && x.sku===p.sku));
      if(already) return;
      DB.products.push({
        id: p.id || uid('p'),
        sku: p.sku || dkUniqueSku(),
        barcode,
        qrCode: p.qrCode || dkUniqueQr(p.sku),
        name: p.name,
        brand: p.brand||'',
        category: catName,
        emoji: (DB.categoryIcons && DB.categoryIcons[catName]) || '📦',
        image: p.image||null,
        packaged: p.packaged!==false,
        size: p.size||'',
        unit: p.unit||'dona',
        desc: p.description||'',
        isForSale: false, qty: 0, cost: 0, price: 0, minQty: 0, batches: [],
        createdAt: p.createdAt||Date.now(), updatedAt: p.updatedAt||Date.now(),
      });
    });
  }catch(e){}
}
function load(){
  const raw = localStorage.getItem('dokonuz_db');
  if(raw){
    DB = JSON.parse(raw);
    if(!DB.categories || !DB.categories.length) DB.categories = DEFAULT_CATEGORIES.slice();
    if(!DB.categoryIcons) DB.categoryIcons = {};
    Object.keys(DEFAULT_CATEGORY_ICONS).forEach(k=>{ if(DB.categoryIcons[k]===undefined) DB.categoryIcons[k]=DEFAULT_CATEGORY_ICONS[k]; });
    if(!DB.categoryImages) DB.categoryImages = {};
    if(!DB.deliveries) DB.deliveries = [];
    if(!DB.products) DB.products = [];
    DB.products.forEach(migrateProduct);
    if(!DB.sellerProducts) DB.sellerProducts = [];
    if(!DB.customers) DB.customers = [];
    DB.customers.forEach(c=>{ if(c.address===undefined) c.address=''; });
    if(!DB.returns) DB.returns = [];
    DB.returns.forEach(r=>{ if(r.qty===undefined) r.qty=1; });
    if(!DB.sales) DB.sales = [];
    if(DB.saleCounter===undefined) DB.saleCounter = 0;
    DB.sales.forEach(s=>{
      if(!s.status) s.status='yakunlangan';
      if(!s.checkNo){ DB.saleCounter=(DB.saleCounter||0)+1; s.checkNo='A-'+String(DB.saleCounter).padStart(6,'0'); }
      if(s.subtotal===undefined) s.subtotal=s.total;
      if(s.discountTotal===undefined) s.discountTotal=0;
      if(s.deliveryFee===undefined) s.deliveryFee=0;
    });
    if(!DB.roleRights) DB.roleRights = {admin:{},sotuvchi:{},omborchi:{}};
    const rrDefaults = {
      admin:{delivery:true,editPrice:true,maxDiscountPercent:100,cancelSale:true,tovarlar:true,dashboard:true},
      sotuvchi:{delivery:true,editPrice:false,maxDiscountPercent:15,cancelSale:false,tovarlar:true,dashboard:true},
      omborchi:{delivery:true,editPrice:false,maxDiscountPercent:0,cancelSale:false,tovarlar:true,dashboard:true},
    };
    Object.keys(rrDefaults).forEach(r=>{
      if(!DB.roleRights[r]) DB.roleRights[r]={};
      Object.keys(rrDefaults[r]).forEach(k=>{ if(DB.roleRights[r][k]===undefined) DB.roleRights[r][k]=rrDefaults[r][k]; });
    });
    // MUHIM TUZATISH: "Dashboard" tugmasi menyuda hech qachon yashirilmasin —
    // eski saqlangan ma'lumotlarda roleRights ichida "dashboard" kaliti umuman
    // bo'lmagani uchun menyu tugmasi ko'rinmas bo'lib qolar edi (faqat ilova
    // birinchi ochilganda currentPage='dashboard' bo'lgani uchun sahifa
    // ko'rinar, keyin esa uni menyudan qayta topib bo'lmas edi). Endi har
    // safar yuklanganda majburan yoqib qo'yiladi — rol huquqlaridan qat'iy nazar.
    Object.keys(DB.roleRights).forEach(r=>{ DB.roleRights[r].dashboard = true; });
    // Sotuvchi endi o'zi "Mahsulotlar" bo'limidan SOTUVDA tugmasini bosa oladi
    // (avval bu ruxsat faqat admin/omborchida edi) — eski saqlangan
    // ma'lumotlarda ham shu huquq yoqilishi uchun majburan yangilanadi.
    if(DB.roleRights.sotuvchi) DB.roleRights.sotuvchi.products = true;

    /* Bir martalik migratsiya: eski demo ma'lumotlar (mahsulot, savdo,
       kirim/chiqim, xarajat, qaytarish, mijoz, activity) tozalanadi.
       Eski, alohida "Mahsulotlar" katalogi (dokon_categories_v1 /
       dokon_products_v1 — localStorage'dagi ajratilgan kalitlar) esa
       o'chirishdan OLDIN yagona DB.categories/DB.products bazasiga
       ko'chiriladi (migrateLegacyDkStore) — shunda foydalanuvchi u yerda
       qo'shgan haqiqiy kategoriya/mahsulotlar yo'qolib ketmaydi. Bu blok
       faqat BIR MARTA ishlaydi — shundan keyin foydalanuvchi kiritgan
       haqiqiy ma'lumotlar doim saqlanadi. */
    if(!DB.schemaV2Migrated){
      DB.products = [];
      DB.sales = [];
      DB.expenses = [];
      DB.returns = [];
      DB.deliveries = [];
      DB.stockMoves = [];
      DB.customers = [];
      DB.cash = {history:[]};
      DB.activity = [];
      DB.saleCounter = 0;
      migrateLegacyDkStore();
      DB.schemaV2Migrated = true;
      try{ localStorage.removeItem('dokon_categories_v1'); localStorage.removeItem('dokon_products_v1'); }catch(e){}
    }
    save();
  }
  else {
    seedData();
    migrateLegacyDkStore();
    try{ localStorage.removeItem('dokon_categories_v1'); localStorage.removeItem('dokon_products_v1'); }catch(e){}
    save();
  }
  CATEGORIES = DB.categories;
}

/* ---------------------------- TOAST ---------------------------- */
function toast(msg,err){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(err?' err':'');
  t.innerHTML = icon(err?'x-circle':'check-circle2')+`<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.25s'; setTimeout(()=>t.remove(),250); },2600);
  lucide.createIcons();
}

   Hozircha rol almashtirgich (roleSelect) bitta belgilangan xodimni tanlaydi

function currentSellerId(){

  return emp ? emp.id : 'default_seller';
}
/* Berilgan sotuvchi shu mahsulotni "SOTUVDA" qilganmi (DB.sellerProducts yozuvi) */
function sellerProductEntry(sellerId, productId){
  return DB.sellerProducts.find(sp=>sp.sellerId===sellerId && sp.productId===productId);
}
function sellerHasForSale(sellerId, productId){
  const sp = sellerProductEntry(sellerId, productId);
  return !!(sp && sp.isForSale);
}

function setRole(role){
  currentRole = role;
  document.getElementById('avatarBox').textContent = role==='admin'?'A':(role==='sotuvchi'?'A':'V');
  renderMenu();
  if(!canAccess(currentPage)) nav('dashboard');
  else renderPage();
}

function renderMenu(){
  const list = document.getElementById('menuList');
  list.innerHTML = MENU.map(m=>{
    const allowed = m.id==='dashboard' ? true : DB.roleRights[currentRole][m.id];
    const lowStock = m.id==='products' ? DB.products.filter(p=>p.qty<=p.minQty).length : 0;
    const overdue = m.id==='debts' ? DB.customers.filter(c=>c.debtTotal>0 && c.dueDate && c.dueDate<todayISO()).length : 0;
    const pendingDlv = m.id==='delivery' ? DB.deliveries.filter(d=>d.status!=='Yetkazildi').length : 0;
    const tvAttention = m.id==='tovarlar' ? DB.products.filter(p=>p.isForSale && p.qty===0).length : 0;
    const badge = lowStock? `<span class="badge">${lowStock}</span>` : (overdue?`<span class="badge">${overdue}</span>` : (pendingDlv?`<span class="badge">${pendingDlv}</span>` : (tvAttention?`<span class="badge">${tvAttention}</span>`:'')));
    return `<div class="menu-item ${currentPage===m.id?'active':''} ${allowed?'':'menu-hidden'}" onclick="nav('${m.id}')">
      ${icon(m.icon)}<span>${m.label}</span>${badge}
    </div>`;
  }).join('');
  // mobile nav
  const mn = document.getElementById('mobileNav');
  mn.innerHTML = MOBILE_MAIN.map(id=>{
    const m = MENU.find(x=>x.id===id);
    const allowed = id==='dashboard' ? true : DB.roleRights[currentRole][id];
    if(id==='scanner'){
      return allowed?`<div class="mn-item mn-scan" onclick="nav('sales')">${icon('scan-line')}</div>`:`<div style="flex:1"></div>`;
    }
    return `<div class="mn-item ${currentPage===id?'active':''} ${allowed?'':'menu-hidden'}" onclick="nav('${id}')">${icon(m.icon)}<span>${m.label}</span></div>`;
  }).join('');
  lucide.createIcons();

   DASHBOARD
   ================================================================ */
function computeDashboardStats(){
  const todayStr = todayISO();
  const todaySales = activeSales().filter(s=>s.date.slice(0,10)===todayStr);
  const todayRevenue = todaySales.reduce((a,s)=>a+s.total,0);
  const todayProfit = todaySales.reduce((a,s)=>a+s.items.reduce((x,it)=>x+(it.price-it.cost)*it.qty,0),0);
  const soldQty = todaySales.reduce((a,s)=>a+s.items.reduce((x,it)=>x+it.qty,0),0);
  const stockQty = DB.products.reduce((a,p)=>a+p.qty,0);
  const totalDebt = DB.customers.reduce((a,c)=>a+c.debtTotal,0);
  const todayExpense = DB.expenses.filter(e=>e.date.slice(0,10)===todayStr).reduce((a,e)=>a+e.amount,0);
  const cashIn = activeSales().filter(s=>s.paymentType==='naqd').reduce((a,s)=>a+s.paidNow,0) + activeSales().filter(s=>s.paymentType==='aralash').reduce((a,s)=>a+(s.cashPart||0),0);
  const warehouseValue = DB.products.reduce((a,p)=>a+p.qty*p.cost,0);
  /* --------- Qo'shimcha ko'rsatkichlar (Dashboard uchun) --------- */
  const totalProducts = DB.products.length;
  const todayInMoves = DB.stockMoves.filter(m=>m.dir==='in' && m.date.slice(0,10)===todayStr);
  const todayOutMoves = DB.stockMoves.filter(m=>m.dir==='out' && m.date.slice(0,10)===todayStr);
  const todayReturns = (DB.returns||[]).filter(r=>r.date && r.date.slice(0,10)===todayStr);
  const allSalesTotal = activeSales().reduce((a,s)=>a+s.total,0);
  const todaySalesCount = todaySales.length;
  const opsToday = todaySales.length + todayInMoves.length + todayOutMoves.length + todayReturns.length;
  /* Muddati yaqin partiyalar: yaroqlilik muddati 7 kun ichida (o'tib ketmagan) */
  const expiringSoon = [];
  DB.products.forEach(p=>{
    (p.batches||[]).forEach(b=>{
      if(!b.expiry || b.qty<=0) return;
      const d = daysBetween(todayStr, b.expiry);
      if(d>=0 && d<=7) expiringSoon.push({product:p, batch:b, daysLeft:d});
    });
  });
  expiringSoon.sort((a,b)=>a.daysLeft-b.daysLeft);
  return {todayRevenue,todayProfit,soldQty,stockQty,totalDebt,todayExpense,cashIn,warehouseValue,
    totalProducts,todayInMoves,todayOutMoves,todayReturns,allSalesTotal,opsToday,expiringSoon,todaySalesCount};
}

/* Mavjud genBarcode()/genQr() dan foydalanib, DB.products ichida
   takrorlanmaydigan qiymat qaytaradi. Endi Mahsulotlar, Tovarlar va Ombor
   bitta bazadan ishlagani uchun bitta unikallik tekshiruvi yetarli. */
function dkUniqueBarcode(){
  let code;
  do{ code = genBarcode(); } while(DB.products.some(pp=>pp.barcode===code));
  return code;
}
function dkUniqueQr(seed){
  let code;
  do{ code = genQr(seed||'DK'); } while(DB.products.some(pp=>pp.qrCode===code));
  return code;
}
function dkUniqueSku(){
  let sku;
  do{ sku = 'DK-'+Math.random().toString(36).slice(2,8).toUpperCase(); } while(DB.products.some(pp=>pp.sku===sku));
  return sku;
}

/* Yagona, optimallashtirilgan universal qidiruv funksiyasi.
   Nom, brend, SKU, shtrix-kod, QR-kod va kategoriya nomi bo'yicha qidiradi
   va natijalarni ustuvorlik tartibida qaytaradi. `list` berilmasa, butun
   DB.products bo'yicha qidiradi. */
function dkSearchProducts(query, list){
  const source = list || DB.products;
  const q = dkNormQuery(query);
  if(!q) return source.slice();
  const scored = [];
  source.forEach(p=>{
    const barcode = (p.barcode||'').toLowerCase();
    const qr = (p.qrCode||'').toLowerCase();
    const sku = (p.sku||'').toLowerCase();
    const name = (p.name||'').toLowerCase();
    const brand = (p.brand||'').toLowerCase();
    const catName = (p.category||'').toLowerCase();
    // Qadoq hajmi/o'lchami (masalan "450 g", "1 litr") — variantlarni ajratib qidirish uchun
    const packLabel = (p.size ? (p.size+' '+(p.unit||'')) : (p.unit||'')).toLowerCase().trim();
    let score = -1;
    if(barcode===q) score = 100;
    else if(qr===q) score = 90;
    else if(sku===q) score = 80;
    else if(name===q) score = 75;
    else if(packLabel===q) score = 70;
    else if(barcode.includes(q)) score = 60;
    else if(name.includes(q)) score = 50;
    else if(brand===q) score = 46;
    else if(brand.includes(q)) score = 40;
    else if(sku.includes(q)) score = 35;
    else if(qr.includes(q)) score = 30;
    else if(packLabel.includes(q)) score = 25;
    else if(catName.includes(q)) score = 20;
    if(score>=0) scored.push({p,score});
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.map(s=>s.p);
}

/* ---------------- Bir xil nomdagi boshqa qadoq variantlari ----------------
   Har bir variant DB.products'da mustaqil yozuv (o'z SKU/barcode/QR/qoldig'i
   bilan). Shu funksiya xuddi shu nom+kategoriyadagi BOSHQA variantlarni
   topadi — foydalanuvchiga "Coca Cola"ning 300g/450g/1L kabi barcha
   o'lchamlarini birgalikda ko'rsatish uchun (mahsulotlar bazasi bo'linmaydi,
   faqat ko'rinishda guruhlanadi). */
function dkSiblingVariants(p){
  const nm = (p.name||'').trim().toLowerCase();
  return DB.products.filter(x=> x.id!==p.id && (x.name||'').trim().toLowerCase()===nm && x.category===p.category);
}

  return `

function dkSaveProduct(id){
  const name = document.getElementById('dk_p_name').value.trim();
  if(!name){ toast("Mahsulot nomini kiriting",true); return; }
  const existing = id ? DB.products.find(x=>x.id===id) : null;
  let barcode = document.getElementById('dk_p_barcode').value.trim();
  if(barcode){
    const dup = DB.products.find(pp=> pp.id!==id && pp.barcode===barcode);
    if(dup){ toast(`"${barcode}" shtrix-kodi "${dup.name}" mahsulotida allaqachon mavjud`,true); return; }
  } else {
    barcode = existing ? (existing.barcode || dkUniqueBarcode()) : dkUniqueBarcode();
  }
  const catSelect = document.getElementById('dk_p_category');
  const catName = catSelect ? catSelect.value : (existing ? existing.category : (dkModalCatName || dkCurrentCatId));
  if(!catName){ toast("Kategoriyani tanlang",true); return; }
  const data = {
    category: catName,
    name,
    brand: document.getElementById('dk_p_brand').value.trim(),
    image: dkImageData||null,
    packaged: dkPackaged,
    size: document.getElementById('dk_p_size').value.trim(),
    pkgUnit: document.getElementById('dk_p_pkgunit').value,
    unit: document.getElementById('dk_p_unit').value,
    barcode,
    desc: document.getElementById('dk_p_desc').value.trim(),
    updatedAt: Date.now(),
  };
  if(existing){
    Object.assign(existing, data);
    if(!existing.qrCode) existing.qrCode = dkUniqueQr(existing.sku); // eski mahsulotda QR yo'q bo'lsa to'ldiriladi, mavjud bo'lsa o'zgarmaydi
    if(!existing.emoji) existing.emoji = catIcon(catName);
    toast("Mahsulot yangilandi");
  } else {
    data.id = uid('p');
    data.sku = dkUniqueSku();
    data.qrCode = dkUniqueQr(data.sku);
    data.emoji = catIcon(catName);
    data.isForSale = false;   // yaratilganda hali sotuvda emas — SOTUVDA tugmasi bilan yoqiladi
    data.qty = 0;             // omborga hali kirim qilinmagan
    data.cost = 0;
    data.price = 0;
    data.minQty = 0;
    data.batches = [];        // partiyalar — faqat Ombor→Kirim orqali to'ldiriladi
    data.createdAt = Date.now();
    DB.products.push(data);
    toast("Mahsulot qo'shildi");
  }
  save(); closeModal(); renderPage();
}
function dkDeleteProduct(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p) return;
  let msg = `"${p.name}" mahsulotini o'chirishni tasdiqlaysizmi?`;
  if(p.isForSale || p.qty>0){
    const bits=[];
    if(p.isForSale) bits.push('sotuvda');
    if(p.qty>0) bits.push(`omborda ${fmtQty(p.qty)} ${p.unit} qoldiqqa ega`);
    msg += `\n\nDiqqat: bu mahsulot ${bits.join(' va ')}. O'chirilsa, ushbu ma'lumotlar ham yo'qoladi.`;
  }
  if(!confirm(msg)) return;
  DB.products = DB.products.filter(x=>x.id!==id);
  save(); toast("Mahsulot o'chirildi"); renderPage();
}

/* ---------------- QR/Shtrix-kod bo'yicha mahsulot qidirish (skaner) ---------------- */
function dkFindProductByCode(code, list){

/* Shared camera decode engine — ZXing (QR, EAN-13, EAN-8, UPC-A, UPC-E, Code128, Code39, ITF)
   TRY_HARDER + explicit format hints so 1D barcodes (EAN-13 va h.k.) yo'nalishidan
   qat'i nazar (vertikal/gorizontal/qiya) avtomatik aniqlanadi. */
function buildZxingHints(){
  if(typeof ZXing==='undefined' || !ZXing.DecodeHintType) return undefined;
  try{
    const hints = new Map();
    const F = ZXing.BarcodeFormat;
    const formats = [
      F.QR_CODE, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E,
      F.CODE_128, F.CODE_39, F.ITF
    ].filter(f=>f!==undefined);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    return hints;
  }catch(e){ return undefined; }
}
// Kamera constraint'lari — eng qat'iydan eng soddasiga qadar zinapoya.
// Qurilma biror constraint'ni (masalan advanced focusMode) qo'llab-quvvatlamasa,
// getUserMedia OverconstrainedError tashlaydi — shunda keyingi, soddaroq
// variantga o'tamiz, scanner butunlay to'xtab qolmaydi.
const CAMERA_CONSTRAINT_LADDER = [
  {video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}, advanced:[{focusMode:'continuous'}]}},
  {video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}},
  {video:{facingMode:'environment'}},
  {video:true}
];

/* Kamera oqimini CAMERA_CONSTRAINT_LADDER bo'yicha, eng qat'iydan eng soddasiga
   qadar, birinchi muvaffaqiyatli variantgacha sinab olamiz. */
async function acquireCameraStream(){
  let stream=null, lastErr=null;
  for(const constraints of CAMERA_CONSTRAINT_LADDER){
    try{ stream = await navigator.mediaDevices.getUserMedia(constraints); break; }
    catch(e){ lastErr=e; }
  }
  if(!stream) throw (lastErr || new Error("Kameraga ulanib bo'lmadi"));
  return stream;
}

/* Qurilma qo'llasa autofocus/continuous-focus yoqishga urinamiz. Qo'llamasa
   sekundiga ham error bermaydi — scanner oddiy default fokus bilan davom etadi. */
function tuneCameraTrack(stream){
  try{
    const track = stream.getVideoTracks && stream.getVideoTracks()[0];
    if(!track || typeof track.getCapabilities!=='function') return;
    const caps = track.getCapabilities();
    const advanced=[];
    if(caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({focusMode:'continuous'});
    if(advanced.length && typeof track.applyConstraints==='function'){
      track.applyConstraints({advanced}).then(()=>scanDebug('continuous focus yoqildi')).catch(()=>{});
    }
  }catch(e){ scanDebug('capability tuning imkonsiz, o\'tkazib yuborildi', e); }
}

/* Har frame uchun bitta canvasni qayta ishlatamiz (item 16: performance —
   canvas har frame'da yaratilmaydi/yo'q qilinmaydi). */
function ensureScannerCanvases(){
  if(!scannerCanvas){ scannerCanvas = document.createElement('canvas'); scannerCanvasCtx = scannerCanvas.getContext('2d',{willReadFrequently:true}); }
  if(!scannerRotateCanvas){ scannerRotateCanvas = document.createElement('canvas'); scannerRotateCtx = scannerRotateCanvas.getContext('2d',{willReadFrequently:true}); }
}

/* Butun video kadrni (markaziy crop qilmasdan) canvasga chizamiz — shu sababli
   barcode markazda, chetda, yuqorida, pastda — qayerda bo'lmasin aniqlanadi. */
function captureScannerFrame(videoEl){
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if(!vw || !vh) return null;
  if(scannerCanvas.width!==vw || scannerCanvas.height!==vh){ scannerCanvas.width=vw; scannerCanvas.height=vh; }
  scannerCanvasCtx.drawImage(videoEl, 0, 0, vw, vh);
  return scannerCanvas;
}

/* ZXing fallback uchun kadrni 90/180/270 gradusga aylantirib beradi — vertikal
   yoki aylangan holatda turgan 1D barcode'lar (masalan vertikal EAN-13) ham
   aniqlansin degani shu. */
function getRotatedScannerCanvas(srcCanvas, angleDeg){
  if(angleDeg===0) return srcCanvas;
  const w = srcCanvas.width, h = srcCanvas.height;
  const rotated = (angleDeg===90 || angleDeg===270);
  const nw = rotated ? h : w, nh = rotated ? w : h;
  if(scannerRotateCanvas.width!==nw || scannerRotateCanvas.height!==nh){ scannerRotateCanvas.width=nw; scannerRotateCanvas.height=nh; }
  const ctx = scannerRotateCtx;
  ctx.save();
  ctx.clearRect(0,0,nw,nh);
  if(angleDeg===90){ ctx.translate(nw,0); ctx.rotate(Math.PI/2); }
  else if(angleDeg===180){ ctx.translate(nw,nh); ctx.rotate(Math.PI); }
  else if(angleDeg===270){ ctx.translate(0,nh); ctx.rotate(-Math.PI/2); }
  ctx.drawImage(srcCanvas, 0, 0, w, h);
  ctx.restore();
  return scannerRotateCanvas;
}

/* Qaysi decode engine ishlatilishini tanlaydi:
   1) window.BarcodeDetector mavjud bo'lsa — shu (tezroq, native, batareyaga yengil)
   2) bo'lmasa yoki yaratishda xato bo'lsa — ZXing fallback (canvas orqali) */
async function pickScannerEngine(){
  const desiredFormats = ['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
  // QR va EAN-13 eng muhim formatlar (talab: 7-band) — native detector aynan
  // shularni real qo'llab-quvvatlamasa, uni primary sifatida ishonib bo'lmaydi.
  const criticalFormats = ['qr_code','ean_13'];
  if('BarcodeDetector' in window){
    try{
      let supported = [];
      let supportedKnown = false;
      if(typeof window.BarcodeDetector.getSupportedFormats==='function'){
        try{ supported = await window.BarcodeDetector.getSupportedFormats(); supportedKnown = Array.isArray(supported) && supported.length>0; }catch(e){ supported=[]; }
      }
      // Agar qurilma/brauzer formatlar ro'yxatini bersa va undagi formatlar
      // kerakli (QR/EAN-13) formatlarni real qamrab olmasa — native'ni
      // primary sifatida tanlamaymiz, to'g'ridan-to'g'ri ZXing fallbackga o'tamiz.
      if(supportedKnown && !criticalFormats.every(f=>supported.includes(f))){
        scanDebug('native BarcodeDetector kerakli formatlarni (QR/EAN-13) qo\'llamaydi, ZXing fallbackka o\'tildi', supported);
        scannerDetector = null;
      } else {
        const formats = supportedKnown ? desiredFormats.filter(f=>supported.includes(f)) : desiredFormats;
        scannerDetector = new window.BarcodeDetector({formats: formats.length ? formats : desiredFormats});
        scanDebug('detector selected: native BarcodeDetector', formats);
        scannerNativeConsecutiveErrors = 0;
        return 'native';
      }
    }catch(e){
      scanDebug('native BarcodeDetector ishlatib bo\'lmadi, ZXing fallbackka o\'tildi', e);
      scannerDetector = null;
    }
  }
  if(!ensureZxingReader()){
    return null; // hech qanday engine mavjud emas
  }
  scanDebug('detector selected: ZXing fallback (canvas frame processing)');
  return 'zxing';
}

/* zxingReader mavjud bo'lmasa yaratadi (native ishlab turgan paytda ham
   keyinchalik runtime'da fallbackga avtomatik o'tish uchun kerak bo'ladi).
   Muvaffaqiyatli bo'lsa true, ZXing kutubxonasi yuklanmagan bo'lsa false qaytaradi. */
function ensureZxingReader(){
  if(zxingReader) return true;
  if(typeof ZXing==='undefined') return false;
  try{
    const hints = buildZxingHints();
    zxingReader = hints ? new ZXing.BrowserMultiFormatReader(hints) : new ZXing.BrowserMultiFormatReader();
    return true;
  }catch(e){
    scanDebug('ZXing reader yaratib bo\'lmadi', e);
    zxingReader = null;
    return false;
  }
}

/* Native BarcodeDetector runtime'da ketma-ket bir necha marta xato bersa
   yoki umuman ishlay olmasa (masalan qurilma buni real qo'llab-quvvatlamasa),
   scanner to'xtab qolmasligi uchun ZXing fallbackka avtomatik o'tkazadi. */
function switchToZxingFallback(){
  if(scannerEngineType==='zxing') return;
  if(!ensureZxingReader()){
    scanDebug('ZXing fallbackga o\'tib bo\'lmadi — kutubxona mavjud emas');
    return;
  }
  scanDebug('native BarcodeDetector ketma-ket xato berdi, ZXing fallbackga avtomatik o\'tildi');
  scannerEngineType = 'zxing';
  scannerDetector = null;
  scannerNativeConsecutiveErrors = 0;
}

/* Asosiy scanner engine: kamerani ochadi, mos decode motorini tanlaydi va
   requestAnimationFrame uslubidagi throttled loop orqali (~100-200ms) har
   frame'ni BarcodeDetector yoki ZXing bilan tekshiradi. Chaqiruvchi funksiyalar
   (toggleCamera, dkOpenScanModal va h.k.) o'zgarishsiz shu signatura bilan
   ishlashda davom etadi: startScanEngine(videoEl, onDecode, onError). */
function startScanEngine(videoEl, onDecode, onError){
  if(scanEngineActive) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    onError && onError("Bu qurilma/brauzerda kameraga kirish imkoni yo'q");
    return;
  }
  ensureScannerCanvases();
  const token = ++scannerLoopToken; // shu ishga tushirishga tegishli "avlod raqami"
  scannerVideoEl = videoEl;
  scannerLastCode = null;
  scannerLastTime = 0;
  videoEl.setAttribute('playsinline','true');
  videoEl.muted = true;

  // Aniqlangan kodni foydalanuvchiga yetkazishdan oldin 1.5 soniyalik
  // duplicate-protection: bitta barcode kamera oldida uzoq turganda
  // qayta-qayta (har frame'da) mahsulot qo'shilib ketmasligi uchun.
  function handleDetected(code){
    if(!code) return;
    if(token!==scannerLoopToken || !scanEngineActive) return;
    const now = Date.now();
    if(code===scannerLastCode && (now-scannerLastTime)<1500) return;
    scannerLastCode = code;
    scannerLastTime = now;
    scanDebug('barcode detected', code);
    onDecode(code);
  }

  let rotationIndex = 0;
  const ZXING_ROTATIONS = [0, 90, 180, 270];

  function runLoop(){
    if(token!==scannerLoopToken || !scanEngineActive) return;
    scannerLoopTimer = setTimeout(async ()=>{
      if(token!==scannerLoopToken || !scanEngineActive) return;
      try{
        const frame = captureScannerFrame(videoEl);
        if(frame){
          if(scannerEngineType==='native' && scannerDetector){
            try{
              const results = await scannerDetector.detect(frame);
              if(token!==scannerLoopToken || !scanEngineActive) return;
              scannerNativeConsecutiveErrors = 0; // muvaffaqiyatli chaqiruv — hisoblagichni tozalaymiz
              if(results && results.length) handleDetected(results[0].rawValue);
            }catch(nerr){
              scanDebug('native detect xatosi (davom etamiz)', nerr);
              scannerNativeConsecutiveErrors++;
              // Native detector ketma-ket bir necha marta xato bersa (masalan
              // qurilma/brauzer uni amalda ishlata olmasa), ZXing fallbackga
              // avtomatik o'tamiz — scanner bu yerda to'xtab qolmaydi, chunki
              // pastda runLoop() baribir chaqiriladi va shu yangi engine bilan davom etadi.
              if(scannerNativeConsecutiveErrors>=SCANNER_NATIVE_ERROR_THRESHOLD){
                switchToZxingFallback();
              }
            }
          } else if(scannerEngineType==='zxing' && zxingReader){
            // CPU tejash uchun har loop iteratsiyasida bitta burchak sinaladi,
            // navbat bilan 0/90/180/270 — shu bilan barcha yo'nalishlar qamrab olinadi.
            const angle = ZXING_ROTATIONS[rotationIndex % ZXING_ROTATIONS.length];
            rotationIndex++;
            try{
              const rotated = getRotatedScannerCanvas(frame, angle);
              const result = zxingReader.decodeFromCanvas(rotated);
              if(result) handleDetected(result.getText());
            }catch(zerr){
              // NotFoundException — bu kadrda kod topilmadi, bu normal holat.
              scanDebug('rotation', angle, 'da kod topilmadi');
            }
          }
        }
      }catch(err){
        scanDebug('frame processing xatosi (davom etamiz)', err);
      }
      runLoop();
    }, SCAN_INTERVAL_MS);
  }

  (async ()=>{
    try{
      const stream = await acquireCameraStream();
      if(token!==scannerLoopToken){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} return; }
      scannerStream = stream;
      videoEl.srcObject = stream;
      await videoEl.play().catch(()=>{});
      await new Promise(res=>{
        if(videoEl.readyState>=2) return res();
        videoEl.onloadedmetadata = ()=>res();
        setTimeout(res,1500);
      });
      if(token!==scannerLoopToken) return;
      tuneCameraTrack(stream);
      scanDebug('camera started');

      const engine = await pickScannerEngine();
      if(token!==scannerLoopToken) return;
      if(!engine){
        onError && onError("Skaner kutubxonasi yuklanmadi — internet aloqasini tekshiring");
        return;
      }
      scannerEngineType = engine;
      scanEngineActive = true;
      runLoop();
    }catch(err){
      scanEngineActive = false;
      onError && onError(err && err.message ? err.message : "Kameraga ulanib bo'lmadi (ruxsat berilmagan bo'lishi mumkin)");
    }
  })();
}

function stopScanEngine(){
  scanEngineActive = false;
  scannerLoopToken++; // eski (hozir to'xtayotgan) loop o'zini shu bilan to'xtatadi
  if(scannerLoopTimer){ clearTimeout(scannerLoopTimer); scannerLoopTimer = null; }
  if(scannerRAF){ clearTimeout(scannerRAF); scannerRAF = null; }
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader=null; }
  scannerDetector = null;
  scannerEngineType = null;
  if(scannerStream){ try{ scannerStream.getTracks().forEach(t=>t.stop()); }catch(e){} scannerStream=null; }
  if(scannerVideoEl){
    try{
      if(scannerVideoEl.srcObject){ try{ scannerVideoEl.srcObject.getTracks().forEach(t=>t.stop()); }catch(e){} }
      scannerVideoEl.srcObject = null;
    }catch(e){}
    scannerVideoEl = null;
  }
  scannerLastCode = null;
  scannerLastTime = 0;
  scanDebug('scanner stopped');
}
function toggleCamera(){
  if(scanEngineActive){ stopScanEngine(); updateStandaloneCamUI(false); return; }
  const video = document.getElementById('scanVideo');
  if(!video) return;
  video.style.display='block';
  const ph=document.getElementById('scanPlaceholder'); if(ph) ph.style.display='none';
  updateStandaloneCamUI(true);
  startScanEngine(video, (code)=>{
    document.getElementById('manualCode').value = code;
    stopScanEngine();
    updateStandaloneCamUI(false);
    scanLookup();
  }, (err)=>{
    toast(err, true);
    updateStandaloneCamUI(false);
  });
}
function updateStandaloneCamUI(on){
  const st=document.getElementById('scanStatus'); if(st) st.textContent = on? "Kamera yoqildi — kodni ramka ichiga tuting" : "Kamerani yoqish uchun tugmani bosing";

  if(!on){
    const video=document.getElementById('scanVideo'); if(video){ video.style.display='none'; video.srcObject=null; }
    const ph=document.getElementById('scanPlaceholder'); if(ph) ph.style.display='flex';
  }
}

/* ---------------- CART CORE ---------------- */
function cartFind(pid){ return cart.find(c=>c.productId===pid); }
function cartAdd(pid, qty){
  const p = DB.products.find(x=>x.id===pid);
  if(!p) return false;
  if(qty<=0) return false;
  if(requiresWholeQty(p)) qty = Math.round(qty);
  const existing = cartFind(pid);
  const currentQty = existing? existing.qty : 0;
  const newQty = roundQty(currentQty+qty);
  if(newQty > p.qty){ toast("Omborda yetarli qoldiq yo'q",true); return false; }
  if(existing){ existing.qty = newQty; delete existing.moneyEntered; }
  else cart.push({productId:pid, qty:roundQty(qty)});
  if(currentPage==='sales') renderCart();
  return true;
}
/* Pul bo'yicha sotish: qadoqsiz (kg/litr) mahsulot uchun kiritilgan so'm miqdoridan avtomatik kg/litr hisoblanadi.
   Jami summa har doim aynan kiritilgan pul bilan teng bo'lishi uchun moneyEntered saqlanadi (yaxlitlash xatosi bo'lmasin). */
function cartAddMoney(pid, moneyAmt){
  const p = DB.products.find(x=>x.id===pid);
  if(!p || !canSellByMoney(p)) return false;
  moneyAmt = Math.round(Number(moneyAmt)||0);
  if(moneyAmt<=0) return false;
  const addQty = roundQty(moneyAmt/p.price);
  if(addQty<=0) return false;
  const existing = cartFind(pid);
  const currentQty = existing? existing.qty : 0;
  const newQty = roundQty(currentQty+addQty);
  if(newQty > p.qty){ toast("Omborda yetarli qoldiq yo'q",true); return false; }
  const currentMoney = existing ? (existing.moneyEntered!=null ? existing.moneyEntered : Math.round(existing.qty*p.price)) : 0;
  if(existing){ existing.qty = newQty; existing.moneyEntered = currentMoney+moneyAmt; }
  else cart.push({productId:pid, qty:addQty, moneyEntered:moneyAmt});
  if(currentPage==='sales') renderCart();
  return true;
}
function cartRemove(pid){ cart = cart.filter(c=>c.productId!==pid); renderCart(); }
function clearCart(){
  if(!cart.length) return;
  if(!confirm("Savatni tozalashni tasdiqlaysizmi?")) return;
  cart=[]; cardReceiptImage=null; cartDiscount={type:'none',value:0}; renderCart();
}
/* Savdo gridida/qidiruvda/skanerlashda bosilganda — imkon qadar kam bosish bilan
   to'g'ridan-to'g'ri savatga qo'shiladi (qayta bosilsa miqdori +1 oshadi).
   Faqat pul bo'yicha ham sotilishi mumkin bo'lgan qadoqsiz (kg/litr) mahsulotlarda
   aniq miqdor/summa kerak bo'lgani uchun tasdiqlash oynasi ochiladi. */
function addToCart(id){
  const p = DB.products.find(x=>x.id===id);
  if(!p) return;
  if(p.qty<=0){ toast("Bu mahsulot tugagan",true); return; }
  if(canSellByMoney(p)){ openScanProductModal(p, {returnToScan:false}); return; }
  const ok = cartAdd(p.id, 1);
  if(ok) toast(`${p.emoji||'📦'} ${p.name} savatga qo'shildi`);
}
function changeQty(id,delta){
  const item = cart.find(c=>c.productId===id);
  const p = DB.products.find(x=>x.id===id);
  const step = requiresWholeQty(p) ? 1 : 0.01;
  let newQty = roundQty(item.qty + delta*step);
  if(requiresWholeQty(p)) newQty = Math.round(newQty);
  if(newQty<=0){ cart=cart.filter(c=>c.productId!==id); }
  else if(newQty>p.qty){ toast("Omborda yetarli qoldiq yo'q",true); }
  else { item.qty = newQty; delete item.moneyEntered; }
  renderCart();
}
function setCartQty(id,val){
  const item = cart.find(c=>c.productId===id);
  const p = DB.products.find(x=>x.id===id);
  let qty = Number(val)||0;
  if(qty<0) qty=0;
  if(requiresWholeQty(p)) qty = Math.round(qty);
  if(qty>p.qty){ qty=p.qty; toast("Omborda yetarli qoldiq yo'q",true); }
  if(qty<=0){ cart=cart.filter(c=>c.productId!==id); renderCart(); return; }
  item.qty = roundQty(qty);
  delete item.moneyEntered;
  renderCart();
}

/* ---------------- LINE PRICE (always from product database — no per-line edits) ---------------- */
function maxDiscountPercent(){ const v = DB.roleRights[currentRole]?.maxDiscountPercent; return v==null?0:v; }
function lineUnitPrice(item,p){ return p.price; }
/* Pul bo'yicha qo'shilgan qatorlarda jami summa har doim mijoz kiritgan aniq so'm miqdoriga teng bo'ladi (moneyEntered) */
function lineGross(item,p){ return item.moneyEntered!=null ? item.moneyEntered : p.price*item.qty; }
function lineTotal(item,p){ return item.moneyEntered!=null ? item.moneyEntered : p.price*item.qty; }

/* ---------------- TOTALS ---------------- */
function cartSubtotal(){ return cart.reduce((a,c)=>{ const p=DB.products.find(x=>x.id===c.productId); return a+lineGross(c,p); },0); }
function cartLevelDiscountAmt(){
  const subtotal = cartSubtotal();
  if(cartDiscount.type==='percent') return subtotal*(Math.min(cartDiscount.value,100)/100);
  if(cartDiscount.type==='amount') return Math.min(Math.max(cartDiscount.value,0), subtotal);
  return 0;
}
function cartDiscountTotal(){
  const subtotal = cartSubtotal();
  return Math.min(cartLevelDiscountAmt(), subtotal);
}
function cartTotal(){ return cartSubtotal()-cartDiscountTotal(); }
function cartQtyTotal(){ return cart.reduce((a,c)=>a+c.qty,0); }
function isDeliveryOn(){ return !!document.getElementById('deliveryNeeded')?.checked; }
function currentDeliveryFee(){ return isDeliveryOn()? (Number(document.getElementById('dlv_price')?.value)||0) : 0; }
function currentGrandTotal(){ return cartTotal()+currentDeliveryFee(); }

  itemsBox.innerHTML = cart.length? cart.map(c=>{

        <button class="btn-ghost" onclick="cartRemove('${p.id}')" title="O'chirish">${icon('trash-2')}</button>

        <span style="font-size:11.5px;color:var(--text-faint);">${fmtQty(c.qty)} ${p.unit} · ${fmtNum(unitPrice)}</span>
        <span class="cell-strong">${fmtNum(lineTotal(c,p))}</span>

      ${p.packSize?`<div style="text-align:right;"><button class="btn-ghost btn-sm" onclick="calcPacks('${p.id}')" title="Konversiya kalkulyatori">${icon('calculator')} ${p.packUnit||'quti'}</button></div>`:''}
    </div>`;
  }).join('') : `<div class="cart-empty">${icon('shopping-cart')}<div>Savat bo'sh</div></div>`;

  const subtotal = cartSubtotal();
  const discount = cartDiscountTotal();
  const dlvOn = isDeliveryOn();

  const grand = subtotal-discount+dlvFee;
  document.getElementById('cartTotals').innerHTML = `
    <div class="ct-row"><span>Jami mahsulot</span><span>${cart.length} xil</span></div>
    <div class="ct-row"><span>Jami miqdor</span><span>${fmtQty(cartQtyTotal())}</span></div>
    <div class="ct-row"><span>Umumiy summa</span><span>${fmtNum(subtotal)}</span></div>
    <div class="ct-row" style="align-items:center;"><span>Chegirma</span><button type="button" class="discount-btn ${discount>0?'has-value':''}" onclick="openDiscountModal()">${icon('percent')}<span>${discount>0? (cartDiscount.type==='percent'? cartDiscount.value+'% CHEGIRMA' : fmtNum(discount)+" so'm") : 'CHEGIRMA'}</span></button></div>
    ${dlvOn?`<div class="ct-row"><span>Yetkazib berish</span><span>${fmtNum(dlvFee)}</span></div>`:''}
    <div class="ct-row total"><span>Yakuniy summa</span><span id="grandTotalVal">${fmt(grand)}</span></div>
    <button class="btn-ghost btn-sm" onclick="clearCart()" style="margin-top:4px;">${icon('trash-2')} Savatni tozalash</button>`;

  renderPayExtra();
  lucide.createIcons();
}

      </div>
      <div class="field">
        <label id="discValueLabel">Chegirma (%)</label>
        <input type="number" id="discModalValue" inputmode="decimal" min="0" value="${cartDiscount.value||0}" oninput="updateDiscountModalPreview()">
      </div>
      <div id="discModalErr"></div>
      <div style="margin-top:8px;font-size:13px;background:var(--surface-2);border-radius:var(--radius-m);padding:10px 12px;">
        <div class="ct-row"><span>Chegirma miqdori</span><span id="discModalAmt" class="cell-strong">−0</span></div>
        <div class="ct-row total"><span>Yakuniy summa</span><span id="discModalFinal">${fmtNum(subtotal)}</span></div>
      </div>
    </div>
    <div class="modal-foot" style="gap:10px;">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Bekor qilish</button>
      <button class="btn btn-primary btn-block" onclick="saveDiscountModal()">${icon('check')} SAQLASH</button>
    </div>
  `);
  renderDiscTypeButtons();
  updateDiscountModalPreview();
}
function renderDiscTypeButtons(){
  const row = document.getElementById('discTypeRow'); if(!row) return;
  row.innerHTML = `
    <div class="pay-type ${discModalTempType==='percent'?'active':''}" onclick="setDiscModalType('percent')">${icon('percent')}<span>Foiz (%)</span></div>
    <div class="pay-type ${discModalTempType==='amount'?'active':''}" onclick="setDiscModalType('amount')">${icon('banknote')}<span>Summa (so'm)</span></div>`;
  lucide.createIcons();
}
function setDiscModalType(type){
  discModalTempType = type;
  renderDiscTypeButtons();
  updateDiscountModalPreview();
}
function updateDiscountModalPreview(){
  const subtotal = cartSubtotal();
  const type = discModalTempType;
  const labelEl = document.getElementById('discValueLabel');
  if(labelEl) labelEl.textContent = type==='percent' ? 'Chegirma (%)' : "Chegirma (so'm)";
  let val = Number(document.getElementById('discModalValue').value); if(isNaN(val)||val<0) val=0;
  let warnMsg='';
  if(type==='percent'){
    if(val>100) val=100;
    if(currentRole!=='admin'){
      const cap = maxDiscountPercent();
      if(val>cap){ val=cap; warnMsg = `Chegirma limiti: ${cap}%`; document.getElementById('discModalValue').value=val; }
    }
  } else {
    if(val>subtotal) val=subtotal;
  }
  const amt = type==='percent' ? subtotal*(val/100) : val;
  document.getElementById('discModalAmt').textContent = amt>0? '−'+fmtNum(amt) : '0';
  document.getElementById('discModalFinal').textContent = fmtNum(Math.max(subtotal-amt,0));
  const errEl = document.getElementById('discModalErr');
  if(errEl){ errEl.innerHTML = warnMsg?`<div class="alert alert-warning" style="margin-top:4px;">${icon('alert-triangle')}<span>${warnMsg}</span></div>`:''; lucide.createIcons(); }
}
function saveDiscountModal(){
  const subtotal = cartSubtotal();
  const type = discModalTempType;
  let val = Number(document.getElementById('discModalValue').value); if(isNaN(val)||val<0) val=0;
  if(type==='percent'){
    if(val>100) val=100;
    if(currentRole!=='admin'){
      const cap = maxDiscountPercent();
      if(val>cap){ val=cap; toast(`Chegirma limiti: ${cap}%`,true); }
    }
  } else {
    if(val>subtotal){ val=subtotal; }
  }
  cartDiscount = {type: val>0? type : 'none', value: val};
  closeModal();
  renderCart();
}

/* ---------------- VALIDATE + COMPLETE SALE ---------------- */
function validateSale(){
  if(!cart.length) return "Savat bo'sh";
  for(const c of cart){
    const p = DB.products.find(x=>x.id===c.productId);
    if(!p || c.qty>p.qty) return `"${p?p.name:'Mahsulot'}" uchun omborda yetarli qoldiq yo'q`;
  }
  const grand = currentGrandTotal();
  if(selectedPayType==='naqd'){
    const given = Number(document.getElementById('cashGiven').value);
    if(isNaN(given) || given<=0) return "Mijoz bergan pul summasini kiriting";
    if(given<grand) return "Berilgan pul yetarli emas";
  } else if(selectedPayType==='aralash'){
    const cashV = Number(document.getElementById('mixCash').value)||0;
    const cardV = Number(document.getElementById('mixCard').value)||0;
    if(Math.round((cashV+cardV) - grand) !== 0) return "To'lovlar jami chek summasiga teng emas";
  } else if(selectedPayType==='qarz'){
    const custId = document.getElementById('saleCustomer')?.value;
    if(!custId) return "Qarzga sotish uchun mijozni tanlang";
  }
  if(selectedPayType==='karta' && !cardReceiptImage){
    return "Karta to'lovi uchun chek rasmini yuklang yoki suratga oling.";
  }
  if(selectedPayType==='aralash'){
    const cardV = Number(document.getElementById('mixCard').value)||0;
    if(cardV>0 && !cardReceiptImage) return "Karta to'lovi uchun chek rasmini yuklang yoki suratga oling.";
  }
  if(isDeliveryOn()){
    const addr = document.getElementById('dlv_address')?.value.trim();
    const phone = document.getElementById('dlv_phone')?.value.trim();
    const price = Number(document.getElementById('dlv_price')?.value);
    if(!addr || !phone || isNaN(price) || price<0) return "Yetkazib berish ma'lumotlarini to'liq kiriting (manzil, telefon, narx)";
  }
  return null;
}
function completeSale(){
  const err = validateSale();
  if(err){ toast(err, true); return; }

  const grand = currentGrandTotal();
  const dlvFee = currentDeliveryFee();
  const subtotal = cartSubtotal();
  const discountTotal = cartDiscountTotal();
  let paidNow=grand, customerId=document.getElementById('saleCustomer').value||null, changeAmt=0, cashPart=0, cardPart=0;

  if(selectedPayType==='naqd'){
    const given = Number(document.getElementById('cashGiven').value);
    changeAmt = given-grand; paidNow=grand;
  } else if(selectedPayType==='aralash'){
    cashPart = Number(document.getElementById('mixCash').value)||0;
    cardPart = Number(document.getElementById('mixCard').value)||0;
    paidNow = grand;
  } else if(selectedPayType==='qarz'){
    const part = Number(document.getElementById('partNow').value)||0;
    paidNow = Math.min(part, grand);
  }

  const empName = document.getElementById('roleSelect').selectedOptions[0].textContent.split('—')[1].trim();
  const items = cart.map(c=>{
    const p = DB.products.find(x=>x.id===c.productId);
    const unitPrice = lineUnitPrice(c,p);
    const total = lineTotal(c,p);
    // ombordan REAL miqdor partiyalar (FIFO / muddati yaqinini birinchi) tartibida ayiriladi (pul bo'yicha sotilganda ham)
    const consumedCost = consumeFromBatches(p, c.qty);
    return {productId:p.id,name:p.name,brand:p.brand,sku:p.sku,qty:c.qty,unit:p.unit,price:unitPrice,cost:consumedCost,lineTotal:total,moneyEntered:c.moneyEntered!=null?c.moneyEntered:null};
  });

  const needsCardImg = selectedPayType==='karta' || (selectedPayType==='aralash' && cardPart>0);
  DB.saleCounter = (DB.saleCounter||0)+1;
  const checkNo = 'A-'+String(DB.saleCounter).padStart(6,'0');
  const sale = {id:uid('s'),checkNo,date:new Date().toISOString(),employee:empName,customerId,items,
    subtotal,discountTotal,deliveryFee:dlvFee,total:grand,paymentType:selectedPayType,paidNow,change:changeAmt,cashPart,cardPart,status:'yakunlangan',
    cardReceiptImage: needsCardImg ? cardReceiptImage : null};
  DB.sales.push(sale);

  if(selectedPayType==='qarz' && customerId){
    const c = DB.customers.find(x=>x.id===customerId);
    const debtAmt = grand-paidNow;
    c.debtTotal += debtAmt;
    c.dueDate = document.getElementById('debtDue').value || new Date(Date.now()+7*86400000).toISOString().slice(0,10);
    const note = document.getElementById('debtNote').value.trim();
    c.history.push({date:sale.date,type:'qarz',amount:debtAmt,note:(note?note+' — ':'')+`Chek #${checkNo}`});
  }

  let delivery = null;
  if(isDeliveryOn()){
    delivery = {
      id:uid('d'), saleId:sale.id, date:sale.date,
      customerName:customerId?(DB.customers.find(x=>x.id===customerId)||{}).name||'':'',
      address:document.getElementById('dlv_address').value.trim(),
      phone:document.getElementById('dlv_phone').value.trim(),
      price:dlvFee,
      driver:document.getElementById('dlv_driver').value.trim(),
      transport:document.getElementById('dlv_transport').value.trim(),
      status:'Kutilmoqda'
    };
    DB.deliveries.push(delivery);
    logActivity(`Yetkazib berish buyurtma qilindi — chek #${checkNo}`);
  }

  logActivity(`Savdo yakunladi (#${checkNo}): ${items.map(i=>i.name+' x'+fmtQty(i.qty)).join(', ')} — ${fmt(grand)}`);
  save();

  cart=[]; selectedPayType='naqd'; cardReceiptImage=null; cartDiscount={type:'none',value:0};
  renderPage();
  openReceiptModal(sale.id);
}

function changeScanQty(delta){
  const p = DB.products.find(x=>x.id===scanModalProductId); if(!p) return;
  const step = requiresWholeQty(p) ? 1 : 0.01;
  const input = document.getElementById('scanQtyInput');
  let qty = roundQty((Number(input.value)||0)+delta*step);
  if(qty<0) qty=0;
  if(requiresWholeQty(p)) qty = Math.round(qty);

  const p = DB.products.find(x=>x.id===scanModalProductId);

  if(isNaN(v)||v<0) v=0;
  if(p && requiresWholeQty(p)) v = Math.round(v);
  document.getElementById('scanQtyInput').value = v;
  clearScanProductErr();
}
function confirmScanAddToCart(){
  const p = DB.products.find(x=>x.id===scanModalProductId);
  if(!p) return;
  if(canSellByMoney(p) && scanSaleMode==='money'){
    const money = Math.round(Number(document.getElementById('scanMoneyInput').value)||0);
    if(!money || money<=0){ showScanProductErr("Summani to'g'ri kiriting (0 dan katta bo'lishi shart)"); return; }
    const addQty = roundQty(money/p.price);
    const existing = cartFind(p.id);
    const currentCartQty = existing? existing.qty : 0;
    if(roundQty(currentCartQty+addQty) > p.qty){ showScanProductErr("Omborda yetarli qoldiq yo'q"); return; }
    const ok = cartAddMoney(p.id, money);
    if(!ok) return;
    toast(`${p.emoji} ${p.name} savatga qo'shildi`);
    const resume = scanModalReturnToScan;
    closeModal();
    if(resume) openSalesScanModal();
    else if(currentPage==='sales') renderCart();
    return;
  }
  const qty = roundQty(Number(document.getElementById('scanQtyInput').value)||0);
  if(!qty || qty<=0){ showScanProductErr("Miqdorni to'g'ri kiriting (0 dan katta bo'lishi shart)"); return; }
  if(requiresWholeQty(p) && Math.abs(qty-Math.round(qty))>1e-9){ showScanProductErr("Bu mahsulotda faqat butun miqdor (1, 2, 3 ...) kiritish mumkin"); return; }
  const existing = cartFind(p.id);
  const currentCartQty = existing? existing.qty : 0;
  if(roundQty(currentCartQty+qty) > p.qty){ showScanProductErr("Omborda yetarli qoldiq yo'q"); return; }
  const ok = cartAdd(p.id, qty);
  if(!ok) return;
  toast(`${p.emoji} ${p.name} savatga qo'shildi`);
  const resume = scanModalReturnToScan;
  closeModal();
  if(resume) openSalesScanModal();
  else if(currentPage==='sales') renderCart();
}

/* Keyboard-wedge: USB/Bluetooth barcode scanners type fast + Enter */
document.addEventListener('keydown', function(e){
  if(currentPage!=='sales' && currentPage!=='scanner') return;
  const now = Date.now();
  if(e.key==='Enter'){
    if(wedgeBuffer.length>=3 && (now-wedgeLastTime)<80){
      e.preventDefault();
      if(currentPage==='sales') handleScannedCode(wedgeBuffer);
      else { const mc=document.getElementById('manualCode'); if(mc){ mc.value=wedgeBuffer; scanLookup(); } }
    }
    wedgeBuffer=''; wedgeLastTime=now; return;
  }
  if(e.key.length===1){
    if(now-wedgeLastTime>80){ wedgeBuffer=''; }
    wedgeBuffer += e.key;
    wedgeLastTime = now;
  }
});

/* ================================================================
   PACK / CONVERSION CALCULATOR (tied to product.packUnit/packSize)
   ================================================================ */
function calcPacks(pid){
  const p = DB.products.find(x=>x.id===pid);
  if(!p || !p.packSize){ toast("Bu mahsulotda o'lchov konversiyasi sozlanmagan",true); return; }
  const need = prompt(`Kerakli miqdorni kiriting (${p.unit}):`);
  if(need===null) return;
  const n = Number(need);
  if(!n || n<=0){ toast("Miqdorni to'g'ri kiriting",true); return; }
  const packs = Math.ceil((n/p.packSize) - 1e-9);
  const actualQty = Math.round(packs*p.packSize*100)/100;
  if(actualQty>p.qty){ toast("Omborda yetarli qoldiq yo'q",true); return; }
  const existing = cartFind(pid);
  if(existing) existing.qty = actualQty;
  else cart.push({productId:pid,qty:actualQty});
  toast(`${packs} ${p.packUnit||"quti"} kerak (= ${fmtQty(actualQty)} ${p.unit})`);
  if(currentPage==='sales') renderCart();
}
